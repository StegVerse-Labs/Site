<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StegVerse Demo Debug</title></head>
<body>
<h1>StegVerse Demo — Debug</h1>
<p>This legacy diagnostic no longer contains a hosted-provider endpoint.</p>
<label for="api">Admitted StegVerse API origin</label>
<input id="api" value="" placeholder="https://stegverse.example/api">
<button id="test">Test Evaluate</button>
<pre id="result">Idle.</pre>
<script>
document.getElementById('test').addEventListener('click', async () => {
  const out = document.getElementById('result');
  const api = document.getElementById('api').value.trim().replace(/\/$/, '');
  if (!api) { out.textContent = 'FAIL-CLOSED: no admitted API origin supplied.'; return; }
  const payload = {source:'sdk',demo_id:'demo_sdk_default',commit_states:[[0.234,-0.156,0.089],[-0.312,0.445,-0.078]],proposed_state:[0.089,-0.045,0.056],metadata:{generated_by:'default',tier:0}};
  try {
    const response = await fetch(api + '/v1/demo/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    out.textContent = JSON.stringify(await response.json(), null, 2);
  } catch (error) {
    out.textContent = 'ERROR: ' + String(error);
  }
});
</script>
</body>
</html>
