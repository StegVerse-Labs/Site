<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Test Account</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}.card{width:min(430px,92vw);padding:26px;border:1px solid #7776;border-radius:16px}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{width:100%;font:inherit;padding:12px;border-radius:9px;border:1px solid #7778;background:Canvas;color:CanvasText}button{margin-top:16px;font-weight:800}.status{margin:0 0 16px;font-weight:800}.testbox{margin-top:16px;padding:12px;border:1px dashed #7778;border-radius:9px}.small{font-size:.86rem;opacity:.7}</style></head><body><main class="card"><div id="status" class="status">CREATE ACCOUNT</div><form id="account-form"><label>Username</label><input id="username" required autocomplete="off"><label>Password</label><input id="password" type="password" required><label>Recovery method</label><select id="recovery-type"><option value="EMAIL">Email</option><option value="SMS">Text message (SMS)</option></select><label id="recovery-label">Email address</label><input id="recovery-value" required><button type="submit">Create account</button></form><div id="verify" hidden><div id="delivery" class="testbox"></div><label>Verification code</label><input id="code" inputmode="numeric"><button id="verify-button" type="button">Verify recovery method</button></div><p class="small">TEST_ONLY delivery: this page does not claim to send email or SMS. It proves the account/recovery state machine until a real transport is attached.</p><p><a href="generic-login-test.html">Back to login</a></p></main><script>(()=>{'use strict';const KEY='stegverse.generic-login.accounts.v1';const form=document.getElementById('account-form'),status=document.getElementById('status'),type=document.getElementById('recovery-type'),value=document.getElementById('recovery-value'),label=document.getElementById('recovery-label'),verify=document.getElementById('verify'),delivery=document.getElementById('delivery'),code=document.getElementById('code');let pending=null;type.addEventListener('change',()=>{label.textContent=type.value==='EMAIL'?'Email address':'Mobile number';});async function sha(v){const b=new TextEncoder().encode(String(v));const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('');}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(v){localStorage.setItem(KEY,JSON.stringify(v));}form.addEventListener('submit',async e=>{e.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const recoveryType=type.value,recoveryValue=value.value.trim();if(!username||!password||!recoveryValue){status.textContent='FAILED';return;}const challenge=String(Math.floor(100000+Math.random()*900000));pending={username,passwordDigest:await sha(password),recoveryType,recoveryValue,challenge};verify.hidden=false;delivery.textContent=`TEST_ONLY ${recoveryType} challenge for ${recoveryValue}: ${challenge}`;status.textContent='VERIFY RECOVERY';document.getElementById('password').value='';});document.getElementById('verify-button').addEventListener('click',()=>{if(!pending||code.value.trim()!==pending.challenge){status.textContent='FAILED';return;}const accounts=load();accounts[pending.username]={passwordDigest:pending.passwordDigest,recoveryType:pending.recoveryType,recoveryValue:pending.recoveryValue,recoveryVerified:true};save(accounts);pending=null;code.value='';verify.hidden=true;status.textContent='ACCOUNT CREATED';});})();</script></body></html>
