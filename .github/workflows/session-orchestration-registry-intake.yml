name: Session Orchestration Registry Intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/session-registry-intake-requests/*.json"
      - "scripts/admit_session_consolidation.py"
      - "tests/test_admit_session_consolidation.py"
      - ".github/workflows/session-orchestration-registry-intake.yml"

permissions:
  contents: write

concurrency:
  group: session-orchestration-registry-intake
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run registry intake tests
        run: python -m unittest tests.test_admit_session_consolidation -v
      - name: Apply approved registry intake requests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          requests=(data/session-registry-intake-requests/*.json)
          if [ ${#requests[@]} -eq 0 ]; then
            echo "No registry intake requests found"
            exit 1
          fi
          for request in "${requests[@]}"; do
            receipt=$(python - "$request" <<'PY'
          import json, sys
          request = json.load(open(sys.argv[1], encoding="utf-8"))
          if request.get("requested_action") != "ADMIT_IF_VALIDATED" or request.get("fail_closed") is not True:
              raise SystemExit("request is not authorized for fail-closed admission")
          value = request.get("receipt")
          if not isinstance(value, str) or not value:
              raise SystemExit("request receipt path missing")
          print(value)
          PY
            )
            python scripts/admit_session_consolidation.py --receipt "$receipt" --apply
          done
      - name: Validate resulting retirement registry
        run: python scripts/check_session_retirement.py
      - name: Commit admitted registry state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/session-orchestration-registry.json; then
            echo "Registry already contains all approved intakes"
            exit 0
          fi
          git config user.name "stegverse-orchestration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/session-orchestration-registry.json
          git commit -m "chore(session-orchestration): admit validated session consolidation"
          git push origin HEAD:main
      - name: Upload registry intake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-registry-intake-report
          path: session_registry_intake.report.json
          if-no-files-found: error
      - name: Upload retirement validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-intake-retirement-report
          path: session_retirement.report.json
          if-no-files-found: error
