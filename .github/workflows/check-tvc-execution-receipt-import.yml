name: Check TVC Execution Receipt Import

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/tvc_execution_receipt_import.schema.json"
      - "scripts/check_tvc_execution_receipt_import.py"
      - "tests/test_tvc_execution_receipt_import.py"
      - ".github/workflows/check-tvc-execution-receipt-import.yml"
      - "tasks/SITE-TVC-RUNTIME-ASSIST-001.json"
  push:
    branches: [main]
    paths:
      - "schemas/tvc_execution_receipt_import.schema.json"
      - "scripts/check_tvc_execution_receipt_import.py"
      - "tests/test_tvc_execution_receipt_import.py"
      - ".github/workflows/check-tvc-execution-receipt-import.yml"
      - "tasks/SITE-TVC-RUNTIME-ASSIST-001.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile validator
        run: python -m py_compile scripts/check_tvc_execution_receipt_import.py
      - name: Run regression tests
        run: python -m pytest -q tests/test_tvc_execution_receipt_import.py
      - name: Validate schema JSON
        run: python -m json.tool schemas/tvc_execution_receipt_import.schema.json >/dev/null
