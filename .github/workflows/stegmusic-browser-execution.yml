name: StegMusic Browser Execution
on:
  pull_request:
    paths:
      - 'ecosystem-music.html'
      - 'assets/ecosystem-music*.js'
      - 'tests/test_stegmusic_browser.py'
      - '.github/workflows/stegmusic-browser-execution.yml'
      - 'scripts/check_stegmusic_browser_automation_contract.py'
  push:
    branches: [main]
    paths:
      - 'ecosystem-music.html'
      - 'assets/ecosystem-music*.js'
      - 'tests/test_stegmusic_browser.py'
      - '.github/workflows/stegmusic-browser-execution.yml'
      - 'scripts/check_stegmusic_browser_automation_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start static Site server
        # The socket is bound and listening before this step ends (the parent exits only after the bind),
        # so the next step's requests are queued by the kernel; nothing polls for readiness.
        run: |
          python - <<'PY'
          import http.server, os
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 8000), http.server.SimpleHTTPRequestHandler)
          pid = os.fork()
          if pid:
              open('/tmp/stegmusic-http.pid', 'w').write(str(pid))
              os._exit(0)
          os.setsid()
          log = os.open('/tmp/stegmusic-http.log', os.O_WRONLY | os.O_CREAT | os.O_APPEND)
          os.dup2(log, 1); os.dup2(log, 2)
          server.serve_forever()
          PY
          curl --fail --silent http://127.0.0.1:8000/ecosystem-music.html >/dev/null
      - name: Execute StegMusic browser runtime
        run: python tests/test_stegmusic_browser.py
      - name: Stop static Site server
        if: always()
        run: |
          test ! -f /tmp/stegmusic-http.pid || kill "$(cat /tmp/stegmusic-http.pid)" || true
      - name: Upload browser execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stegmusic-browser-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/stegmusic-browser-execution.json
          if-no-files-found: error
          retention-days: 30
