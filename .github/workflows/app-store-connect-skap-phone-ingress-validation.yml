name: App Store Connect SKAP Phone Ingress Validation

on:
  pull_request:
    paths:
      - 'assets/stegos-apple/**'
      - 'stegos-apple-credential.html'
      - 'scripts/check_app_store_connect_skap_phone_ingress.py'
      - 'docs/APP_STORE_CONNECT_SKAP_IPHONE_INGRESS_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/SITE-APP-STORE-CONNECT-SKAP-INGRESS-20260909.json'
      - '.github/workflows/app-store-connect-skap-phone-ingress-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate current-iPhone App Store Connect SKAP ingress source
        run: python scripts/check_app_store_connect_skap_phone_ingress.py
      - name: Reject hosted App Store Connect secret interpolation
        run: |
          if grep -R -n -E 'secrets\.ASC_|\$\{\{[[:space:]]*secrets\.' \
            assets/stegos-apple stegos-apple-credential.html; then
            echo '::error::Hosted App Store Connect secret interpolation detected'
            exit 1
          fi
      - name: Assert checked-in projections contain no real credential values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('assets/stegos-apple/app-store-connect-skap-ingress-config.json').read_text())
          route=json.loads(Path('assets/stegos-apple/app-store-connect-skap-intr-route.json').read_text())
          assert config['status']=='NOT_PROVISIONED'
          assert config['recipient_key_id'] is None
          assert config['recipient_public_jwk'] is None
          assert route['status']=='NOT_PROVISIONED'
          assert route['public_ingress_url'] is None
          print('checked_in_apple_credential_values=false')
          PY
