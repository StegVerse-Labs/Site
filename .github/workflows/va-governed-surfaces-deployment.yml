name: VA Governed Surfaces Deployment Observer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'va-disability-claim-guide.html'
      - 'va-claims-chat.html'
      - 'data/va-claim-assistant/chat-capability-state.json'
      - 'scripts/observe_va_governed_surfaces.py'
      - '.github/workflows/va-governed-surfaces-deployment.yml'

permissions: {}

concurrency:
  group: va-governed-surfaces-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: StegVerse-Labs/Site
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Refuse credential-bearing validation configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN GITHUB_PAT INPUT_TOKEN; do
            if [[ -n "${!name-}" ]]; then
              echo "Credential-bearing environment is prohibited for VA governed-surface deployment validation: ${name}" >&2
              exit 1
            fi
          done
          echo 'VA_GOVERNED_SURFACES_CREDENTIAL_REFUSAL=PASS'

      - name: Fetch exact Site source anonymously
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
          echo "VA_GOVERNED_SURFACES_SOURCE_FETCH=PASS sha=$SOURCE_SHA"

      - name: Verify preinstalled Python
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('VA_GOVERNED_SURFACES_PYTHON=PASS')
          PY

      - name: Observe deployed governed surfaces
        run: python3 scripts/observe_va_governed_surfaces.py

      - name: Enforce verified deployment without repository writeback
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          receipt = json.load(open('data/va-claim-assistant/governed-surfaces-deployment.json'))
          if receipt.get('state') != 'VERIFIED':
              raise SystemExit(f"VA_GOVERNED_SURFACES_NOT_VERIFIED:{receipt.get('blockers')}")
          for name in ('guide', 'chat', 'capability'):
              surface = receipt.get('surfaces', {}).get(name, {})
              if surface.get('http_status') != 200 or surface.get('byte_equal') is not True:
                  raise SystemExit(f"VA_SURFACE_NOT_EQUAL:{name}:{surface}")
          if receipt.get('private_document_upload_enabled') is not False:
              raise SystemExit('VA_PRIVATE_DOCUMENT_UPLOAD_BOUNDARY_CHANGED')
          if receipt.get('automated_filing_enabled') is not False:
              raise SystemExit('VA_AUTOMATED_FILING_BOUNDARY_CHANGED')
          if receipt.get('authority_effect') is not False or receipt.get('activation_effect') is not False:
              raise SystemExit('VA_AUTHORITY_BOUNDARY_CHANGED')
          print('VA_GOVERNED_SURFACES_DEPLOYMENT=VERIFIED')
          print('VA_GOVERNED_SURFACES_REPOSITORY_WRITEBACK=NONE')
          print('VA_GOVERNED_SURFACES_ARTIFACT_CUSTODY=NONE')
          PY
