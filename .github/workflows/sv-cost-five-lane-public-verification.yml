name: SV Cost Five-Lane Public Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'papers/sv-cost-relational-analysis.html'
      - 'papers/SV_COST_FIVE_LANE_MIRROR_HANDOFF.md'
      - 'scripts/verify_sv_cost_five_lane_publication.py'
      - 'scripts/finalize_sv_cost_five_lane_publication.py'
      - '.github/workflows/sv-cost-five-lane-public-verification.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: sv-cost-five-lane-public-verification
  cancel-in-progress: false

jobs:
  verify-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deployed paper body fail closed
        id: verify
        continue-on-error: true
        run: python scripts/verify_sv_cost_five_lane_publication.py

      - name: Upload inspectable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-cost-five-lane-public-verification
          path: papers/sv-cost-five-lane-public-verification.json

      - name: Finalize handoff from successful receipt
        if: steps.verify.outcome == 'success'
        run: python scripts/finalize_sv_cost_five_lane_publication.py

      - name: Commit terminal verification receipt
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'stegverse-publication-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add papers/sv-cost-five-lane-public-verification.json papers/SV_COST_FIVE_LANE_MIRROR_HANDOFF.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Verify deployed five-lane publication and release claim'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Close durable verification issue
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 173 --repo StegVerse-Labs/Site --reason completed --comment "Public body verification passed. HTTP 200, all required five-lane result and bounded-claim markers present. Receipt: papers/sv-cost-five-lane-public-verification.json. Handoff claim released."

      - name: Fail closed for retry
        if: steps.verify.outcome != 'success'
        run: |
          echo 'Public paper body is not yet verifiably complete; receipt uploaded and issue #173 remains open.'
          exit 1
