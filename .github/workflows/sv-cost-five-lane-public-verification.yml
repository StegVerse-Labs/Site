name: SV Cost Five-Lane Public Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers/sv-cost-relational-analysis.html'
      - 'scripts/verify_sv_cost_five_lane_publication.py'
      - '.github/workflows/sv-cost-five-lane-public-verification.yml'

permissions: {}

concurrency:
  group: sv-cost-five-lane-public-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN CLOUDFLARE_API_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'SV_COST_VALIDATION_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'SV_COST_VALIDATION_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('SV_COST_VALIDATION_PYTHON=PASS')
          PY

      - name: Verify deployed paper body fail closed
        shell: bash
        env:
          SV_COST_PUBLIC_RECEIPT: /tmp/sv-cost-five-lane-public-verification.json
        run: |
          set -euo pipefail
          python3 scripts/verify_sv_cost_five_lane_publication.py
          cat "$SV_COST_PUBLIC_RECEIPT"

      - name: Confirm validation-only containment
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/sv-cost-five-lane-public-verification.yml').read_text(encoding='utf-8')
          forbidden = [
              'schedule:',
              'contents: write',
              'issues: write',
              'github.token',
              'GH_TOKEN:',
              'actions/checkout@',
              'actions/setup-python@',
              'actions/upload-artifact@',
              'git push',
              'gh issue close',
          ]
          present = [marker for marker in forbidden if marker in workflow]
          if present:
              raise SystemExit(f'forbidden terminal-loop authority/custody remains: {present}')
          required = ['workflow_dispatch:', 'push:', 'permissions: {}', 'cancel-in-progress: true']
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f'missing retained validation contract: {missing}')
          print('SV_COST_TERMINAL_LOOP_RETIRED=PASS')
          print('SV_COST_REPOSITORY_WRITEBACK=NONE')
          print('SV_COST_ISSUE_MUTATION=NONE')
          print('SV_COST_ARTIFACT_CUSTODY=NONE')
          print('SV_COST_RUNTIME_AUTHORITY=NONE')
          PY
