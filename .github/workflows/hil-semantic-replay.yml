name: HIL Semantic Replay

on:
  push:
    paths:
      - 'data/hil-semantic-replay-task-state.json'
      - 'data/fixtures/hil-semantic-transformation/semantic-event-replay-packet.json'
      - 'scripts/validate_hil_semantic_replay.py'
      - 'scripts/check_hil_semantic_replay_tasks.py'
      - '.github/workflows/hil-semantic-replay.yml'
  pull_request:
    paths:
      - 'data/hil-semantic-replay-task-state.json'
      - 'data/fixtures/hil-semantic-transformation/semantic-event-replay-packet.json'
      - 'scripts/validate_hil_semantic_replay.py'
      - 'scripts/check_hil_semantic_replay_tasks.py'
      - '.github/workflows/hil-semantic-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-and-reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate replay task ownership
        run: python scripts/check_hil_semantic_replay_tasks.py
      - name: Validate deterministic reconstruction
        run: python scripts/validate_hil_semantic_replay.py
      - name: Validate replay packet syntax
        run: python -m json.tool data/fixtures/hil-semantic-transformation/semantic-event-replay-packet.json >/dev/null
