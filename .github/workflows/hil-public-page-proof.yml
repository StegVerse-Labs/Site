name: HIL Public Page Proof

# Bound to a state transition: a completed GitHub Pages deployment. One request per HIL surface, no
# waiting or retrying (scripts/hil_public_page_proof.py); a mismatch is FAIL_CLOSED with its retry edge.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hil-public-page-proof
  cancel-in-progress: false

jobs:
  prove:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prove served HIL surfaces equal the deployed commit
        id: proof
        shell: bash
        env:
          DEPLOYED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/hil_public_page_proof.py --commit "$DEPLOYED_COMMIT"

      - name: Commit proof record
        if: ${{ always() && steps.proof.outcome != 'skipped' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add data/hil-public-page-proof-latest.json
          if git diff --cached --quiet; then
            echo "Proof record unchanged."
            exit 0
          fi
          git config user.name 'stegverse-hil-page-prover'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(hil): record public page proof'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
