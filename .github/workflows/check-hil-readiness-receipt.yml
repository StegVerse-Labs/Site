name: Check HIL Readiness Receipt

on:
  push:
    paths:
      - "data/hil-readiness/**"
      - "scripts/check_hil_readiness_receipt.py"
      - ".github/workflows/check-hil-readiness-receipt.yml"
      - "data/hil-activation-state.json"
  pull_request:
    paths:
      - "data/hil-readiness/**"
      - "scripts/check_hil_readiness_receipt.py"
      - ".github/workflows/check-hil-readiness-receipt.yml"
      - "data/hil-activation-state.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate imported HIL readiness observation
        run: python scripts/check_hil_readiness_receipt.py
