name: Session Orchestration Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/session-orchestration-registry.json"
      - "scripts/project_session_orchestration.py"
      - "tests/test_project_session_orchestration.py"
      - ".github/workflows/session-orchestration-project.yml"

permissions:
  contents: write

concurrency:
  group: session-orchestration-project
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run successor and archive queue tests
        run: python -m unittest tests.test_project_session_orchestration -v
      - name: Validate retirement registry before projection
        run: python scripts/check_session_retirement.py
      - name: Generate successor packets and archive queue
        run: python scripts/project_session_orchestration.py
      - name: Commit deterministic projections
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- data/session-orchestration-successor-packets.json data/session-orchestration-archive-queue.json)
          if [ -z "$changed" ]; then
            echo "Session orchestration projections are current"
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "stegverse-orchestration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/session-orchestration-successor-packets.json data/session-orchestration-archive-queue.json
          git commit -m "chore(session-orchestration): refresh successor and archive projections"
          git push origin HEAD:main
      - name: Verify committed projection content
        run: python scripts/project_session_orchestration.py --check
      - name: Upload successor packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-orchestration-successor-packets
          path: data/session-orchestration-successor-packets.json
          if-no-files-found: error
      - name: Upload archive queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-orchestration-archive-queue
          path: data/session-orchestration-archive-queue.json
          if-no-files-found: error
      - name: Upload retirement validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-orchestration-projection-retirement-report
          path: session_retirement.report.json
          if-no-files-found: error
