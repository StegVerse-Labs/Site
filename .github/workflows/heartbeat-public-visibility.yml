name: HeartBeat Public Visibility

on:
  push:
    paths:
      - 'index.html'
      - 'ecosystem-version.html'
      - 'heartbeat-transition/index.html'
      - 'data/heartbeat-public-visibility.json'
      - 'scripts/check_heartbeat_public_visibility.py'
      - '.github/workflows/heartbeat-public-visibility.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ecosystem-version.html'
      - 'heartbeat-transition/index.html'
      - 'data/heartbeat-public-visibility.json'
      - 'scripts/check_heartbeat_public_visibility.py'
      - '.github/workflows/heartbeat-public-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate HB32 public visibility contract
        run: python scripts/check_heartbeat_public_visibility.py
      - name: Assert non-authorizing publication boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/heartbeat-public-visibility.json').read_text())
          assert s['authority_effect']=='NONE'
          assert s['execution_authority']=='NONE'
          assert s['activation_effect'] is False
          assert s['published_visibility_state']=='PENDING_PUBLICATION_OBSERVATION'
          print('HEARTBEAT_PUBLIC_VISIBILITY_VALIDATION_ONLY_PASS')
          PY
