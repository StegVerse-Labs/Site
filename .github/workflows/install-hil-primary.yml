name: Install HIL Primary

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Repository-relative path to the approved v0.5 PDF or base64 file
        required: true
        default: incoming/Humans_as_the_Interoperability_Layer_Primary_Review_Candidate_v0_5.pdf
  push:
    paths:
      - incoming/Humans_as_the_Interoperability_Layer_Primary_Review_Candidate_v0_5.pdf
      - incoming/Humans_as_the_Interoperability_Layer_Primary_Review_Candidate_v0_5.pdf.b64
      - scripts/install_hil_primary.py

permissions:
  contents: write

concurrency:
  group: install-hil-primary
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve approved source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.source_path }}'
          candidates=(
            "${requested:-}"
            incoming/Humans_as_the_Interoperability_Layer_Primary_Review_Candidate_v0_5.pdf
            incoming/Humans_as_the_Interoperability_Layer_Primary_Review_Candidate_v0_5.pdf.b64
          )
          for candidate in "${candidates[@]}"; do
            if [[ -n "$candidate" && -f "$candidate" ]]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Approved Primary source not found." >&2
          exit 1

      - name: Verify and install exact artifact
        run: python scripts/install_hil_primary.py '${{ steps.source.outputs.path }}'

      - name: Run HIL validation
        run: |
          python scripts/check_hil_experiment.py
          python scripts/check_hil_master_record.py

      - name: Commit verified installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stegverse-hil-installer[bot]"
          git config user.email "stegverse-hil-installer[bot]@users.noreply.github.com"
          git add \
            data/hil-primary-v0.5-review.pdf.b64 \
            data/hil-primary-v0.5-installation-receipt.json \
            data/hil-experiment.json
          if git diff --cached --quiet; then
            echo "No installation changes to commit."
            exit 0
          fi
          git commit -m "Install verified HIL Primary v0.5 artifact"
          git push

      - name: Preserve installation receipt
        uses: actions/upload-artifact@v4
        with:
          name: hil-primary-installation-receipt
          path: data/hil-primary-v0.5-installation-receipt.json
          if-no-files-found: error
