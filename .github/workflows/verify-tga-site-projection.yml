name: Verify TGA Site Projection

on:
  pull_request:
    paths:
      - 'tga-reexamine.html'
      - 'assets/tga-reexamine.js'
      - 'data/tga/**'
      - 'data/tasks/SITE-1028-TGA-PROJECTION.json'
      - 'docs/TGA_SITE_PROJECTION_MIRROR_HANDOFF.md'
      - 'scripts/check_tga_site_projection.py'
      - '.github/workflows/verify-tga-site-projection.yml'
  push:
    branches: [main]
    paths:
      - 'tga-reexamine.html'
      - 'assets/tga-reexamine.js'
      - 'data/tga/**'
      - 'data/tasks/SITE-1028-TGA-PROJECTION.json'
      - 'docs/TGA_SITE_PROJECTION_MIRROR_HANDOFF.md'
      - 'scripts/check_tga_site_projection.py'
      - '.github/workflows/verify-tga-site-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate governed TGA Site projection contract
        run: python scripts/check_tga_site_projection.py
