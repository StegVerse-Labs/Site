name: HIL Deployment Investigation Handoff Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hil-deployment-investigation-handoff-update.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile canonical HIL handoffs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          investigation = '''## Deployment-authority investigation result — 2026-07-31T09:46-05:00

The push-triggered deployment run is now directly identified and preserved:

```text
Workflow: HIL Cloudflare Receiver Deploy
Workflow path: .github/workflows/hil-cloudflare-deploy.yml
Run ID: 30573565667
Run number: 2
Run attempt: 1
Triggering commit: d5d1598a8c523e8665e4550ee5c272df09256379
Event: push
Run conclusion: failure
Deployment job ID: 90976121829
Deployment job: deploy
First failed step: 4 — Validate deployment credentials
Step exit code: 1
Exact error: Process completed with exit code 1.
```

The complete job log proves that all three required Actions values resolved to empty strings:

```text
CLOUDFLARE_API_TOKEN: EMPTY
CLOUDFLARE_ACCOUNT_ID: EMPTY
HIL_REGISTRY_DATABASE_ID: EMPTY
```

The build-config, Wrangler deployment, live-readiness, and READY-enforcement steps were skipped. Therefore:

```text
Wrangler invoked: false
Cloudflare provider invoked: false
Worker inspected or changed: false
route inspected or changed: false
D1 database inspected or changed: false
HIL_REGISTRY binding inspected or changed: false
Cloudflare provider error: none; provider execution never began
failure class: GITHUB_ACTIONS_SECRET_BOUNDARY
```

Fresh public probes were captured in Actions run `30640006721` at `2026-07-31T14:46:22Z`:

```text
https://stegverse.org/api/hil/probes: HTTP 404, server GitHub.com, GitHub Pages file-not-found body
https://stegverse.org/api/hil/readiness: HTTP 404, server GitHub.com, GitHub Pages file-not-found body
probes_http_200: false
readiness_http_200: false
readiness_state_ready: false
canonical Primary v1.1 verified: false
canonical prompt v1.1 verified: false
HIL_REGISTRY bound and reachable: false
```

Preserved evidence:

```text
data/hil-cloudflare-deployment-investigation-d5d1598a.json
data/hil-cloudflare-deployment-failure-evidence-30573565667.json
evidence/hil-cloudflare-deployment-d5d1598a8c52/job-90976121829-credential-gate-failure.log
data/hil-public-runtime-probe-latest.json
data/hil-receiver-deployment-latest.json
```

No source, Worker route, unrelated `stegverse.org` route, D1 resource, or binding was modified. No secret value was guessed, exposed, or committed.

## Exact remaining external-authority block

The deployment-run retrieval block is resolved. The only proven deployment blocker is that `CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`, and `HIL_REGISTRY_DATABASE_ID` are absent or unavailable to the `StegVerse-Labs/Site` Actions secret context.

This session exposes no GitHub Actions-secret write operation and no authenticated Cloudflare control plane. Repair therefore requires an authorized secret boundary to populate those three values using the existing Cloudflare account and preserved HIL D1 database identity. The database must not be deleted or replaced. After the values exist, rerun `HIL Cloudflare Receiver Deploy` and preserve the first resulting Wrangler/provider evidence before any further repair.

'''

          newest = '''## Newest repository state inspected

```text
6cac4aa91cd1348c151379b693c92aab27809bff evidence(hil): preserve exact deployment credential failure
9673a9fb68a9289dd03d884294fe58f95d19a267 evidence(hil): preserve deployment credential gate excerpt
c2e479ee829bcc259b146669acbdfb5fc0b3c1c2 evidence(hil): capture current public receiver responses
4f7538ab74d9d538f39a225430cee3830f6dbded evidence(hil): record exact receiver deployment blocker
```
'''

          next_prompt = '''## Next-session prompt

Continue HIL production activation directly in `StegVerse-Labs/Site` on `main`. Read `docs/CROSS_SESSION_EXECUTION_HANDOFF_PROTOCOL.md`, `docs/SITE_MIRROR_HANDOFF.md`, `docs/HIL_MIRROR_HANDOFF.md`, `docs/HIL_SITE_MIRROR_HANDOFF.md`, `data/hil-cloudflare-deployment-failure-evidence-30573565667.json`, `data/hil-public-runtime-probe-latest.json`, and `data/hil-receiver-deployment-latest.json`. The original deployment run is proven as run `30573565667`, job `90976121829`, triggered by `d5d1598a8c523e8665e4550ee5c272df09256379`; it failed at `Validate deployment credentials` because `CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`, and `HIL_REGISTRY_DATABASE_ID` were all empty, before Wrangler or Cloudflare executed. Use an environment exposing authorized GitHub Actions-secret management or direct Cloudflare control-plane access. Preserve the existing account and D1 database identity; do not delete or replace the database and do not alter unrelated routes. Populate only the proven missing values, rerun the deployment, preserve the first Wrangler/provider result, and continue through the scoped `stegverse.org/api/hil/*` route, `HIL_REGISTRY`, `/api/hil/probes` HTTP 200, `/api/hil/readiness` HTTP 200 with `state: READY` and exact v1.1 identities, controlled-cycle exact-byte custody, negative cases, machine-derived participant readiness, hosted restart persistence, genuine participant receipt, private review, authenticated publication, Site projection, HIL Master Record release, release/tag evaluation, and authorized downstream verification. Update both HIL handoffs and machine-state records before responding. Stop only at live success or one exact newly proven provider/authority blocker.
'''

          for path_str, required_heading in (
              ('docs/HIL_MIRROR_HANDOFF.md', '## Required continuation path'),
              ('docs/HIL_SITE_MIRROR_HANDOFF.md', '## Required production path'),
          ):
              path = Path(path_str)
              text = path.read_text()
              text = re.sub(
                  r'## Newest repository state inspected\n\n```text\n.*?```\n',
                  newest,
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r'## Session capability verification.*?(?=' + re.escape(required_heading) + r')',
                  investigation,
                  text,
                  count=1,
                  flags=re.S,
              )
              if required_heading == '## Required continuation path':
                  text = text.replace(
                      '1. Retrieve the deployment run/job/logs for trigger commit `d5d1598a8c523e8665e4550ee5c272df09256379`, or inspect Cloudflare directly.\n2. Preserve the exact failed provider operation and repair only the proven defect.',
                      '1. Populate the three proven-empty deployment values at an authorized Actions secret boundary while preserving the existing Cloudflare account and HIL D1 identity.\n2. Rerun `HIL Cloudflare Receiver Deploy`; preserve the first Wrangler/provider result and repair only any newly proven defect.',
                  )
                  text = text.replace(
                      '- deployment workflow run/job/provider evidence',
                      '- authorized Cloudflare Actions secret values and rerun evidence',
                  )
              else:
                  text = text.replace(
                      '1. Retrieve the deployment run/job/logs or inspect Cloudflare directly.\n2. Preserve the exact provider failure and repair only the proven defect.',
                      '1. Populate the three proven-empty deployment values at an authorized Actions secret boundary while preserving the existing Cloudflare account and HIL D1 identity.\n2. Rerun `HIL Cloudflare Receiver Deploy`; preserve the first Wrangler/provider result and repair only any newly proven defect.',
                  )
                  text = text.replace(
                      '- exact deployment run/job/provider evidence',
                      '- authorized Cloudflare Actions secret values and rerun evidence',
                  )
              text = re.sub(
                  r'## Next-session prompt\n\n.*?(?=\n## Archive readiness)',
                  next_prompt.rstrip(),
                  text,
                  count=1,
                  flags=re.S,
              )
              path.write_text(text)
          PY

      - name: Commit handoff reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stegverse-hil-investigator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/HIL_MIRROR_HANDOFF.md docs/HIL_SITE_MIRROR_HANDOFF.md
          git commit -m 'docs(hil): record exact deployment secret-boundary failure'
          git pull --rebase origin main
          git push origin HEAD:main
