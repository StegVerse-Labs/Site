name: HIL Announcement Contract

on:
  push:
    branches: [main]
    paths:
      - 'hil-study-announcement.html'
      - 'hil-study-launch.html'
      - 'data/hil-announcement-status.json'
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - '.github/workflows/hil-announcement-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify announcement launch contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          status = json.loads(Path('data/hil-announcement-status.json').read_text(encoding='utf-8'))
          announcement = Path('hil-study-announcement.html').read_text(encoding='utf-8')
          launch = Path('hil-study-launch.html').read_text(encoding='utf-8')
          paper = Path('data/HIL_Canonical_Paper_v1_1.pdf').read_bytes()

          errors = []
          expected = status['canonical_primary']['sha256']
          actual = hashlib.sha256(paper).hexdigest()
          if actual != expected:
              errors.append(f'canonical paper hash mismatch: {actual}')
          if status.get('announcement_permitted') is not True:
              errors.append('announcement_permitted must be true')
          if status.get('participant_intake_state') != 'OPEN_MANAGED_RETURN':
              errors.append('participant intake must be OPEN_MANAGED_RETURN')
          required_claims = {
              'SERVER_SUBMISSION_COMPLETE',
              'DURABLE_CUSTODY_COMPLETE',
              'REGISTRY_COMMIT_COMPLETE',
              'PUBLICATION_COMPLETE',
          }
          if not required_claims.issubset(set(status.get('claims_withheld', []))):
              errors.append('required unavailable claims are not withheld')
          for phrase in ['participant-managed return', 'does not falsely claim server custody']:
              if phrase not in launch:
                  errors.append(f'launch page missing boundary phrase: {phrase}')
          for phrase in ['The study may be announced now', 'Persistent server custody and automated publication remain intentionally unclaimed']:
              if phrase not in announcement:
                  errors.append(f'announcement page missing phrase: {phrase}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(json.dumps({
              'state': 'PASS',
              'announcement_state': status['announcement_state'],
              'participant_intake_state': status['participant_intake_state'],
              'canonical_paper_sha256': actual,
              'claims_withheld': status['claims_withheld'],
          }, indent=2))
          PY
