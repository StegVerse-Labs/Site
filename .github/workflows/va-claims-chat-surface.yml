name: VA Claims Chat surface

on:
  push:
    branches: [main]
    paths:
      - va-claims-chat.html
      - data/va-claim-assistant/chat-capability-state.json
      - scripts/validate_va_claims_chat_surface.py
      - .github/workflows/va-claims-chat-surface.yml
      - docs/VA_CLAIM_ASSISTANT_MIRROR_HANDOFF.md
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claims-chat-surface
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate governed claims chat surface
        run: python scripts/validate_va_claims_chat_surface.py

      - name: Retain validation receipt
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/va-claim-assistant/chat-surface-validation.json
          if git diff --cached --quiet; then
            echo "Claims Chat validation receipt unchanged."
          else
            git commit -m "chore: retain governed VA Claims Chat validation [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload governed Claims Chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-claims-chat-surface-${{ github.run_id }}
          path: |
            va-claims-chat.html
            data/va-claim-assistant/chat-capability-state.json
            data/va-claim-assistant/chat-surface-validation.json
          if-no-files-found: error
          retention-days: 30
