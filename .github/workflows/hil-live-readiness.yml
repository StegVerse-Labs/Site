name: HIL Live Readiness Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture and validate live readiness
        id: probe
        continue-on-error: true
        run: python scripts/probe_hil_live_readiness.py
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-live-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hil-readiness-live/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce fail-closed readiness gate
        if: steps.probe.outcome != 'success'
        run: |
          echo "The receiver did not produce a conforming READY record. Evidence was preserved."
          exit 1
