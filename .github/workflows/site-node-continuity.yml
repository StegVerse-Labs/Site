name: Site Node Continuity

on:
  pull_request:
    paths:
      - "assets/stegverse-node-continuity.js"
      - "assets/stegos-resident-health.js"
      - "stegos-bootstrap/stegos-bootstrap.js"
      - "my-kv.html"
      - "my-kv-install.html"
      - "my-kv.webmanifest"
      - "assets/icons/mykv-icon-192.png"
      - "assets/icons/mykv-icon-512.png"
      - "va-disability-claim-guide.html"
      - "ecosystem-chat.html"
      - "index.html"
      - "assets/ecosystem-chat-simple.js"
      - "assets/ecosystem-chat-va-runtime.js"
      - "docs/SITE_NODE_CONTINUITY_MIRROR_HANDOFF.md"
      - "docs/MYKV_IOS_INSTALLABLE_SURFACE_MIRROR_HANDOFF.md"
      - "docs/STEGOS_RESIDENT_HEALTH_REPAIR_MIRROR_HANDOFF.md"
      - "scripts/check_site_node_continuity.py"
      - "tests/test_site_node_continuity.py"
      - "tests/test_mykv_installable_surface.py"
      - "tests/test_stegos_resident_health.py"
      - "data/session-work-claims.d/site-node-continuity-572.json"
      - "data/session-work-claims.d/site-mykv-ios-installable-surface-1348-20260915.json"
      - "data/session-work-claims.d/site-stegos-resident-health-repair-20260915.json"
      - ".github/workflows/site-node-continuity.yml"
  push:
    branches: [main]
    paths:
      - "assets/stegverse-node-continuity.js"
      - "assets/stegos-resident-health.js"
      - "stegos-bootstrap/stegos-bootstrap.js"
      - "my-kv.html"
      - "my-kv-install.html"
      - "my-kv.webmanifest"
      - "assets/icons/mykv-icon-192.png"
      - "assets/icons/mykv-icon-512.png"
      - "va-disability-claim-guide.html"
      - "ecosystem-chat.html"
      - "index.html"
      - "assets/ecosystem-chat-simple.js"
      - "assets/ecosystem-chat-va-runtime.js"
      - "tests/test_mykv_installable_surface.py"
      - "tests/test_stegos_resident_health.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - name: Validate Node continuity contract
        run: python scripts/check_site_node_continuity.py
      - name: Run Node continuity regressions
        run: python -m unittest -v tests.test_site_node_continuity
      - name: Validate MyKV iPhone install surface
        run: python -m unittest -v tests.test_mykv_installable_surface
      - name: Validate resident StegOS health and bounded repair
        run: python -m unittest -v tests.test_stegos_resident_health
      - name: Syntax-check shared Node, resident health, and chat runtimes
        run: |
          node --check assets/stegverse-node-continuity.js
          node --check assets/stegos-resident-health.js
          node --check stegos-bootstrap/stegos-bootstrap.js
          node --check assets/ecosystem-chat-simple.js
          node --check assets/ecosystem-chat-va-runtime.js
      - name: Preserve My KV multi-email boundary
        run: python scripts/check_my_kv_personal_info.py
      - name: Preserve VA Claims Guide boundary
        run: python scripts/validate_va_claims_guide_surface.py
      - name: Validate exclusive claim
        run: python scripts/check_session_work_claims.py
