name: Heartbeat Response Network

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/ecosystem-heartbeat-response-network.json"
      - "data/heartbeat-response-receipts/**"
      - "schemas/heartbeat-response-envelope.schema.json"
      - "scripts/check_heartbeat_response_network.py"
      - "tests/test_heartbeat_response_network.py"
      - ".github/workflows/heartbeat-response-network.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: heartbeat-response-network
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate response-network semantics
        run: |
          python -m unittest tests.test_heartbeat_response_network -v
          python scripts/check_heartbeat_response_network.py
      - name: Persist inspectable network state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-response-network-state
          path: data/ecosystem-heartbeat-response-network.json
          if-no-files-found: error
