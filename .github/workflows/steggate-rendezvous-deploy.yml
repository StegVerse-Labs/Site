name: StegGate Rendezvous Deploy

on:
  repository_dispatch:
    types: [stegverse-heartbeat]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/steggate-rendezvous-worker.js'
      - 'wrangler.steggate.jsonc'
      - '.github/workflows/steggate-rendezvous-deploy.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: steggate-rendezvous-deploy
  cancel-in-progress: false

jobs:
  authorize-credential-references:
    uses: StegVerse-Labs/TVC/.github/workflows/infrastructure-credential-authorize.yml@main
    with:
      profile: site_cloudflare_rendezvous
      consumer_org: StegVerse-Labs
      consumer_repo: Site
      consumer_workflow: steggate-rendezvous-deploy.yml
      consumer_branch: main

  deploy:
    needs: authorize-credential-references
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TVC_ADMISSIBLE: ${{ needs.authorize-credential-references.outputs.admissible }}
      TVC_DECISION_ID: ${{ needs.authorize-credential-references.outputs.decision_id }}
      TVC_POLICY_HASH: ${{ needs.authorize-credential-references.outputs.policy_hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Observe governed deployment credential boundary
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          if [ "$TVC_ADMISSIBLE" != "true" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            state='BLOCKED'
            blocker='tvc_credential_reference_authority_not_admissible'
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            state='BLOCKED'
            blocker='cloudflare_actions_bindings_unavailable'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            state='CLAIMED'
            blocker=''
          fi
          STATE="$state" BLOCKER="$blocker" node - <<'NODE'
          const fs = require('fs');
          const ready = process.env.STATE === 'CLAIMED';
          const body = {
            schema: 'stegverse.steggate_rendezvous_observation.v2',
            goal_id: 'STEGGATE-HEARTBEAT-CREDENTIAL-INTEGRATION-001',
            workflow_run: process.env.GITHUB_RUN_ID,
            workflow_attempt: process.env.GITHUB_RUN_ATTEMPT,
            source_commit: process.env.GITHUB_SHA,
            trigger: process.env.GITHUB_EVENT_NAME,
            state: process.env.STATE,
            tvc_admissible: process.env.TVC_ADMISSIBLE === 'true',
            tvc_decision_id: process.env.TVC_DECISION_ID,
            tvc_policy_hash: process.env.TVC_POLICY_HASH,
            credentials_available: process.env.CLOUDFLARE_API_TOKEN.length > 0 && process.env.CLOUDFLARE_ACCOUNT_ID.length > 0,
            credentials_recorded: false,
            blocker: process.env.BLOCKER || null,
            stable_origin: 'https://stegverse.org/api/steggate',
            next_action: ready
              ? 'Deploy stable rendezvous and execute acceptance probes.'
              : 'Remain fail-closed until both TVC authority and execution-environment credential presence are true.',
            authority_attached: false
          };
          fs.writeFileSync('deployment-evidence/activation-observation.json', JSON.stringify(body, null, 2) + '\n');
          NODE

      - name: Build production Wrangler configuration
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.steggate.jsonc', 'utf8'));
          cfg.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          cfg.routes = [{ pattern: 'stegverse.org/api/steggate/*', zone_name: 'stegverse.org' }];
          fs.writeFileSync('wrangler.steggate.production.json', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Deploy stable rendezvous Worker
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes wrangler@latest deploy --config wrangler.steggate.production.json

      - name: Verify stable readiness and health routes
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 24); do
            readiness_status=$(curl --silent --show-error --max-time 20 --output deployment-evidence/readiness.json --write-out '%{http_code}' https://stegverse.org/api/steggate/readiness || true)
            health_status=$(curl --silent --show-error --max-time 20 --output deployment-evidence/health.json --write-out '%{http_code}' https://stegverse.org/api/steggate/health || true)
            if [ "$readiness_status" = "200" ] && [ "$health_status" = "200" ]; then
              if node - <<'NODE'
          const fs = require('fs');
          const readiness = JSON.parse(fs.readFileSync('deployment-evidence/readiness.json'));
          const health = JSON.parse(fs.readFileSync('deployment-evidence/health.json'));
          if (readiness.state !== 'READY' || health.healthy !== true || health.canonical_three_layer_bound !== true) process.exit(1);
          NODE
              then READY=1; break; fi
            fi
            sleep 5
          done
          test "$READY" -eq 1

      - name: Verify stable self-test route
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://stegverse.org/api/steggate/v1/self-test > deployment-evidence/self-test.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('deployment-evidence/self-test.json'));
          if (data.status !== 'PASS') process.exit(1);
          const dispositions = new Set((data.results || []).map(x => x.disposition));
          for (const d of ['ALLOW','DENY','REVIEW','FAIL_CLOSED']) if (!dispositions.has(d)) process.exit(1);
          NODE

      - name: Record live acceptance state
        if: steps.credentials.outputs.ready == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/steggate-rendezvous-activation.json';
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          body.state = 'COMPLETE';
          body.claim_state = 'COMPLETE';
          body.deployment_state = 'LIVE_ACCEPTANCE_PASS';
          body.scheduler = 'stegverse-heartbeat';
          body.tvc_credential_authority = {decision_id: process.env.TVC_DECISION_ID, policy_hash: process.env.TVC_POLICY_HASH, credentials_recorded: false};
          body.last_success = {workflow_run: Number(process.env.GITHUB_RUN_ID), workflow_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), source_commit: process.env.GITHUB_SHA, stable_origin: 'https://stegverse.org/api/steggate', acceptance: ['readiness','health','self_test']};
          body.next_machine_action = 'Preserve stable-rendezvous hardening evidence; functional StegGate activation is already complete through the heartbeat ephemeral micro-node topology.';
          fs.writeFileSync(path, JSON.stringify(body, null, 2) + '\n');
          NODE
          git config user.name 'stegverse-automation'
          git config user.email 'stegverse-automation@users.noreply.github.com'
          git add data/steggate-rendezvous-activation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record live StegGate rendezvous acceptance'
            git push origin HEAD:main
          fi

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steggate-rendezvous-deployment-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Keep blocked state explicit until governed credentials exist
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo 'StegGate rendezvous remains BLOCKED until TVC authority is admissible and Cloudflare credential values exist in this execution environment.'
          exit 1
