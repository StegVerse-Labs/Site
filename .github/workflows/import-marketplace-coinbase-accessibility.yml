name: Import Marketplace Coinbase Accessibility

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/MARKETPLACE_COINBASE_ACCESSIBILITY_MIRROR_HANDOFF.md'
      - 'scripts/import_marketplace_coinbase_accessibility.py'
      - 'tests/test_marketplace_coinbase_accessibility.py'
      - 'data/marketplace-coinbase-accessibility-status.json'
      - '.github/workflows/import-marketplace-coinbase-accessibility.yml'

permissions:
  contents: write

concurrency:
  group: marketplace-coinbase-accessibility-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install pytest
      - name: Verify bounded projection contract
        run: pytest -q tests/test_marketplace_coinbase_accessibility.py
      - name: Import bounded Publisher status
        id: import_status
        run: |
          set +e
          python scripts/import_marketplace_coinbase_accessibility.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit changed Site projection
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "stegverse-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/marketplace-coinbase-accessibility-status.json
          git diff --cached --quiet || git commit -m "Record Marketplace Coinbase accessibility projection [skip ci]"
          git pull --rebase
          git push
      - name: Upload bounded Site projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-coinbase-accessibility-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/marketplace-coinbase-accessibility-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after preserving rejected upstream evidence
        if: steps.import_status.outputs.exit_code != '0'
        run: |
          echo "Publisher evidence was rejected. The bounded Site status was preserved."
          echo "No publication, release, execution, custody, withdrawal, or live trading authority is granted."
          exit 1
