name: Evaluator Review UI Source Validation

on:
  pull_request:
    paths:
      - evaluator-review.html
      - assets/evaluator-review.js
      - assets/evaluator-intr-connector.js
      - data/evaluator-review/**
      - data/tasks/SITE-EVALUATOR-MANIFEST-REVIEW-575.json
      - data/session-work-claims.d/site-evaluator-manifest-review-575-20260828.json
      - tests/evaluator-review-ui.test.cjs
      - tests/evaluator-intr-runtime-projection.test.cjs
      - scripts/check_evaluator_review_ui.py
      - docs/EVALUATOR_REVIEW_API_CONTRACT.md
      - docs/EVALUATOR_REVIEW_UI_MIRROR_HANDOFF.md
      - .github/workflows/evaluator-review-ui-validation.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public source anonymously
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c http.extraHeader= fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
      - name: Static evaluator UI acceptance
        run: python scripts/check_evaluator_review_ui.py
      - name: Deterministic review-state logic
        run: node tests/evaluator-review-ui.test.cjs
      - name: Receipt-bound runtime projection discovery
        run: node tests/evaluator-intr-runtime-projection.test.cjs
      - name: Boundary summary
        run: |
          echo "SOURCE_VALIDATION_ONLY=true"
          echo "RUNTIME_AUTHORITY=false"
          echo "APPROVAL_AUTHORITY=false"
          echo "FREEZE_AUTHORITY=false"
          echo "EXECUTION_AUTHORITY=false"
          echo "CREDENTIAL_AUTHORITY=TV/TVC"
