name: Check HIL Master Records Transfer

on:
  push:
    paths:
      - "schemas/hil_master_records_transfer.schema.json"
      - "scripts/check_hil_master_records_transfer.py"
      - "data/hil-master-records.json"
      - "data/hil-master-record-releases/**"
      - "data/hil-master-record-transfers/**"
      - ".github/workflows/check-hil-master-records-transfer.yml"
  pull_request:
    paths:
      - "schemas/hil_master_records_transfer.schema.json"
      - "scripts/check_hil_master_records_transfer.py"
      - "data/hil-master-records.json"
      - "data/hil-master-record-releases/**"
      - "data/hil-master-record-transfers/**"
      - ".github/workflows/check-hil-master-records-transfer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_hil_master_records_transfer.py
