name: HIL Pilot Validation Evidence Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hil-pilot-validation-evidence-reconciliation.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: hil-pilot-validation-evidence-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve complete logs and reconcile pilot handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          runs = [
              ('e8e39115b245258964939c5b4583dd46b22c623b', 30594916573),
              ('aa95c1267a8cf889a53b1e869be78ade18764679', 30594963448),
              ('3f69a06176de49cab523c280e2028bd3cc85df04', 30594992569),
              ('3391e30ca7894f4364d4a23c3ee7de3c169148b4', 30595185389),
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stegverse-hil-pilot-log-preserver',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          def get_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          evidence_root = Path('evidence/hil-pilot-validation-workflows')
          evidence_root.mkdir(parents=True, exist_ok=True)
          results = []
          for target_sha, run_id in runs:
              run = get_json(f'{api}/actions/runs/{run_id}')
              jobs_payload = get_json(f'{api}/actions/runs/{run_id}/jobs?filter=all&per_page=100')
              artifacts_payload = get_json(f'{api}/actions/runs/{run_id}/artifacts?per_page=100')
              run_dir = evidence_root / target_sha[:12]
              run_dir.mkdir(parents=True, exist_ok=True)
              jobs = []
              first_failed_step = None
              for job in jobs_payload.get('jobs', []):
                  job_id = int(job['id'])
                  log_bytes = get_bytes(f'{api}/actions/jobs/{job_id}/logs')
                  log_path = run_dir / f'job-{job_id}.log'
                  log_path.write_bytes(log_bytes)
                  steps = []
                  for step in job.get('steps') or []:
                      normalized = {
                          'number': step.get('number'),
                          'name': step.get('name'),
                          'status': step.get('status'),
                          'conclusion': step.get('conclusion'),
                          'started_at': step.get('started_at'),
                          'completed_at': step.get('completed_at'),
                      }
                      steps.append(normalized)
                      if first_failed_step is None and step.get('conclusion') == 'failure':
                          first_failed_step = {'job_id': job_id, 'job_name': job.get('name'), **normalized}
                  jobs.append({
                      'id': job_id,
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': steps,
                      'complete_log_ref': str(log_path),
                      'complete_log_size': len(log_bytes),
                      'complete_log_sha256': hashlib.sha256(log_bytes).hexdigest(),
                  })
              artifacts = [
                  {
                      'id': int(item['id']),
                      'name': item.get('name'),
                      'size_in_bytes': item.get('size_in_bytes'),
                      'digest': item.get('digest'),
                      'expired': item.get('expired'),
                      'created_at': item.get('created_at'),
                      'expires_at': item.get('expires_at'),
                  }
                  for item in artifacts_payload.get('artifacts', [])
              ]
              results.append({
                  'target_sha': target_sha,
                  'run': {
                      'id': run_id,
                      'run_number': run.get('run_number'),
                      'run_attempt': run.get('run_attempt'),
                      'name': run.get('name'),
                      'display_title': run.get('display_title'),
                      'event': run.get('event'),
                      'head_branch': run.get('head_branch'),
                      'head_sha': run.get('head_sha'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'created_at': run.get('created_at'),
                      'run_started_at': run.get('run_started_at'),
                      'updated_at': run.get('updated_at'),
                  },
                  'jobs': jobs,
                  'first_failed_step': first_failed_step,
                  'artifacts': artifacts,
              })

          receipt = {
              'schema_version': 'HIL-PILOT-VALIDATION-COMPLETE-EVIDENCE-v1',
              'repository': repo,
              'workflow_name': 'Site Bootstrap Validate',
              'workflow_path': '.github/workflows/validate.yml',
              'collected_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'collector_run_id': int(os.environ['GITHUB_RUN_ID']),
              'collector_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'targets': results,
              'all_runs_successful': all(item['run']['conclusion'] == 'success' for item in results),
              'all_first_failed_steps_null': all(item['first_failed_step'] is None for item in results),
              'model_state_mutated': False,
              'authority_effect': False,
              'activation_effect': False,
              'release_effect': False,
          }
          Path('data/hil-pilot-validation-complete-evidence.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          handoff_path = Path('docs/HIL_PILOT_VALIDATION_MIRROR_HANDOFF.md')
          text = handoff_path.read_text(encoding='utf-8')
          text = text.replace(
              '3f69a06176de49cab523c280e2028bd3cc85df04  canonical workflow binding\n',
              '3f69a06176de49cab523c280e2028bd3cc85df04  canonical workflow binding\n'
              '3391e30ca7894f4364d4a23c3ee7de3c169148b4  pilot validation mirror handoff\n'
          )
          old_workflow = (
              'Both `.github/workflows/hil-announcement-contract.yml` and `.github/workflows/validate.yml` execute the derivation check, deterministic tests, and schema validation. The current connector cannot enumerate general push-triggered runs or check-run results, so no new workflow conclusion is claimed as observed.\n'
          )
          new_workflow = '''Both `.github/workflows/hil-announcement-contract.yml` and `.github/workflows/validate.yml` execute the derivation check, deterministic tests, and schema validation.

## Exact canonical Site workflow verification

The repository-owned Actions investigation retrieved the exact push-triggered `Site Bootstrap Validate` runs, all job IDs, every step conclusion, complete job logs, and artifact inventories for the four pilot-validation commits:

```text
e8e39115b245258964939c5b4583dd46b22c623b
  run 30594916573 / success
  jobs 91045091242, 91045091253, 91045129405 / all success

aa95c1267a8cf889a53b1e869be78ade18764679
  run 30594963448 / success
  jobs 91045238799, 91045238882, 91045270787 / all success

3f69a06176de49cab523c280e2028bd3cc85df04
  run 30594992569 / success
  jobs 91045333014, 91045333025, 91045364488 / all success
  Validate HIL pilot ledger and deterministic fixtures: success

3391e30ca7894f4364d4a23c3ee7de3c169148b4
  run 30595185389 / success
  jobs 91045929728, 91045929748, 91045964669 / all success
  Validate HIL pilot ledger and deterministic fixtures: success
```

Every run has `first_failed_step: null`. Each run produced four non-expired validation artifacts with preserved IDs, byte sizes, and SHA-256 digests. Complete evidence is stored in `data/hil-pilot-validation-complete-evidence.json` and `evidence/hil-pilot-validation-workflows/`.

No fixture or workflow defect is proven. No pilot model state, response count, custody state, authority state, activation state, or release state was promoted.
'''
          if old_workflow not in text:
              raise SystemExit('expected workflow-verification paragraph not found')
          text = text.replace(old_workflow, new_workflow)

          old_block = (
              'This session exposes known-run jobs, steps, logs, artifacts, and reruns, but no general push-run enumeration or workflow dispatch. It exposes no direct Cloudflare Workers, routes, deployments, D1, bindings, custom domains, runtime logs, redeployment, or restart controls. The exact external-authority block is discovery and inspection of the newest push-triggered HIL Cloudflare deployment run, or direct Cloudflare control-plane inspection.\n\nNo provider defect was guessed. Production readiness remains fail-closed.\n'
          )
          new_block = (
              'The push-triggered deployment run is now proven as run `30573565667`, job `90976121829`, for trigger commit `d5d1598a8c523e8665e4550ee5c272df09256379`. It failed at step 4, `Validate deployment credentials`, because `CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`, and `HIL_REGISTRY_DATABASE_ID` all resolved empty. Wrangler and Cloudflare were not invoked.\n\nThe exact remaining external-authority block is authorized Actions-secret management or authenticated Cloudflare control-plane access using the existing account and preserved HIL D1 identity. Production readiness remains fail-closed.\n'
          )
          if old_block not in text:
              raise SystemExit('expected production authority paragraph not found')
          text = text.replace(old_block, new_block)
          text = text.replace(
              '- observe workflow conclusions for the pilot and announcement validation commits\n- repair only proven validation defects without promoting pending model entries\n',
              '- preserve the successful pilot workflow evidence without promoting pending model entries\n'
          )
          old_prompt = 'When general Actions listing is available, inspect workflow conclusions for commits `035949885f185f45756c8b0b5a8947e5231d7171` through `a549cd7665578782bb28b6b043f062f6e00f5fc1` and repair only proven defects. For production, use general push-triggered Actions run listing/dispatch or direct Cloudflare controls; retrieve the exact deployment failure associated with trigger commit `d5d1598a8c523e8665e4550ee5c272df09256379`, then continue through HIL_REGISTRY, scoped routing, readiness, controlled-cycle exact-byte custody, machine-derived production readiness, hosted restart persistence, genuine participant receipt, private review, authenticated publication, Site projection, Master Record release, release/tag evaluation, and authorized downstream verification.'
          new_prompt = 'Treat `data/hil-pilot-validation-complete-evidence.json` as the exact successful workflow receipt for the four pilot-validation commits; do not alter the two pending model entries or zero downstream counts without authentic response PDF bytes and package evidence. For production, use authorized Actions-secret management or direct Cloudflare controls. The deployment run is `30573565667`, job `90976121829`, and failed before provider execution because `CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`, and `HIL_REGISTRY_DATABASE_ID` resolved empty. Preserve the existing account and D1 identity, populate only the proven missing values, rerun, preserve the first Wrangler/provider result, then continue through HIL_REGISTRY, scoped routing, readiness, controlled-cycle exact-byte custody, machine-derived production readiness, hosted restart persistence, genuine participant receipt, private review, authenticated publication, Site projection, Master Record release, release/tag evaluation, and authorized downstream verification.'
          if old_prompt not in text:
              raise SystemExit('expected next-session prompt segment not found')
          text = text.replace(old_prompt, new_prompt)
          handoff_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit complete pilot workflow evidence and handoff reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stegverse-hil-pilot-investigator'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/hil-pilot-validation-complete-evidence.json \
            evidence/hil-pilot-validation-workflows/ \
            docs/HIL_PILOT_VALIDATION_MIRROR_HANDOFF.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'evidence(hil): preserve complete pilot validation logs'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload complete pilot workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-pilot-validation-complete-evidence-${{ github.run_id }}
          path: |
            data/hil-pilot-validation-complete-evidence.json
            evidence/hil-pilot-validation-workflows/
            docs/HIL_PILOT_VALIDATION_MIRROR_HANDOFF.md
          if-no-files-found: error
          retention-days: 90
