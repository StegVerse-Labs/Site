name: Check HIL full-cycle artifact verification imports

on:
  push:
    paths:
      - "schemas/hil_full_cycle_artifact_verification_import.schema.json"
      - "scripts/check_hil_full_cycle_artifact_verification_import.py"
      - "data/hil-full-cycle-artifact-verifications/**"
      - ".github/workflows/check-hil-full-cycle-artifact-verification-import.yml"
  pull_request:
    paths:
      - "schemas/hil_full_cycle_artifact_verification_import.schema.json"
      - "scripts/check_hil_full_cycle_artifact_verification_import.py"
      - "data/hil-full-cycle-artifact-verifications/**"
      - ".github/workflows/check-hil-full-cycle-artifact-verification-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governed full-cycle verification imports
        run: python scripts/check_hil_full_cycle_artifact_verification_import.py
