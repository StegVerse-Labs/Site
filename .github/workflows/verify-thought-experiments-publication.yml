name: Verify Thought Experiments publication

on:
  push:
    branches: [main]
    paths:
      - 'Thought-Experiments.html'
      - 'thought-experiments/**'
      - 'index.html'
      - 'scripts/check_thought_experiments_publication.py'
      - '.github/workflows/verify-thought-experiments-publication.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publication files
        run: python scripts/check_thought_experiments_publication.py
      - name: Verify public routes after deployment
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import time, urllib.request
          urls = [
              'https://stegverse.org/Thought-Experiments.html',
              'https://stegverse.org/thought-experiments/continuity-as-reconstructable-manifold-transition.html',
              'https://stegverse.org/thought-experiments/continuity-as-reconstructable-manifold-transition.pdf',
          ]
          last = []
          for attempt in range(12):
              last = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, method='GET', headers={'User-Agent':'StegVerse-publication-verifier/1.0'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          body = r.read(128)
                          last.append((url, r.status, body))
                  except Exception as exc:
                      last.append((url, None, repr(exc).encode()))
              if all(status == 200 for _, status, _ in last):
                  for url, status, _ in last:
                      print(f'PUBLIC_ROUTE_PASS {status} {url}')
                  raise SystemExit(0)
              time.sleep(10)
          for url, status, body in last:
              print(f'PUBLIC_ROUTE_FAIL {status} {url} {body!r}')
          raise SystemExit(1)
          PY
