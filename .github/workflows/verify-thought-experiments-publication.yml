name: Verify Thought Experiments public routes

on:
  push:
    branches: [main]
    paths:
      - 'Thought-Experiments.html'
      - 'thought-experiments/**'
      - 'index.html'
      - '.github/workflows/verify-thought-experiments-publication.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: thought-experiments-public-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public routes after deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time, urllib.request
          urls = [
              'https://stegverse.org/Thought-Experiments.html',
              'https://stegverse.org/thought-experiments/continuity-as-reconstructable-manifold-transition.html',
              'https://stegverse.org/thought-experiments/continuity-as-reconstructable-manifold-transition.pdf',
          ]
          last = []
          for attempt in range(12):
              last = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, method='GET', headers={'User-Agent':'StegVerse-publication-verifier/1.1'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read(128)
                          last.append((url, response.status, body))
                  except Exception as exc:
                      last.append((url, None, repr(exc).encode()))
              if all(status == 200 for _, status, _ in last):
                  for url, status, _ in last:
                      print(f'PUBLIC_ROUTE_PASS {status} {url}')
                  print('THOUGHT_EXPERIMENTS_REMOTE_VALIDATION_AUTHORITY_EFFECT=NONE')
                  print('THOUGHT_EXPERIMENTS_REMOTE_VALIDATION_ACTIVATION_EFFECT=NONE')
                  raise SystemExit(0)
              time.sleep(10)
          for url, status, body in last:
              print(f'PUBLIC_ROUTE_FAIL {status} {url} {body!r}')
          raise SystemExit(1)
          PY
