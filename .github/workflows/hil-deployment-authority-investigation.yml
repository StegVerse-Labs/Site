name: HIL Deployment Authority Investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hil-deployment-authority-investigation.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: hil-deployment-authority-investigation
  cancel-in-progress: false

jobs:
  collect-original-deployment-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: d5d1598a8c523e8665e4550ee5c272df09256379
      TARGET_WORKFLOW: hil-cloudflare-deploy.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve original workflow run, jobs, steps, logs, and artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_sha = os.environ['TARGET_SHA']
          workflow = os.environ['TARGET_WORKFLOW']
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stegverse-hil-deployment-investigator',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          def get_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          query = urllib.parse.urlencode({
              'head_sha': target_sha,
              'event': 'push',
              'per_page': 100,
          })
          runs_payload = get_json(f"{api}/actions/workflows/{workflow}/runs?{query}")
          runs = [
              run for run in runs_payload.get('workflow_runs', [])
              if run.get('head_sha') == target_sha
          ]

          evidence_dir = Path('evidence') / f'hil-cloudflare-deployment-{target_sha[:12]}'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          receipt_path = Path('data') / f'hil-cloudflare-deployment-investigation-{target_sha[:8]}.json'
          receipt_path.parent.mkdir(parents=True, exist_ok=True)

          receipt = {
              'schema_version': 'HIL-CLOUDFLARE-DEPLOYMENT-INVESTIGATION-v1',
              'repository': repo,
              'target_workflow': workflow,
              'triggering_commit': target_sha,
              'collected_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'collector_run_id': int(os.environ['GITHUB_RUN_ID']),
              'collector_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'matching_run_count': len(runs),
              'authority_effect': False,
              'activation_effect': False,
          }

          if not runs:
              receipt.update({
                  'state': 'ORIGINAL_RUN_NOT_RETURNED_BY_ACTIONS_API',
                  'exact_remaining_blocker': (
                      'GitHub Actions API returned no push run for the target workflow and commit '
                      'under the repository GITHUB_TOKEN.'
                  ),
              })
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
              raise SystemExit(0)

          run = sorted(runs, key=lambda item: item.get('created_at') or '')[-1]
          run_id = int(run['id'])
          jobs_payload = get_json(f"{api}/actions/runs/{run_id}/jobs?filter=all&per_page=100")
          artifacts_payload = get_json(f"{api}/actions/runs/{run_id}/artifacts?per_page=100")

          jobs_out = []
          first_failed = None
          provider_error_lines = []
          complete_log_refs = []

          for job in jobs_payload.get('jobs', []):
              job_id = int(job['id'])
              steps = []
              for step in job.get('steps') or []:
                  normalized = {
                      'number': step.get('number'),
                      'name': step.get('name'),
                      'status': step.get('status'),
                      'conclusion': step.get('conclusion'),
                      'started_at': step.get('started_at'),
                      'completed_at': step.get('completed_at'),
                  }
                  steps.append(normalized)
                  if first_failed is None and step.get('conclusion') == 'failure':
                      first_failed = {
                          'job_id': job_id,
                          'job_name': job.get('name'),
                          **normalized,
                      }

              log_path = evidence_dir / f'job-{job_id}.log'
              try:
                  log_bytes = get_bytes(f"{api}/actions/jobs/{job_id}/logs")
                  log_path.write_bytes(log_bytes)
                  complete_log_refs.append(str(log_path))
                  log_text = log_bytes.decode('utf-8', errors='replace')
                  for line in log_text.splitlines():
                      if re.search(r'(##\[error\]|\bERROR\b|\bError\b|wrangler|cloudflare|database|d1|route)', line, re.I):
                          provider_error_lines.append(line)
              except Exception as exc:
                  log_path.write_text(f'LOG_RETRIEVAL_ERROR: {type(exc).__name__}: {exc}\n')
                  complete_log_refs.append(str(log_path))
                  provider_error_lines.append(log_path.read_text().strip())

              jobs_out.append({
                  'id': job_id,
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
                  'runner_name': job.get('runner_name'),
                  'steps': steps,
                  'complete_log_ref': str(log_path),
              })

          artifacts = []
          for artifact in artifacts_payload.get('artifacts', []):
              artifacts.append({
                  'id': artifact.get('id'),
                  'name': artifact.get('name'),
                  'size_in_bytes': artifact.get('size_in_bytes'),
                  'digest': artifact.get('digest'),
                  'expired': artifact.get('expired'),
                  'created_at': artifact.get('created_at'),
                  'expires_at': artifact.get('expires_at'),
              })

          # Preserve order while removing duplicate diagnostic lines.
          deduped_errors = []
          seen = set()
          for line in provider_error_lines:
              normalized = line.strip()
              if normalized and normalized not in seen:
                  seen.add(normalized)
                  deduped_errors.append(normalized)

          receipt.update({
              'state': 'ORIGINAL_RUN_RETRIEVED',
              'deployment_run': {
                  'id': run_id,
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'name': run.get('name'),
                  'display_title': run.get('display_title'),
                  'event': run.get('event'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'run_started_at': run.get('run_started_at'),
                  'html_url': run.get('html_url'),
              },
              'jobs': jobs_out,
              'first_failed_step': first_failed,
              'provider_error_lines': deduped_errors,
              'artifacts': artifacts,
              'complete_log_refs': complete_log_refs,
          })
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit preserved investigation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stegverse-hil-investigator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hil-cloudflare-deployment-investigation-*.json evidence/hil-cloudflare-deployment-*/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'evidence(hil): preserve original Cloudflare deployment logs'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload preserved investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-cloudflare-deployment-investigation-${{ github.run_id }}
          path: |
            data/hil-cloudflare-deployment-investigation-*.json
            evidence/hil-cloudflare-deployment-*/
          if-no-files-found: warn
          retention-days: 90
