name: Check HIL Federal-Plus Security Baseline

on:
  pull_request:
    paths:
      - 'docs/HIL_FEDERAL_PLUS_SECURITY_BASELINE.md'
      - 'data/hil-federal-plus-security-baseline.json'
      - 'schemas/hil-federal-plus-security-baseline.schema.json'
      - 'scripts/check_hil_federal_plus_security_baseline.py'
      - '.github/workflows/check-hil-federal-plus-security-baseline.yml'
      - 'docs/HIL_SESSION_CONSOLIDATION_MIRROR_HANDOFF.md'
      - 'data/session-goal-inventories/HIL-RUNTIME-SESSION-2026-08-02.json'
  push:
    branches: [main]
    paths:
      - 'docs/HIL_FEDERAL_PLUS_SECURITY_BASELINE.md'
      - 'data/hil-federal-plus-security-baseline.json'
      - 'schemas/hil-federal-plus-security-baseline.schema.json'
      - 'scripts/check_hil_federal_plus_security_baseline.py'
      - '.github/workflows/check-hil-federal-plus-security-baseline.yml'
      - 'docs/HIL_SESSION_CONSOLIDATION_MIRROR_HANDOFF.md'
      - 'data/session-goal-inventories/HIL-RUNTIME-SESSION-2026-08-02.json'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hil-federal-plus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fail-closed security profile
        run: python scripts/check_hil_federal_plus_security_baseline.py --output reports/hil-federal-plus-security-validation.json
      - name: Add security state to workflow summary
        if: always()
        run: |
          if [ -f reports/hil-federal-plus-security-validation.json ]; then
            echo '## HIL Federal-Plus Security Validation' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/hil-federal-plus-security-validation.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-federal-plus-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hil-federal-plus-security-validation.json
          if-no-files-found: error
          retention-days: 90
