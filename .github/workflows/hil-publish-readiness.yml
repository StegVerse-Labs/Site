name: Publish HIL Participant Readiness

on:
  workflow_run:
    workflows: ["HIL Participant Readiness Gate"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: hil-publish-participant-readiness
  cancel-in-progress: false

jobs:
  publish:
    # Runs on every completion of the gate, a state transition: a passed gate publishes the readiness record,
    # and every gate run that executed records its outcome in data/hil-controlled-cycle-latest.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download readiness evidence
        id: evidence
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: hil-participant-readiness-*
          path: readiness-artifact
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable verification record
        id: publish
        if: ${{ steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('readiness-artifact')
          manifest_path = next(root.rglob('evidence-manifest.json'))
          receipt_path = next(root.rglob('receipt.json'))
          status_path = next(root.rglob('status.json'))
          validation_path = next(root.rglob('controlled-cycle-validation.txt'))

          manifest = json.loads(manifest_path.read_text())
          receipt = json.loads(receipt_path.read_text())
          status = json.loads(status_path.read_text())
          validation = validation_path.read_text()

          passed = (
              manifest.get('participant_ready') is True
              and manifest.get('positive_cycle_passed') is True
              and manifest.get('negative_cases_passed') is True
              and 'HIL_CONTROLLED_CYCLE=PASS' in validation
              and status.get('state') == 'ACCEPTED'
              and receipt.get('submission_id') == status.get('submission_id')
              and receipt.get('submitted_file_sha256') == status.get('submitted_file_sha256')
          )
          if not passed:
              raise SystemExit('refusing_to_publish_unverified_readiness')

          source_run_id = os.environ['SOURCE_WORKFLOW_RUN_ID']
          public = {
              'schema_version': 'HIL-PUBLIC-PARTICIPANT-READINESS-v1',
              'state': 'TEST_PARTICIPANT_PACKET_PASSED',
              'participant_ready': True,
              'test_case_id': 'HIL-E2E-001',
              'verified_at': manifest.get('recorded_at'),
              'workflow_run_id': int(source_run_id),
              'workflow_run_attempt': int(os.environ['SOURCE_WORKFLOW_RUN_ATTEMPT']),
              'tested_repository_commit': manifest.get('repository_commit') or os.environ['SOURCE_WORKFLOW_HEAD_SHA'],
              'source_workflow_head_sha': os.environ['SOURCE_WORKFLOW_HEAD_SHA'],
              'source_workflow_url': os.environ['SOURCE_WORKFLOW_URL'],
              'submission_id': receipt['submission_id'],
              'receipt_id': receipt['receipt_id'],
              'response_sha256': receipt['submitted_file_sha256'],
              'size_bytes': status['size_bytes'],
              'chunk_count': status['chunk_count'],
              'custody_backend': status['custody_backend'],
              'exact_bytes_retrieved': True,
              'positive_cycle_passed': True,
              'negative_cases_passed': True,
              'upload_button_authorized': True,
              'received_page_url': f"https://stegverse.org/hil-accepted.html?submission_id={receipt['submission_id']}",
              'authority_effect': False,
              'research_data': False
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/hil-participant-readiness.json').write_text(json.dumps(public, indent=2, sort_keys=True) + '\n')
          PY

      # A gate run whose job was skipped (no authorization phrase) concludes without evidence; it is not a cycle.
      - name: Record controlled-cycle outcome
        id: cycle
        if: ${{ always() && (contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion) || steps.evidence.outcome == 'success') }}
        shell: bash
        env:
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          conclusion = os.environ['SOURCE_CONCLUSION']
          record = {
              'schema_version': 'HIL-CONTROLLED-CYCLE-ATTEMPT-v1',
              'authorization_phrase_verified': True,
              'workflow': 'hil-controlled-cycle.yml',
              'run_id': int(os.environ['SOURCE_WORKFLOW_RUN_ID']),
              'run_url': os.environ['SOURCE_WORKFLOW_URL'],
              'dispatched_at': os.environ['SOURCE_STARTED_AT'],
              'completed_at': os.environ['SOURCE_UPDATED_AT'],
              'conclusion': conclusion,
              'passed': conclusion == 'success' and os.environ['PUBLISH_OUTCOME'] == 'success',
              'authority_effect': False,
              'research_data': False
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/hil-controlled-cycle-latest.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit public readiness record
        if: ${{ always() && steps.cycle.outcome == 'success' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "stegverse-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/hil-announcement-status.json is derived from the readiness record and checked on every PR
          # (validate.yml, hil-announcement-contract.yml); publish both together or main goes red.
          python3 scripts/derive_hil_announcement_status.py
          python3 scripts/derive_hil_announcement_status.py --check
          git add data/hil-participant-readiness.json data/hil-controlled-cycle-latest.json data/hil-announcement-status.json
          if git diff --cached --quiet; then
            echo "Public readiness record unchanged."
            exit 0
          fi
          git commit -m "chore(hil): record controlled-cycle outcome and participant readiness"

          # One attempt, bound to this gate completion: rebase onto the current default branch and push. A push
          # refused by a concurrent change fails closed; re-running this publisher run is the retry edge.
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          python3 scripts/derive_hil_announcement_status.py --check
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Enforce verified readiness
        if: ${{ always() && steps.cycle.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          record = json.load(open('data/hil-controlled-cycle-latest.json'))
          if record.get('passed') is not True:
              raise SystemExit(f"HIL_CONTROLLED_CYCLE_FAILED:{record.get('conclusion')}")
          print('HIL_CONTROLLED_CYCLE=PASS')
          PY
