name: Validate Ecosystem Node Canonical Events

on:
  push:
    paths:
      - 'schemas/ecosystem-node-canonical-event.schema.json'
      - 'fixtures/ecosystem-node-canonical-events.json'
      - 'scripts/validate_ecosystem_node_canonical_events.py'
      - 'tests/test_ecosystem_node_canonical_events.py'
      - 'docs/ECOSYSTEM_NODE_CANONICAL_EVENT_INTEGRITY.md'
      - '.github/workflows/validate-ecosystem-node-canonical-events.yml'
  pull_request:
    paths:
      - 'schemas/ecosystem-node-canonical-event.schema.json'
      - 'fixtures/ecosystem-node-canonical-events.json'
      - 'scripts/validate_ecosystem_node_canonical_events.py'
      - 'tests/test_ecosystem_node_canonical_events.py'
      - 'docs/ECOSYSTEM_NODE_CANONICAL_EVENT_INTEGRITY.md'
      - '.github/workflows/validate-ecosystem-node-canonical-events.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Validate canonical fixture
        run: python scripts/validate_ecosystem_node_canonical_events.py
      - name: Run adversarial tests
        run: python -m pytest tests/test_ecosystem_node_canonical_events.py -q
