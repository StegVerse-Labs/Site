name: Continue Marketplace Coinbase First Accessibility

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/continue_marketplace_coinbase_first_accessibility.py'
      - 'scripts/import_marketplace_coinbase_first_accessibility.py'
      - 'data/marketplace-coinbase-first-accessibility-source-observation.json'
      - 'docs/MARKETPLACE_COINBASE_FIRST_ACCESSIBILITY_HANDOFF.md'
      - '.github/workflows/continue-marketplace-coinbase-first-accessibility.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: site-marketplace-coinbase-first-accessibility-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute repository-owned continuation controller
        id: controller
        run: |
          set +e
          python scripts/continue_marketplace_coinbase_first_accessibility.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit machine status and located task state
        if: always()
        run: |
          git config user.name "stegverse-site-continuation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/marketplace-coinbase-first-accessibility-status.json data/marketplace-coinbase-first-accessibility-task-state.json
          if git diff --cached --quiet; then
            echo "No accessibility continuation state change."
            exit 0
          fi
          git commit -m "Record Marketplace Coinbase accessibility continuation [skip ci]"
          git pull --rebase
          git push

      - name: Read continuation decision
        id: decision
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          state = json.load(open('data/marketplace-coinbase-first-accessibility-task-state.json', encoding='utf-8'))
          print(f"activation_ready={str(bool(state.get('activation_ready'))).lower()}")
          print(f"state={state.get('state')}")
          print(f"status={state.get('status')}")
          print(f"task_state_digest={state.get('task_state_digest')}")
          PY

      - name: Update located coordination issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATE: ${{ steps.decision.outputs.state }}
          STATUS: ${{ steps.decision.outputs.status }}
          TASK_STATE_DIGEST: ${{ steps.decision.outputs.task_state_digest }}
        run: |
          note="Repository-owned continuation run ${RUN_ID}: state=${JOB_STATE}; status=${STATUS}; task-state digest=${TASK_STATE_DIGEST}. Tasks and exact locations are recorded in data/marketplace-coinbase-first-accessibility-task-state.json. No external tasks exist."
          gh issue comment 130 --repo StegVerse-Labs/Site --body "$note"

      - name: Close activation issue only after machine completion
        if: steps.decision.outputs.activation_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          TASK_STATE_DIGEST: ${{ steps.decision.outputs.task_state_digest }}
        run: |
          gh issue close 130 --repo StegVerse-Labs/Site --comment "StegVerse accessibility projection is ACCESSIBLE and digest-valid in continuation run ${RUN_ID}. Task-state digest: ${TASK_STATE_DIGEST}. All tasks are completed at their recorded repository locations. No live Coinbase authority is granted."

      - name: Upload continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-marketplace-coinbase-accessibility-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/marketplace-coinbase-first-accessibility-status.json
            data/marketplace-coinbase-first-accessibility-task-state.json
            data/marketplace-coinbase-first-accessibility-source-observation.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve non-terminal state without halting continuation
        if: steps.controller.outputs.exit_code != '0'
        run: |
          echo "The layer is not terminal. Exact tasks remain in data/marketplace-coinbase-first-accessibility-task-state.json."
          echo "The scheduled controller will re-execute; no unnamed external task is created."
