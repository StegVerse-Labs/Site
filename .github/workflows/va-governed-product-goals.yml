name: VA governed product goals

on:
  push:
    branches: [main]
    paths:
      - data/va-claim-assistant/governed-product-goals.json
      - scripts/validate_va_governed_product_goals.py
      - docs/VA_CLAIM_ASSISTANT_GOVERNED_SESSION.md
      - docs/VA_CLAIM_ASSISTANT_MIRROR_HANDOFF.md
      - va-disability-claim-guide.html
      - .github/workflows/va-governed-product-goals.yml
  pull_request:
    paths:
      - data/va-claim-assistant/governed-product-goals.json
      - scripts/validate_va_governed_product_goals.py
      - docs/VA_CLAIM_ASSISTANT_GOVERNED_SESSION.md
      - docs/VA_CLAIM_ASSISTANT_MIRROR_HANDOFF.md
      - va-disability-claim-guide.html
      - .github/workflows/va-governed-product-goals.yml
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-governed-product-goals
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate goal contract
        run: python scripts/validate_va_governed_product_goals.py

      - name: Verify receipt boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('data/va-claim-assistant/governed-product-goals-validation.json').read_text())
          assert receipt['state'] == 'PASS'
          assert receipt['required_goals_present'] is True
          assert receipt['veteran_submission_authority_preserved'] is True
          assert receipt['automated_filing_active'] is False
          assert receipt['authority_effect'] is False
          assert receipt['activation_effect'] is False
          assert receipt['blockers'] == []
          PY

      - name: Retain validation receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/va-claim-assistant/governed-product-goals-validation.json
          if git diff --cached --quiet; then
            echo "Governed VA product goals receipt unchanged."
          else
            git commit -m "chore: retain governed VA product goals receipt [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-governed-product-goals-${{ github.run_id }}
          path: |
            data/va-claim-assistant/governed-product-goals.json
            data/va-claim-assistant/governed-product-goals-validation.json
          retention-days: 90
