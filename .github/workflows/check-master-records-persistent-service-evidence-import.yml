name: Check Master Records persistent service evidence imports

on:
  push:
    paths:
      - schemas/master_records_persistent_service_evidence_import.schema.json
      - scripts/check_master_records_persistent_service_evidence_import.py
      - data/master-records-persistent-service-evidence/**
      - .github/workflows/check-master-records-persistent-service-evidence-import.yml
  pull_request:
    paths:
      - schemas/master_records_persistent_service_evidence_import.schema.json
      - scripts/check_master_records_persistent_service_evidence_import.py
      - data/master-records-persistent-service-evidence/**
      - .github/workflows/check-master-records-persistent-service-evidence-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Master Records persistent service evidence imports
        run: python scripts/check_master_records_persistent_service_evidence_import.py
