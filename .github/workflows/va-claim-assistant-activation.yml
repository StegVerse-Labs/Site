name: VA Claim Assistant Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/va-claim-assistant/**'
      - 'va-claim-assistant-source-grounded.html'
      - 'data/va-claim-assistant/**'
      - 'data/tasks/SITE-0001-VA-SOURCE-GROUNDED-EVIDENCE.json'
      - 'scripts/check_va_claim_assistant_governance.py'
      - 'scripts/check_va_source_grounded_evidence_manifest.py'
      - 'scripts/apply_va_source_grounded_evidence_manifest.py'
      - 'scripts/reconcile_va_claim_assistant_activation.py'
      - '.github/workflows/va-claim-assistant-activation.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: va-claim-assistant-activation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Site governance contracts
        run: python scripts/check_va_claim_assistant_governance.py
      - name: Validate cross-repository evidence manifest
        run: python scripts/check_va_source_grounded_evidence_manifest.py
      - name: Reconcile repository and deployed evidence
        run: python scripts/reconcile_va_claim_assistant_activation.py
      - name: Apply verified evidence chain to gate 08
        run: python scripts/apply_va_source_grounded_evidence_manifest.py
      - name: Enforce anti-stall state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gates=json.loads(Path('data/va-claim-assistant/activation-gates.json').read_text())
          receipt=json.loads(Path('data/va-claim-assistant/source-grounded-activation-receipt.json').read_text())
          manifest=json.loads(Path('data/va-claim-assistant/source-grounded-evidence-manifest.json').read_text())
          gate08=next(g for g in gates['gates'] if g['id']=='VCA-GATE-08')
          gate09=next(g for g in gates['gates'] if g['id']=='VCA-GATE-09')
          assert manifest['state']=='EVIDENCE_CHAIN_VERIFIED'
          assert gate08['state']=='VERIFIED'
          assert 'data/va-claim-assistant/source-grounded-evidence-manifest.json' in gate08['evidence']
          if receipt['state'] != 'VERIFIED':
              assert gate09['state']=='BUILDING'
              assert receipt['next_action']
          for gate in gates['gates']:
              if gate['state'] != 'VERIFIED':
                  assert gate.get('task_location'), f"missing task location for {gate['id']}"
                  assert gate.get('next_action') or gate['id'] == 'VCA-GATE-05', f"missing next action for {gate['id']}"
          assert gates['anti_stall']['external_tasks_allowed'] is False
          print('VA anti-stall and evidence-chain invariants: PASS')
          PY
      - name: Persist reconciliation state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/va-claim-assistant/activation-gates.json data/va-claim-assistant/source-grounded-activation-receipt.json; then
            echo 'No reconciliation change.'
            exit 0
          fi
          git config user.name 'va-claim-assistant-activation[bot]'
          git config user.email 'va-claim-assistant-activation[bot]@users.noreply.github.com'
          git add data/va-claim-assistant/activation-gates.json data/va-claim-assistant/source-grounded-activation-receipt.json
          git commit -m 'receipt: reconcile VA source-grounded activation [skip ci]'
          git pull --rebase
          git push
      - name: Upload activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-claim-assistant-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/va-claim-assistant/source-grounded-evidence-manifest.json
            data/va-claim-assistant/source-grounded-activation-receipt.json
            data/va-claim-assistant/activation-gates.json
          if-no-files-found: error
          retention-days: 30
