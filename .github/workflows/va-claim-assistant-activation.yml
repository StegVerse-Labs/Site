name: VA Claim Assistant Source-Grounded Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/va-claim-assistant/evidence-requirement.json'
      - 'va-claim-assistant-source-grounded.html'
      - 'data/va-claim-assistant/source-registry.json'
      - 'data/va-claim-assistant/source-registry.schema.json'
      - 'data/va-claim-assistant/answer-record.schema.json'
      - 'data/va-claim-assistant/fixtures/**'
      - 'data/va-claim-assistant/source-grounded-evidence-manifest.json'
      - 'data/tasks/SITE-0001-VA-SOURCE-GROUNDED-EVIDENCE.json'
      - 'scripts/check_va_claim_assistant_governance.py'
      - 'scripts/write_va_governance_validation_receipt.py'
      - 'scripts/check_va_source_grounded_evidence_manifest.py'
      - 'scripts/apply_va_source_grounded_evidence_manifest.py'
      - 'scripts/reconcile_va_claim_assistant_activation.py'
      - '.github/workflows/va-claim-assistant-activation.yml'

permissions: {}

concurrency:
  group: va-claim-assistant-source-grounded-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN CLOUDFLARE_API_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'VA_SOURCE_GROUNDED_VALIDATION_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'VA_SOURCE_GROUNDED_VALIDATION_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('VA_SOURCE_GROUNDED_VALIDATION_PYTHON=PASS')
          PY

      - name: Validate Site governance contracts
        run: python3 scripts/check_va_claim_assistant_governance.py

      - name: Derive ephemeral governance receipt
        run: python3 scripts/write_va_governance_validation_receipt.py

      - name: Validate cross-repository evidence manifest
        run: python3 scripts/check_va_source_grounded_evidence_manifest.py

      - name: Reconcile repository and deployed evidence ephemerally
        run: python3 scripts/reconcile_va_claim_assistant_activation.py

      - name: Apply verified governance and evidence chain ephemerally
        run: python3 scripts/apply_va_source_grounded_evidence_manifest.py

      - name: Enforce completed source-grounded invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          gates = json.loads(Path('data/va-claim-assistant/activation-gates.json').read_text())
          receipt = json.loads(Path('data/va-claim-assistant/source-grounded-activation-receipt.json').read_text())
          manifest = json.loads(Path('data/va-claim-assistant/source-grounded-evidence-manifest.json').read_text())
          governance = json.loads(Path('data/va-claim-assistant/governance-validation-receipt.json').read_text())
          task = json.loads(Path('data/tasks/SITE-0001-VA-SOURCE-GROUNDED-EVIDENCE.json').read_text())
          assert task['state'] == 'COMPLETE'
          assert task['claim_state'] == 'COMPLETE'
          assert task['claim_release_condition'] == 'SATISFIED'
          assert governance['result'] == 'PASS'
          assert governance['authority_effect'] is False
          assert governance['activation_effect'] is False
          assert manifest['state'] == 'EVIDENCE_CHAIN_VERIFIED'
          assert manifest['activation_effect'] is False
          assert manifest['publication_effect'] is False
          gate01 = next(g for g in gates['gates'] if g['id'] == 'VCA-GATE-01')
          gate02 = next(g for g in gates['gates'] if g['id'] == 'VCA-GATE-02')
          gate08 = next(g for g in gates['gates'] if g['id'] == 'VCA-GATE-08')
          gate09 = next(g for g in gates['gates'] if g['id'] == 'VCA-GATE-09')
          assert gate01['state'] == 'VERIFIED'
          assert gate02['state'] == 'VERIFIED'
          assert gate08['state'] == 'VERIFIED'
          if receipt['state'] == 'VERIFIED':
              assert gate09['state'] == 'VERIFIED'
          else:
              assert gate09['state'] == 'BUILDING'
              assert receipt['next_action']
          assert gates['anti_stall']['external_tasks_allowed'] is False
          print('VA_SOURCE_GROUNDED_COMPLETED_CONTRACT=PASS')
          print('VA_SOURCE_GROUNDED_PRODUCT_AUTHORITY_CHANGE=NONE')
          PY

      - name: Discard ephemeral derivations and prove no persistence authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- \
            data/va-claim-assistant/activation-gates.json \
            data/va-claim-assistant/governance-validation-receipt.json \
            data/va-claim-assistant/source-grounded-activation-receipt.json
          test -z "$(git status --porcelain)"
          echo 'VA_SOURCE_GROUNDED_REPOSITORY_WRITEBACK=NONE'
          echo 'VA_SOURCE_GROUNDED_ARTIFACT_CUSTODY=NONE'

      - name: Confirm validation-only containment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/va-claim-assistant-activation.yml').read_text(encoding='utf-8')
          forbidden = [
              'schedule:',
              'contents: write',
              'github.token',
              'GH_TOKEN:',
              'actions/checkout@',
              'actions/setup-python@',
              'actions/upload-artifact@',
              'git push',
              'git commit',
          ]
          present = [marker for marker in forbidden if marker in workflow]
          if present:
              raise SystemExit(f'forbidden completed-reconciler authority/custody remains: {present}')
          required = ['workflow_dispatch:', 'push:', 'permissions: {}', 'cancel-in-progress: true']
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit(f'missing retained validation contract: {missing}')
          if "data/va-claim-assistant/**" in workflow:
              raise SystemExit('broad VA receipt/state trigger remains')
          print('VA_SOURCE_GROUNDED_HOURLY_RECONCILER_RETIRED=PASS')
          print('VA_SOURCE_GROUNDED_GITHUB_TOKEN_AUTHORITY=NONE')
          print('VA_SOURCE_GROUNDED_RUNTIME_AUTHORITY=NONE')
          PY
