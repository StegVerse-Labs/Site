name: Heartbeat Response Blocker Observer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/heartbeat-response-adapter-targets.json"
      - "scripts/observe_heartbeat_response_blockers.py"
      - ".github/workflows/heartbeat-response-blocker-observer.yml"
permissions:
  contents: write
concurrency:
  group: heartbeat-response-blocker-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Observe release conditions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/observe_heartbeat_response_blockers.py
      - name: Persist observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stegverse-heartbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat-response-blocker-observation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(heartbeat): observe blocked organization release conditions"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            GITHUB_TOKEN="${{ github.token }}" python scripts/observe_heartbeat_response_blockers.py
            git add data/heartbeat-response-blocker-observation.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          done
          exit 1
      - name: Upload blocker observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heartbeat-response-blocker-observation
          path: data/heartbeat-response-blocker-observation.json
          if-no-files-found: error
