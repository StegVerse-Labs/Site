name: Site Homepage Chat Public Asset Observation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ecosystem-chat.html'
      - 'assets/ecosystem-chat-runtime.js'
      - 'assets/ecosystem-chat-va-runtime.js'
      - 'assets/stegverse-node-continuity-impl.js'
      - 'assets/ecosystem-chat-simple.js'
      - 'scripts/observe_site_homepage_chat_assets.py'
      - 'tests/test_observe_site_homepage_chat_assets.py'
      - '.github/workflows/site-homepage-chat-public-asset-observation.yml'
      - 'docs/SITE_HOMEPAGE_CHAT_MIRROR_HANDOFF.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ecosystem-chat.html'
      - 'assets/ecosystem-chat-runtime.js'
      - 'assets/ecosystem-chat-va-runtime.js'
      - 'assets/stegverse-node-continuity-impl.js'
      - 'assets/ecosystem-chat-simple.js'
      - 'scripts/observe_site_homepage_chat_assets.py'
      - 'tests/test_observe_site_homepage_chat_assets.py'
      - '.github/workflows/site-homepage-chat-public-asset-observation.yml'
      - 'docs/SITE_HOMEPAGE_CHAT_MIRROR_HANDOFF.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded observer
        run: python -m unittest -v tests.test_observe_site_homepage_chat_assets

  observe:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select this run (NOT_SELECTED, never skipped)
        id: select
        run: |
          set -euo pipefail
          # Same predicate as the former job-level condition: public observation runs on push/main
          # and workflow_dispatch, not on pull_request (validate already ran).
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "NOT_SELECTED: public observation does not run on pull_request (validate already ran); nothing observed, no authority effect"
            echo "## Observer" >> "$GITHUB_STEP_SUMMARY"
            echo "NOT_SELECTED: public observation does not run on pull_request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "selected=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.selected == 'true'
      - name: Observe deployed homepage chat asset bytes
        if: steps.select.outputs.selected == 'true'
        run: python scripts/observe_site_homepage_chat_assets.py --attempts 12 --delay-seconds 10
      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.selected == 'true'
        with:
          name: site-homepage-chat-public-assets-${{ github.run_id }}
          path: evidence/site-homepage-chat-public-assets/
          retention-days: 90
