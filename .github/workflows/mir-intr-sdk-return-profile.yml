name: MIR InTr SDK Return Profile

on:
  pull_request:
    paths:
      - 'intr-service-worker.js'
      - 'assets/mir-accounting-return-v1.js'
      - 'assets/external-counterpart-return-consumer.js'
      - 'assets/kv-mirror-node.js'
      - 'assets/generated/site-browser-intr-connectors.js'
      - 'assets/stegverse-node-continuity-impl.js'
      - 'tests/test_mir_intr_sdk_return_profile.py'
      - 'tests/mir_return_consumer_runtime.mjs'
      - 'tests/kv_mirror_node_runtime.mjs'
      - 'docs/MIR_INTR_SDK_RETURN_PROFILE_MIRROR_HANDOFF.md'
      - 'docs/MIR_CONNECTION_ROUNDTRIP_TECHNICAL_GUIDE_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/mir-intr-sdk-return-profile-1266.json'
      - 'data/session-work-claims.d/site-mir-connection-roundtrip-technical-guide-20260912.json'
      - '.github/workflows/mir-intr-sdk-return-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Validate MIR return adapter and existing root InTr ingress
        run: python -m pytest -q tests/test_mir_intr_sdk_return_profile.py
      - name: Validate service-worker syntax
        run: node --check intr-service-worker.js
      - name: Validate MIR return adapter syntax
        run: node --check assets/mir-accounting-return-v1.js
      - name: Validate external-counterpart return consumer syntax
        run: node --check assets/external-counterpart-return-consumer.js
      - name: Validate KV mirror node syntax
        run: node --check assets/kv-mirror-node.js
      - name: Execute MIR NODE MIRROR return through Site consumer and InTr admission
        run: node tests/mir_return_consumer_runtime.mjs
      - name: Execute KV_MIRROR_Node entry-point validation
        run: node tests/kv_mirror_node_runtime.mjs
