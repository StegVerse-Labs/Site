name: VA PII Detection Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/va-claim-assistant/fixtures/pii-detection-evaluation.json'
      - 'scripts/evaluate_va_pii_detection_fixture.py'
      - '.github/workflows/va-pii-detection-evaluation.yml'

permissions:
  contents: write

concurrency:
  group: va-pii-detection-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate synthetic PII corpus
        run: python scripts/evaluate_va_pii_detection_fixture.py
      - name: Commit evaluation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/va-claim-assistant/pii-detection-evaluation-receipt.json ]; then
            printf '%s\n' '{"schema_version":"1.0.0","state":"FAIL","reference_evaluator_only":true,"production_detector_ready":false,"private_document_upload_enabled":false,"errors":["evaluation_did_not_emit_receipt"],"authority_effect":false,"activation_effect":false}' > data/va-claim-assistant/pii-detection-evaluation-receipt.json
          fi
          git config user.name 'stegverse-va-pii-evaluator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/va-claim-assistant/pii-detection-evaluation-receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(va): retain PII detection evaluation receipt [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-pii-detection-evaluation-${{ github.run_id }}
          path: |
            data/va-claim-assistant/fixtures/pii-detection-evaluation.json
            data/va-claim-assistant/pii-detection-evaluation-receipt.json
          retention-days: 90
      - name: Enforce evaluation result
        run: |
          python - <<'PY'
          import json
          receipt = json.load(open('data/va-claim-assistant/pii-detection-evaluation-receipt.json'))
          if receipt.get('state') != 'PASS':
              raise SystemExit(f"PII_EVALUATION_FAILED:{receipt}")
          if receipt.get('production_detector_ready') is not False:
              raise SystemExit('REFERENCE_EVALUATION_MUST_NOT_CLAIM_PRODUCTION_READINESS')
          if receipt.get('private_document_upload_enabled') is not False:
              raise SystemExit('REFERENCE_EVALUATION_MUST_NOT_ENABLE_UPLOAD')
          print('VA_PII_DETECTION_EVALUATION=PASS')
          PY
