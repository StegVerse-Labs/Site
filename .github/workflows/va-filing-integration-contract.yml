name: VA Filing Integration Contract

on:
  push:
    branches: [main]
    paths:
      - data/va-claim-assistant/filing-integration-contract.json
      - scripts/validate_va_filing_integration_contract.py
      - .github/workflows/va-filing-integration-contract.yml
      - docs/VA_FILING_INTEGRATION_MIRROR_HANDOFF.md
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-filing-integration-contract
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate filing contract
        run: python scripts/validate_va_filing_integration_contract.py

      - name: Persist validation receipt
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/va-claim-assistant/filing-integration-contract-validation.json
          if git diff --cached --quiet; then
            echo "Filing contract receipt unchanged."
          else
            git commit -m "chore: retain VA filing integration contract validation [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-filing-integration-contract-${{ github.run_id }}
          path: |
            data/va-claim-assistant/filing-integration-contract.json
            data/va-claim-assistant/filing-integration-contract-validation.json
          if-no-files-found: error
          retention-days: 90
