name: Check HIL public response import

on:
  push:
    paths:
      - data/hil-responses.json
      - data/hil-public-response-imports/**
      - schemas/hil_public_response_import.schema.json
      - scripts/check_hil_public_response_import.py
      - .github/workflows/check-hil-public-response-import.yml
  pull_request:
    paths:
      - data/hil-responses.json
      - data/hil-public-response-imports/**
      - schemas/hil_public_response_import.schema.json
      - scripts/check_hil_public_response_import.py
      - .github/workflows/check-hil-public-response-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_hil_public_response_import.py
