name: HIL Semantic Continuity Tasks

on:
  push:
    paths:
      - 'docs/HIL_SEMANTIC_CONTINUITY_MIRROR_HANDOFF.md'
      - 'docs/hil-semantic-continuity/**'
      - 'data/hil-semantic-continuity-task-state.json'
      - 'data/hil-semantic-continuity-projection-manifest.json'
      - 'data/schemas/hil-semantic-transformation.schema.json'
      - 'data/fixtures/hil-semantic-transformation/**'
      - 'scripts/check_hil_semantic_continuity_tasks.py'
      - 'scripts/validate_hil_semantic_transformation.py'
      - '.github/workflows/hil-semantic-continuity-tasks.yml'
  pull_request:
    paths:
      - 'docs/HIL_SEMANTIC_CONTINUITY_MIRROR_HANDOFF.md'
      - 'docs/hil-semantic-continuity/**'
      - 'data/hil-semantic-continuity-task-state.json'
      - 'data/hil-semantic-continuity-projection-manifest.json'
      - 'data/schemas/hil-semantic-transformation.schema.json'
      - 'data/fixtures/hil-semantic-transformation/**'
      - 'scripts/check_hil_semantic_continuity_tasks.py'
      - 'scripts/validate_hil_semantic_transformation.py'
      - '.github/workflows/hil-semantic-continuity-tasks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-validate-and-activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate task graph and select next task
        run: python scripts/check_hil_semantic_continuity_tasks.py
      - name: Validate bounded semantic transformation
        run: python scripts/validate_hil_semantic_transformation.py
      - name: Validate JSON artifacts
        run: |
          python -m json.tool data/hil-semantic-continuity-task-state.json >/dev/null
          python -m json.tool data/schemas/hil-semantic-transformation.schema.json >/dev/null
          python -m json.tool data/fixtures/hil-semantic-transformation/bounded-conversation.json >/dev/null
          python -m json.tool data/fixtures/hil-semantic-transformation/calibration-cases.json >/dev/null
          python -m json.tool data/hil-semantic-continuity-projection-manifest.json >/dev/null
      - name: Declare activation eligibility
        run: |
          echo 'HIL semantic-continuity foundational implementation is activation-eligible.'
          echo 'Scientific, publication, custody, and authority effects remain false.'
