name: Observe RTG formalism projection

on:
  push:
    paths:
      - "data/formalism-publication/rtg-projection-task-state.json"
      - "data/formalism-publication/rtg-projection-observation.json"
      - "data/formalism-publication/rtg-publication-readiness.schema.json"
      - "formalisms/rtg/index.html"
      - "scripts/check_rtg_formalism_projection.py"
      - "scripts/stegverse_jsonschema.py"
      - ".github/workflows/observe-rtg-formalism-projection.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Site
        uses: actions/checkout@v4
        with:
          path: Site
          fetch-depth: 0

      - name: Check out RTG source
        uses: actions/checkout@v4
        with:
          repository: Admissible-Existence/RTG
          ref: main
          path: RTG

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Observe formalism projection state
        working-directory: Site
        run: python scripts/check_rtg_formalism_projection.py --rtg-root ../RTG

      - name: Validate observation against Site import contract
        working-directory: Site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.stegverse_jsonschema import Draft202012Validator

          schema = json.loads(Path("data/formalism-publication/rtg-publication-readiness.schema.json").read_text())
          observation = json.loads(Path("data/formalism-publication/rtg-projection-observation.json").read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(observation), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  print(f"FAIL {list(error.path)}: {error.message}")
              raise SystemExit(1)
          print("PASS: RTG projection observation satisfies Site import contract")
          PY

      - name: Verify active review-only projection markers
        working-directory: Site
        run: |
          grep -q "REVIEW-ONLY PROJECTION" formalisms/rtg/index.html
          grep -q "ACTIVE_REVIEW_ONLY" formalisms/rtg/index.html
          grep -q "Admissible-Existence/AE" formalisms/rtg/index.html

      - name: Persist changed Site projection state
        working-directory: Site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/formalism-publication/rtg-projection-observation.json
          if git diff --cached --quiet; then
            echo "No Site projection state change to persist."
          else
            git commit -m 'Update RTG formalism projection observation'
            git push
          fi

      - name: Upload observation record
        uses: actions/upload-artifact@v4
        with:
          name: rtg-formalism-projection-observation
          path: Site/data/formalism-publication/rtg-projection-observation.json
          if-no-files-found: error
          retention-days: 30
