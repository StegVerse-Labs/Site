name: Observe RTG formalism projection

on:
  push:
    paths:
      - "data/formalism-publication/rtg-projection-task-state.json"
      - "data/formalism-publication/rtg-projection-observation.json"
      - "data/formalism-publication/rtg-source-transport-blocked.json"
      - "data/formalism-publication/rtg-publication-readiness.schema.json"
      - "formalisms/rtg/index.html"
      - "scripts/check_rtg_formalism_projection.py"
      - "scripts/stegverse_jsonschema.py"
      - ".github/workflows/observe-rtg-formalism-projection.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Site without credential persistence
        uses: actions/checkout@v4
        with:
          path: Site
          persist-credentials: false

      - name: Record blocked private RTG source transport
        working-directory: Site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema": "stegverse.site.rtg-source-transport-observation/v1",
              "task_id": "SITE-0001-RTG-FORMALISM-PROJECTION-INTAKE",
              "remediation_owner": "StegVerse-Labs/Site#886",
              "source_repository": "Admissible-Existence/RTG",
              "source_branch": "main",
              "state": "BLOCKED_PRIVATE_CROSS_REPO_SOURCE_TRANSPORT",
              "source_materialization_observed": False,
              "projection_recomputed": False,
              "existing_projection_state_mutated": False,
              "content_invalidity_claimed": False,
              "github_token_source_authority": "NONE",
              "credential_authority": "TV/TVC",
              "authority_effect": "NONE",
              "canonical_next_transition": "AWAIT_ADMITTED_RTG_SOURCE_MATERIALIZATION",
              "observed_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          Path("data/formalism-publication/rtg-source-transport-blocked.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Verify existing review-only projection remains untouched
        working-directory: Site
        run: |
          git diff --exit-code -- data/formalism-publication/rtg-projection-observation.json
          grep -q "REVIEW-ONLY PROJECTION" formalisms/rtg/index.html
          grep -q "ACTIVE_REVIEW_ONLY" formalisms/rtg/index.html

      - name: Upload non-authorizing blocked-source observation
        uses: actions/upload-artifact@v4
        with:
          name: rtg-source-transport-blocked-${{ github.run_id }}
          path: Site/data/formalism-publication/rtg-source-transport-blocked.json
          if-no-files-found: error
          retention-days: 30
