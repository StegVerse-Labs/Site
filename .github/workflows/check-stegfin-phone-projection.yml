name: Check StegFin Phone Projection - Validation Only / No GitHub Token Authority

on:
  # Publication is observed once per completed Pages deployment, at the deployed commit (no propagation wait).
  # The pull_request and push validation of this workflow is the catalog group check-stegfin-phone-projection.validate
  # in the stable dispatcher (original path filters kept, NOT_SELECTED receipt otherwise, never skipped).
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]

permissions: {}

concurrency:
  group: stegfin-phone-projection-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select this run (NOT_SELECTED, never skipped)
        id: select
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${WORKFLOW_RUN_CONCLUSION}" = "success" ] && [ "${WORKFLOW_RUN_HEAD_BRANCH}" = "main" ]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
            echo "NOT_SELECTED: the completed Pages deployment is not a successful deployment of main (conclusion=${WORKFLOW_RUN_CONCLUSION:-none}, head_branch=${WORKFLOW_RUN_HEAD_BRANCH:-none}); nothing to observe, no authority effect"
          fi

      - name: Anonymous public checkout of the deployed commit without GitHub credential token
        if: steps.select.outputs.selected == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/Site.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${DEPLOYED_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Observe merged StegFin wallet-browser publication without credential
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/stegfin-public-wallet-transport.report.json
          if STEGVERSE_STEGFIN_PUBLICATION_REPORT="$report" python3 scripts/check_stegfin_public_wallet_transport.py; then
            cat "$report"
            echo 'STEGFIN_PUBLICATION_OBSERVER_AUTHORITY_EFFECT=NONE'
            echo 'STEGFIN_PUBLICATION_OBSERVER_GITHUB_TOKEN_REQUIRED=false'
            exit 0
          fi
          cat "$report" || true
          echo 'FAIL_CLOSED: StegFin publication is not served byte-identical to the deployed commit; the next completed Pages deployment re-attempts.' >&2
          exit 1
