name: Check StegFin Phone Projection - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stegfin-trade.html'
      - 'stegfinco.html'
      - 'assets/stegfin-phone/**'
      - 'scripts/check_stegfin_phone_projection.py'
      - 'scripts/check_stegfin_phone_projection_with_skap.py'
      - 'scripts/check_stegfin_user_wallet_handoff_projection.py'
      - 'docs/STEGFIN_PHONE_PROJECTION_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.json'
      - '.github/workflows/check-stegfin-phone-projection.yml'
  push:
    branches: [main]
    paths:
      - 'stegfin-trade.html'
      - 'stegfinco.html'
      - 'assets/stegfin-phone/**'
      - 'scripts/check_stegfin_phone_projection.py'
      - 'scripts/check_stegfin_phone_projection_with_skap.py'
      - 'scripts/check_stegfin_user_wallet_handoff_projection.py'
      - 'docs/STEGFIN_PHONE_PROJECTION_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.json'
      - '.github/workflows/check-stegfin-phone-projection.yml'

  # Publication is observed once per completed Pages deployment, at the deployed commit (no propagation wait).
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]

permissions: {}

concurrency:
  group: stegfin-phone-projection-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/Site.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate Site pre-work claim registry
        run: python3 scripts/check_session_work_claims.py

      - name: Validate exact StegFin phone projection plus SKAP extension
        run: python3 scripts/check_stegfin_phone_projection_with_skap.py

      - name: Validate USER_ONLY wallet handoff successor projection
        run: python3 scripts/check_stegfin_user_wallet_handoff_projection.py

      - name: Prove validation workflow is non-authorizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/check-stegfin-phone-projection.yml').read_text(encoding='utf-8')
          forbidden = [
              'contents'+': write',
              'git'+' push',
              '$'+'{{ '+'github.token'+' }}',
              'actions/'+'checkout@',
              '$'+'{{ '+'secrets.',
          ]
          found = [value for value in forbidden if value in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('STEGFIN_PHONE_PROJECTION_WORKFLOW_NON_AUTHORIZING_PASS')
          PY

  observe-publication:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous public checkout of the deployed commit without GitHub credential token
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/Site.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${DEPLOYED_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Observe merged StegFin wallet-browser publication without credential
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/stegfin-public-wallet-transport.report.json
          if STEGVERSE_STEGFIN_PUBLICATION_REPORT="$report" python3 scripts/check_stegfin_public_wallet_transport.py; then
            cat "$report"
            echo 'STEGFIN_PUBLICATION_OBSERVER_AUTHORITY_EFFECT=NONE'
            echo 'STEGFIN_PUBLICATION_OBSERVER_GITHUB_TOKEN_REQUIRED=false'
            exit 0
          fi
          cat "$report" || true
          echo 'FAIL_CLOSED: StegFin publication is not served byte-identical to the deployed commit; the next completed Pages deployment or a manual dispatch re-attempts.' >&2
          exit 1
