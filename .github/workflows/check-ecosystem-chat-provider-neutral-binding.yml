name: Check Ecosystem Chat Provider-Neutral Binding

on:
  push:
    paths:
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_ecosystem_chat_provider_neutral_binding.py"
      - ".github/workflows/check-ecosystem-chat-provider-neutral-binding.yml"
  pull_request:
    paths:
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_ecosystem_chat_provider_neutral_binding.py"
      - ".github/workflows/check-ecosystem-chat-provider-neutral-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider-neutral gateway discovery and authority boundary
        run: python scripts/check_ecosystem_chat_provider_neutral_binding.py
