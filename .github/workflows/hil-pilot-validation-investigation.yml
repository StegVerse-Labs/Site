name: HIL Pilot Validation Investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hil-pilot-validation-investigation.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: hil-pilot-validation-investigation
  cancel-in-progress: false

jobs:
  collect-pilot-validation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_WORKFLOW: validate.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve Site Bootstrap Validate runs, jobs, steps, and artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          targets = [
              'e8e39115b245258964939c5b4583dd46b22c623b',
              'aa95c1267a8cf889a53b1e869be78ade18764679',
              '3f69a06176de49cab523c280e2028bd3cc85df04',
              '3391e30ca7894f4364d4a23c3ee7de3c169148b4',
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          workflow = os.environ['TARGET_WORKFLOW']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stegverse-hil-pilot-validation-investigator',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          results = []
          for target_sha in targets:
              query = urllib.parse.urlencode({'head_sha': target_sha, 'per_page': 100})
              runs_payload = get_json(f'{api}/actions/workflows/{workflow}/runs?{query}')
              matching = [
                  run for run in runs_payload.get('workflow_runs', [])
                  if run.get('head_sha') == target_sha
              ]
              push_runs = [run for run in matching if run.get('event') == 'push']
              candidates = push_runs or matching
              if not candidates:
                  results.append({
                      'target_sha': target_sha,
                      'state': 'NO_ASSOCIATED_RUN_RETURNED',
                      'matching_run_count': 0,
                  })
                  continue

              run = sorted(candidates, key=lambda item: item.get('created_at') or '')[-1]
              run_id = int(run['id'])
              jobs_payload = get_json(f'{api}/actions/runs/{run_id}/jobs?filter=all&per_page=100')
              artifacts_payload = get_json(f'{api}/actions/runs/{run_id}/artifacts?per_page=100')

              jobs = []
              first_failed_step = None
              for job in jobs_payload.get('jobs', []):
                  steps = []
                  for step in job.get('steps') or []:
                      normalized = {
                          'number': step.get('number'),
                          'name': step.get('name'),
                          'status': step.get('status'),
                          'conclusion': step.get('conclusion'),
                          'started_at': step.get('started_at'),
                          'completed_at': step.get('completed_at'),
                      }
                      steps.append(normalized)
                      if first_failed_step is None and step.get('conclusion') == 'failure':
                          first_failed_step = {
                              'job_id': int(job['id']),
                              'job_name': job.get('name'),
                              **normalized,
                          }
                  jobs.append({
                      'id': int(job['id']),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'started_at': job.get('started_at'),
                      'completed_at': job.get('completed_at'),
                      'steps': steps,
                  })

              artifacts = [
                  {
                      'id': int(artifact['id']),
                      'name': artifact.get('name'),
                      'size_in_bytes': artifact.get('size_in_bytes'),
                      'digest': artifact.get('digest'),
                      'expired': artifact.get('expired'),
                      'created_at': artifact.get('created_at'),
                      'expires_at': artifact.get('expires_at'),
                  }
                  for artifact in artifacts_payload.get('artifacts', [])
              ]

              results.append({
                  'target_sha': target_sha,
                  'state': 'ASSOCIATED_RUN_RETRIEVED',
                  'matching_run_count': len(matching),
                  'selection_preference': 'latest push run when present, otherwise latest exact-head run',
                  'run': {
                      'id': run_id,
                      'run_number': run.get('run_number'),
                      'run_attempt': run.get('run_attempt'),
                      'name': run.get('name'),
                      'display_title': run.get('display_title'),
                      'event': run.get('event'),
                      'head_branch': run.get('head_branch'),
                      'head_sha': run.get('head_sha'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'created_at': run.get('created_at'),
                      'run_started_at': run.get('run_started_at'),
                      'updated_at': run.get('updated_at'),
                      'html_url': run.get('html_url'),
                  },
                  'jobs': jobs,
                  'first_failed_step': first_failed_step,
                  'artifacts': artifacts,
              })

          receipt = {
              'schema_version': 'HIL-PILOT-VALIDATION-WORKFLOW-EVIDENCE-v1',
              'repository': repo,
              'workflow_name': 'Site Bootstrap Validate',
              'workflow_path': '.github/workflows/validate.yml',
              'collected_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'collector_run_id': int(os.environ['GITHUB_RUN_ID']),
              'collector_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'targets': results,
              'model_state_mutated': False,
              'authority_effect': False,
              'activation_effect': False,
              'release_effect': False,
          }
          output = Path('data/hil-pilot-validation-workflow-evidence.json')
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit pilot validation workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stegverse-hil-pilot-investigator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hil-pilot-validation-workflow-evidence.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'evidence(hil): preserve pilot validation workflow runs'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload pilot validation workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-pilot-validation-investigation-${{ github.run_id }}
          path: data/hil-pilot-validation-workflow-evidence.json
          if-no-files-found: error
          retention-days: 90
