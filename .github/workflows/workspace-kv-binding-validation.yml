  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check assets/workspace.js
      - run: node --check assets/workspace-kv-bridge.js
      - run: node --check assets/workspace-node-binding.js
      - run: node --check assets/workspace-capabilities.js
      - run: node --check assets/workspace-search.js
      - run: node --check assets/workspace-panels.js
      - run: node --check assets/workspace-session-authentication.js
      - run: node --check assets/workspace-assistant-binding.js
      - run: node --check assets/workspace-assistant-continuity.js
      - run: node --check assets/workspace-device-continuity.js
      - run: node --check assets/workspace-explanation.js
      - run: node --check assets/workspace-integration-conformance.js
      - run: node tests/workspace-kv-binding.test.cjs
      - run: node tests/workspace-ui-refusal-six-fields.test.cjs
      - run: node tests/workspace-context-isolation.test.cjs
      - run: node tests/workspace-capability-contract.test.cjs
      - run: node tests/workspace-assistant-binding.test.cjs
      - run: node tests/workspace-session-authentication.test.cjs
      - run: node tests/workspace-mobile-navigation.test.cjs
      - run: node tests/workspace-node-binding.test.cjs
      - run: node tests/workspace-search.test.cjs
      - run: node tests/workspace-kv-entry-points.test.cjs
      - run: node tests/workspace-kv-no-receiver-wait.test.cjs
      - run: node tests/mykv-no-receiver-wait.test.cjs
      - run: node tests/workspace-tasks.test.cjs
      - run: node tests/workspace-panels.test.cjs
      - run: node tests/workspace-assistant-continuity.test.cjs
      - run: node tests/workspace-device-continuity.test.cjs
      - run: node tests/workspace-developer-context.test.cjs
      - run: node tests/workspace-tasks-delivery.test.cjs
      - run: node tests/workspace-delivery-seams.test.cjs
      - run: node tests/workspace-explanation.test.cjs
      - run: node tests/workspace-decision-explanations.test.cjs
      - run: node tests/workspace-integration-conformance.test.cjs
      - run: echo 'VALIDATION_ONLY Site grants no KV identity execution or credential authority'
