name: HIL Live Transition Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/hil-live-probe.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RECEIVER_BASE_URL: https://receiver.stegverse.com
    steps:
      - name: Initialize evidence directory
        run: mkdir -p probe-evidence

      - name: Record DNS state
        shell: bash
        run: |
          set +e
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "host=receiver.stegverse.com"
            getent ahosts receiver.stegverse.com
          } | tee probe-evidence/dns.txt
          exit 0

      - name: Probe transition endpoints
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          import socket
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ['RECEIVER_BASE_URL'].rstrip('/')
          endpoints = [
              ('probes', '/api/hil/probes'),
              ('readiness', '/api/hil/readiness'),
          ]
          evidence = {
              'schema_version': 'HIL-LIVE-PROBE-EVIDENCE-v1',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'receiver_base_url': base,
              'dns': {},
              'endpoints': {},
          }

          try:
              evidence['dns'] = {
                  'state': 'RESOLVED',
                  'addresses': sorted({item[4][0] for item in socket.getaddrinfo('receiver.stegverse.com', 443)}),
              }
          except Exception as exc:
              evidence['dns'] = {'state': 'UNRESOLVED', 'error': repr(exc)}

          for name, path in endpoints:
              url = base + path
              record = {'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'StegVerse-HIL-Live-Probe/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      record.update({
                          'transport_state': 'RESPONSE_RECEIVED',
                          'http_status': response.status,
                          'content_type': response.headers.get('content-type'),
                          'body': body,
                      })
                      try:
                          record['json'] = json.loads(body)
                      except json.JSONDecodeError:
                          record['json_state'] = 'INVALID_OR_NON_JSON'
              except urllib.error.HTTPError as exc:
                  record.update({
                      'transport_state': 'HTTP_ERROR',
                      'http_status': exc.code,
                      'body': exc.read().decode('utf-8', errors='replace'),
                  })
              except Exception as exc:
                  record.update({'transport_state': 'NO_RESPONSE', 'error': repr(exc)})
              evidence['endpoints'][name] = record

          probes = evidence['endpoints'].get('probes', {})
          readiness = evidence['endpoints'].get('readiness', {})
          evidence['summary'] = {
              'dns_state': evidence['dns'].get('state'),
              'routing_state': 'PASS' if probes.get('http_status') == 200 else 'UNCONFIRMED',
              'readiness_state': (
                  readiness.get('json', {}).get('state')
                  if isinstance(readiness.get('json'), dict)
                  else 'UNCONFIRMED'
              ),
              'probe_http_status': probes.get('http_status'),
              'readiness_http_status': readiness.get('http_status'),
          }

          with open('probe-evidence/live-probe.json', 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          exit 0

      - name: Publish probe summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          with open('probe-evidence/live-probe.json', encoding='utf-8') as handle:
              evidence = json.load(handle)
          summary = evidence['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('# HIL Live Transition Probe\n\n')
              out.write(f"- Observed at: `{evidence['observed_at']}`\n")
              out.write(f"- DNS: `{summary['dns_state']}`\n")
              out.write(f"- Routing: `{summary['routing_state']}`\n")
              out.write(f"- Receiver readiness: `{summary['readiness_state']}`\n")
              out.write(f"- Probe HTTP status: `{summary['probe_http_status']}`\n")
              out.write(f"- Readiness HTTP status: `{summary['readiness_http_status']}`\n")
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: hil-live-probe-${{ github.run_id }}
          path: probe-evidence/
          if-no-files-found: error
          retention-days: 30
