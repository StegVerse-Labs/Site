name: HIL Post-Submit Continuity

on:
  pull_request:
    paths:
      - "assets/hil-receiver-fetch.js"
      - "hil-receipt.html"
      - "tests/hil-receiver-cross-origin.test.cjs"
      - "tests/hil-direct-receipt-chain.test.cjs"
      - "tests/hil-accepted-page.test.cjs"
      - "assets/workspace-explanation.js"
      - "tests/hil-decision-reasons.test.cjs"
      - "scripts/verify_hil_readiness_record.py"
      - "scripts/verify_hil_controlled_cycle.py"
      - "tests/hil-receiver-contract.test.cjs"
      - ".github/workflows/hil-publish-readiness.yml"
      - "assets/hil-decision-reasons.js"
      - "humans-as-interoperability-layer.html"
      - "hil-accepted.html"
      - "assets/hil-direct-upload-v1.js"
      - "assets/hil-post-submit-continuity.js"
      - "src/worker.js"
      - "data/hil-receiver-config.json"
      - "scripts/check_hil_post_submit_continuity.py"
      - ".github/workflows/hil-post-submit-continuity.yml"
      - "docs/HIL_SITE_MIRROR_HANDOFF.md"
  push:
    paths:
      - "assets/hil-receiver-fetch.js"
      - "hil-receipt.html"
      - "tests/hil-receiver-cross-origin.test.cjs"
      - "tests/hil-direct-receipt-chain.test.cjs"
      - "tests/hil-accepted-page.test.cjs"
      - "assets/workspace-explanation.js"
      - "tests/hil-decision-reasons.test.cjs"
      - "scripts/verify_hil_readiness_record.py"
      - "scripts/verify_hil_controlled_cycle.py"
      - "tests/hil-receiver-contract.test.cjs"
      - ".github/workflows/hil-publish-readiness.yml"
      - "assets/hil-decision-reasons.js"
      - "humans-as-interoperability-layer.html"
      - "hil-accepted.html"
      - "assets/hil-direct-upload-v1.js"
      - "assets/hil-post-submit-continuity.js"
      - "src/worker.js"
      - "data/hil-receiver-config.json"
      - "scripts/check_hil_post_submit_continuity.py"
      - ".github/workflows/hil-post-submit-continuity.yml"
      - "docs/HIL_SITE_MIRROR_HANDOFF.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Receiver reachable from the static stegverse.org pages
        run: node tests/hil-receiver-cross-origin.test.cjs
      - name: Direct receiver receipt accepted without an InTr chain
        run: node tests/hil-direct-receipt-chain.test.cjs
      - name: Result page history and direct PDF link
        run: node tests/hil-accepted-page.test.cjs
      - name: HIL failures explained in plain language
        run: node tests/hil-decision-reasons.test.cjs
      - name: Receiver contract (readiness-gate cycle and rejections, in-memory registry)
        run: node tests/hil-receiver-contract.test.cjs
      - name: Validate governed submit and prepended result packet
        run: python scripts/check_hil_post_submit_continuity.py
