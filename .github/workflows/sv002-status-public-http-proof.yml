name: StegVerse-002 Status Public HTTP Proof

on:
  pull_request:
    paths:
      - 'scripts/observe_sv002_status_public_http.py'
      - 'tests/test_observe_sv002_status_public_http.py'
      - '.github/workflows/sv002-status-public-http-proof.yml'
      - 'docs/SV002_STATUS_PUBLIC_HTTP_PROOF_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-sv002-status-public-http-847-20260831.json'
      - 'data/tasks/SITE-SV002-STATUS-PUBLIC-HTTP-847.json'
  push:
    branches: [main]
    paths:
      - 'scripts/observe_sv002_status_public_http.py'
      - 'tests/test_observe_sv002_status_public_http.py'
      - '.github/workflows/sv002-status-public-http-proof.yml'
      - 'docs/SV002_STATUS_PUBLIC_HTTP_PROOF_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-sv002-status-public-http-847-20260831.json'
      - 'data/tasks/SITE-SV002-STATUS-PUBLIC-HTTP-847.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate observer semantics
        run: python -m unittest -v tests.test_observe_sv002_status_public_http

  observe:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select this run (NOT_SELECTED, never skipped)
        id: select
        run: |
          set -euo pipefail
          # Same predicate as the former job-level condition: public observation runs on push/main
          # and workflow_dispatch, not on pull_request (validate already ran).
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "NOT_SELECTED: public observation does not run on pull_request (validate already ran); nothing observed, no authority effect"
            echo "## Observer" >> "$GITHUB_STEP_SUMMARY"
            echo "NOT_SELECTED: public observation does not run on pull_request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "selected=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.selected == 'true'
      - name: Observe deployed public status
        if: steps.select.outputs.selected == 'true'
        run: python scripts/observe_sv002_status_public_http.py --attempts 30 --delay-seconds 10
      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.selected == 'true'
        with:
          name: sv002-status-public-http-proof-${{ github.run_id }}
          path: evidence/sv002-status-public-http/
          retention-days: 90
