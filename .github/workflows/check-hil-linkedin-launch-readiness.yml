name: Check HIL LinkedIn Launch Readiness

on:
  pull_request:
    paths:
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'data/hil-linkedin-launch-readiness.json'
      - 'docs/HIL_LINKEDIN_LAUNCH_CHECKLIST.md'
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment-v1.1.js'
      - 'scripts/check_hil_linkedin_launch_readiness.py'
      - '.github/workflows/check-hil-linkedin-launch-readiness.yml'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          python - <<'PY'
          import os, urllib.request, zipfile
          sha = os.environ['SOURCE_SHA']
          url = f'https://github.com/StegVerse-Labs/Site/archive/{sha}.zip'
          req = urllib.request.Request(url, headers={'User-Agent':'StegVerse-validation/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r, open('/tmp/source.zip','wb') as f:
              f.write(r.read())
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.extractall('/tmp/source')
          roots = [p for p in os.listdir('/tmp/source') if os.path.isdir('/tmp/source/' + p)]
          assert len(roots) == 1, roots
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SOURCE_ROOT=/tmp/source/{roots[0]}\n")
          PY
      - name: Verify HIL v1.1 LinkedIn launch boundary
        run: cd "$SOURCE_ROOT" && python scripts/check_hil_linkedin_launch_readiness.py
