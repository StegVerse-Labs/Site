name: Check HIL LinkedIn Launch Readiness

on:
  push:
    paths:
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'data/hil-linkedin-launch-readiness.json'
      - 'docs/HIL_LINKEDIN_LAUNCH_CHECKLIST.md'
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment-v1.1.js'
      - 'scripts/check_hil_linkedin_launch_readiness.py'
      - '.github/workflows/check-hil-linkedin-launch-readiness.yml'
  pull_request:
    paths:
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'data/hil-linkedin-launch-readiness.json'
      - 'docs/HIL_LINKEDIN_LAUNCH_CHECKLIST.md'
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment-v1.1.js'
      - 'scripts/check_hil_linkedin_launch_readiness.py'
      - '.github/workflows/check-hil-linkedin-launch-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify HIL v1.1 LinkedIn launch boundary
        run: python scripts/check_hil_linkedin_launch_readiness.py
