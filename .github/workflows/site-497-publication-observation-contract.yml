name: Site 497 Publication Observation Contract

on:
  pull_request:
    paths:
      - 'data/publication-equivalence-contract.json'
      - 'data/publication-origin-discovery-2026-09-09.json'
      - 'data/publication-origin-selection-2026-09-09.json'
      - 'data/off-github-publication-evidence-template.json'
      - 'data/resident-publication-rendezvous-contract.json'
      - 'scripts/check_site_publication_artifact.py'
      - 'scripts/check_off_github_publication_evidence.py'
      - 'scripts/check_resident_publication_rendezvous_contract.py'
      - 'data/session-work-claims.d/site-third-party-dependency-eradication-497-20260826.json'
      - 'docs/SITE_497_STEGGATE_DEPENDENCY_RECONCILIATION_MIRROR_HANDOFF.md'
      - '.github/workflows/site-497-publication-observation-contract.yml'
  push:
    paths:
      - 'data/publication-equivalence-contract.json'
      - 'data/publication-origin-discovery-2026-09-09.json'
      - 'data/publication-origin-selection-2026-09-09.json'
      - 'data/off-github-publication-evidence-template.json'
      - 'data/resident-publication-rendezvous-contract.json'
      - 'scripts/check_site_publication_artifact.py'
      - 'scripts/check_off_github_publication_evidence.py'
      - 'scripts/check_resident_publication_rendezvous_contract.py'
      - 'data/session-work-claims.d/site-third-party-dependency-eradication-497-20260826.json'
      - 'docs/SITE_497_STEGGATE_DEPENDENCY_RECONCILIATION_MIRROR_HANDOFF.md'
      - '.github/workflows/site-497-publication-observation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source without persisted credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate provider-neutral publication artifact
        run: python3 scripts/check_site_publication_artifact.py
      - name: Validate no-hosted-origin and fail-closed public observation evidence
        run: python3 scripts/check_off_github_publication_evidence.py
      - name: Validate event-ephemeral Node Interlock/InTr rendezvous contract
        run: python3 scripts/check_resident_publication_rendezvous_contract.py
      - name: Confirm event-ephemeral Node Interlock/InTr boundary
        run: |
          echo 'PUBLICATION_ORIGIN_SELECTED=false'
          echo 'HOSTED_PROVIDER_ALLOWED=false'
          echo 'RENDER_ALLOWED=false'
          echo 'RUNTIME_CLASS=EVENT_EPHEMERAL'
          echo 'PERSISTENT_NODE_IDENTITY_REQUIRED=true'
          echo 'PERSISTENT_HOST_REQUIRED=false'
          echo 'ALWAYS_ON_RECEIVER_REQUIRED=false'
          echo 'SECOND_USER_OPERATED_DEVICE_REQUIRED=false'
          echo 'PUBLIC_PROFILE_OBSERVATION_ORIGIN=INDEPENDENT_PUBLIC_HTTPS'
          echo 'INTR_TRANSPORT_PROFILE=stegverse.universal-intr.adjacent-hop/v1'
          echo 'NODE_MEDIATED_TRANSPORT_REQUIRED=true'
          echo 'DIRECT_KV_PEER_TRANSPORT_ALLOWED=false'
          echo 'DIRECT_SKAP_PEER_TRANSPORT_ALLOWED=false'
          echo 'HEARTBEAT_AUTHORIZING=false'
          echo 'COMMIT_CANDIDATE_CANONICAL=false'
          echo 'AUTHENTIC_EVENT_EPHEMERAL_PUBLICATION_EXCHANGE_OBSERVED=false'
          echo 'INDEPENDENT_PUBLICATION_OBSERVED=false'
          echo 'DNS_MUTATION_PERFORMED=false'
          echo 'TLS_RECOVERY_CLAIMED=false'
          echo 'PUBLIC_CONTENT_EQUIVALENCE_CLAIMED=false'
