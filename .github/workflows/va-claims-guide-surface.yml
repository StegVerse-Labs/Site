name: VA Claims Guide surface

on:
  push:
    branches: [main]
    paths:
      - va-disability-claim-guide.html
      - data/va-claim-assistant/chat-capability-state.json
      - scripts/validate_va_claims_guide_surface.py
      - .github/workflows/va-claims-guide-surface.yml
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: va-claims-guide-surface
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate governed Guide
        run: python scripts/validate_va_claims_guide_surface.py
      - name: Persist validation receipt
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/va-claim-assistant/guide-surface-validation.json
          if git diff --cached --quiet; then
            echo "Guide validation receipt unchanged."
          else
            git commit -m "chore: retain VA Claims Guide validation [skip ci]"
            git pull --rebase
            git push
          fi
      - name: Upload Guide evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-claims-guide-${{ github.run_id }}
          path: |
            va-disability-claim-guide.html
            data/va-claim-assistant/chat-capability-state.json
            data/va-claim-assistant/guide-surface-validation.json
          if-no-files-found: error
          retention-days: 30
