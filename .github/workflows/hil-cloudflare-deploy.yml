name: HIL Cloudflare Receiver Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/hil-cloudflare-deploy.yml'
      - 'controls/DEPLOY_HIL_RECEIVER.txt'

permissions:
  contents: write

concurrency:
  group: hil-cloudflare-receiver-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HIL_REGISTRY_DATABASE_ID: ${{ secrets.HIL_REGISTRY_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HIL_REGISTRY_DATABASE_ID"

      - name: Build production Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text())
          config['account_id'] = os.environ['CLOUDFLARE_ACCOUNT_ID']
          config['routes'] = [{
              'pattern': 'stegverse.org/api/hil/*',
              'zone_name': 'stegverse.org'
          }]
          config['d1_databases'] = [{
              'binding': 'HIL_REGISTRY',
              'database_id': os.environ['HIL_REGISTRY_DATABASE_ID']
          }]
          Path('wrangler.production.json').write_text(json.dumps(config, indent=2) + '\n')
          PY

      - name: Deploy receiver Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.production.json

      - name: Verify production readiness route
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p deployment-evidence
          http_status=$(curl --silent --show-error --max-time 30 \
            --output deployment-evidence/readiness.json \
            --dump-header deployment-evidence/readiness-headers.txt \
            --write-out '%{http_code}' \
            https://stegverse.org/api/hil/readiness)
          curl_status=$?
          printf '%s\n' "$http_status" > deployment-evidence/http-status.txt
          python - "$http_status" "$curl_status" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          http_status, curl_status = sys.argv[1:]
          body = None
          try:
              body = json.loads(Path('deployment-evidence/readiness.json').read_text())
          except Exception:
              pass
          state = body.get('state') if isinstance(body, dict) else None
          record = {
              'schema_version': 'HIL-RECEIVER-DEPLOYMENT-RESULT-v1',
              'recorded_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'route': 'https://stegverse.org/api/hil/readiness',
              'http_status': int(http_status) if http_status.isdigit() else None,
              'curl_status': int(curl_status),
              'receiver_state': state,
              'deployed': http_status in {'200', '207'} and isinstance(body, dict),
              'ready': http_status == '200' and state == 'READY',
              'authority_effect': False
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/hil-receiver-deployment-latest.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
          exit 0

      - name: Commit deployment observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/hil-receiver-deployment-latest.json ]; then
            mkdir -p data
            printf '%s\n' '{"schema_version":"HIL-RECEIVER-DEPLOYMENT-RESULT-v1","deployed":false,"ready":false,"failure":"deployment_step_failed_before_live_probe","authority_effect":false}' > data/hil-receiver-deployment-latest.json
          fi
          git config user.name 'stegverse-hil-deployer'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hil-receiver-deployment-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(hil): record receiver deployment observation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce live READY receiver
        shell: bash
        run: |
          python - <<'PY'
          import json
          record = json.load(open('data/hil-receiver-deployment-latest.json'))
          if record.get('ready') is not True:
              raise SystemExit(f"HIL_RECEIVER_NOT_READY:{record}")
          print('HIL_RECEIVER_DEPLOYMENT=PASS')
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-receiver-deployment-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
