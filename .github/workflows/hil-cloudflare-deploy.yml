name: HIL Cloudflare Receiver Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'wrangler.jsonc'
      - 'va-disability-claim-guide.html'
      - 'assets/va-claim-guide/**'
      - 'sv-shared.css'
      - 'index.html'
      - 'scripts/check_va_claim_guide.py'
      - '.github/workflows/va-claim-guide-workers.yml'
      - '.github/workflows/hil-cloudflare-deploy.yml'
      - 'controls/DEPLOY_HIL_RECEIVER.txt'

permissions:
  contents: write

concurrency:
  group: hil-cloudflare-receiver-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HIL_REGISTRY_DATABASE_ID: ${{ secrets.HIL_REGISTRY_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate VA claim guide before deployment
        run: python scripts/check_va_claim_guide.py

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HIL_REGISTRY_DATABASE_ID"

      - name: Build production Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text())
          config['account_id'] = os.environ['CLOUDFLARE_ACCOUNT_ID']
          config['routes'] = [{
              'pattern': 'stegverse.org/api/hil/*',
              'zone_name': 'stegverse.org'
          }]
          config['d1_databases'] = [{
              'binding': 'HIL_REGISTRY',
              'database_id': os.environ['HIL_REGISTRY_DATABASE_ID']
          }]
          Path('wrangler.production.json').write_text(json.dumps(config, indent=2) + '\n')
          PY

      - name: Deploy receiver Worker and static Site
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.production.json

      - name: Verify production readiness route
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p deployment-evidence
          http_status=$(curl --silent --show-error --max-time 30 \
            --output deployment-evidence/readiness.json \
            --dump-header deployment-evidence/readiness-headers.txt \
            --write-out '%{http_code}' \
            https://stegverse.org/api/hil/readiness)
          curl_status=$?
          printf '%s\n' "$http_status" > deployment-evidence/http-status.txt
          python - "$http_status" "$curl_status" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          http_status, curl_status = sys.argv[1:]
          body = None
          try:
              body = json.loads(Path('deployment-evidence/readiness.json').read_text())
          except Exception:
              pass
          state = body.get('state') if isinstance(body, dict) else None
          record = {
              'schema_version': 'HIL-RECEIVER-DEPLOYMENT-RESULT-v1',
              'recorded_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'route': 'https://stegverse.org/api/hil/readiness',
              'http_status': int(http_status) if http_status.isdigit() else None,
              'curl_status': int(curl_status),
              'receiver_state': state,
              'deployed': http_status in {'200', '207'} and isinstance(body, dict),
              'ready': http_status == '200' and state == 'READY',
              'authority_effect': False
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/hil-receiver-deployment-latest.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
          exit 0

      - name: Verify deployed VA claim guide and mobile asset
        shell: bash
        run: |
          set +e
          page_url='https://site.rigelrandolph.workers.dev/va-disability-claim-guide.html'
          asset_url='https://site.rigelrandolph.workers.dev/assets/va-claim-guide/01-open-va-app-v2.svg'
          page_status=$(curl --silent --show-error --max-time 30 --output deployment-evidence/va-claim-guide.html --write-out '%{http_code}' "$page_url")
          page_curl=$?
          asset_status=$(curl --silent --show-error --max-time 30 --output deployment-evidence/va-claim-guide-image.svg --write-out '%{http_code}' "$asset_url")
          asset_curl=$?
          python - "$page_status" "$page_curl" "$asset_status" "$asset_curl" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          page_status, page_curl, asset_status, asset_curl = sys.argv[1:]
          page = Path('deployment-evidence/va-claim-guide.html').read_text(errors='replace') if Path('deployment-evidence/va-claim-guide.html').exists() else ''
          asset = Path('deployment-evidence/va-claim-guide-image.svg').read_text(errors='replace') if Path('deployment-evidence/va-claim-guide-image.svg').exists() else ''
          markers = [
              'Purpose: accurate claims, not inflated claims.',
              'Submit all claim-relevant documents to ChatGPT for organization',
              'Watch this box for messages describing the assistant',
              'VA Form 21-526EZ',
              'Official sources'
          ]
          record = {
              'schema_version': 'VA-CLAIM-GUIDE-DEPLOYMENT-RESULT-v1',
              'recorded_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'page_url': 'https://site.rigelrandolph.workers.dev/va-disability-claim-guide.html',
              'asset_url': 'https://site.rigelrandolph.workers.dev/assets/va-claim-guide/01-open-va-app-v2.svg',
              'page_http_status': int(page_status) if page_status.isdigit() else None,
              'page_curl_status': int(page_curl),
              'asset_http_status': int(asset_status) if asset_status.isdigit() else None,
              'asset_curl_status': int(asset_curl),
              'required_markers': {m: (m in page) for m in markers},
              'asset_is_svg': '<svg' in asset,
              'verified': page_status == '200' and asset_status == '200' and all(m in page for m in markers) and '<svg' in asset,
              'live_llm_active': False,
              'private_document_analysis_active': False,
              'authority_effect': False
          }
          Path('data/va-claim-guide-deployment-latest.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
          exit 0

      - name: Commit deployment observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/hil-receiver-deployment-latest.json ]; then
            mkdir -p data
            printf '%s\n' '{"schema_version":"HIL-RECEIVER-DEPLOYMENT-RESULT-v1","deployed":false,"ready":false,"failure":"deployment_step_failed_before_live_probe","authority_effect":false}' > data/hil-receiver-deployment-latest.json
          fi
          if [ ! -f data/va-claim-guide-deployment-latest.json ]; then
            mkdir -p data
            printf '%s\n' '{"schema_version":"VA-CLAIM-GUIDE-DEPLOYMENT-RESULT-v1","verified":false,"failure":"deployment_step_failed_before_live_probe","authority_effect":false}' > data/va-claim-guide-deployment-latest.json
          fi
          git config user.name 'stegverse-site-deployer'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hil-receiver-deployment-latest.json data/va-claim-guide-deployment-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(site): record deployment observations'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce live READY receiver and VA guide
        shell: bash
        run: |
          python - <<'PY'
          import json
          receiver = json.load(open('data/hil-receiver-deployment-latest.json'))
          guide = json.load(open('data/va-claim-guide-deployment-latest.json'))
          if receiver.get('ready') is not True:
              raise SystemExit(f"HIL_RECEIVER_NOT_READY:{receiver}")
          if guide.get('verified') is not True:
              raise SystemExit(f"VA_CLAIM_GUIDE_NOT_VERIFIED:{guide}")
          print('HIL_RECEIVER_DEPLOYMENT=PASS')
          print('VA_CLAIM_GUIDE_DEPLOYMENT=PASS')
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-deployment-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
