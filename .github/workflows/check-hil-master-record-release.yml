name: Check HIL Master Record Release

on:
  push:
    paths:
      - 'data/hil-master-records.json'
      - 'data/hil-master-record-releases/**'
      - 'schemas/hil_master_record_release.schema.json'
      - 'scripts/check_hil_master_record_release.py'
      - '.github/workflows/check-hil-master-record-release.yml'
  pull_request:
    paths:
      - 'data/hil-master-records.json'
      - 'data/hil-master-record-releases/**'
      - 'schemas/hil_master_record_release.schema.json'
      - 'scripts/check_hil_master_record_release.py'
      - '.github/workflows/check-hil-master-record-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HIL Master Record release chain
        run: python scripts/check_hil_master_record_release.py
