name: StegSocials Post Preparation

on:
  pull_request:
    paths:
      - 'assets/my-kv-directory.js'
      - 'assets/my-kv-device-kv-query-bridge.js'
      - 'assets/stegsocials-post-preparation.js'
      - 'assets/stegsocials-kv-draft-write-bridge.js'
      - 'assets/stegsocials-bounded-group-kv-conditional-write.js'
      - 'assets/stegsocials-bounded-group-device-kv-cas-receiver.js'
      - 'assets/stegsocials-bounded-group-node-intr-bridge.js'
      - 'assets/stegsocials-bounded-group-runtime-proof.js'
      - 'assets/my-kv-n-device-kv-receiver.js'
      - 'my-kv-directory.html'
      - 'stegsocials-prepare.html'
      - 'stegsocials-bounded-group-runtime-proof.html'
      - 'tests/stegsocials-post-preparation.test.cjs'
      - 'tests/stegsocials-kv-draft-write-bridge.test.cjs'
      - 'tests/stegsocials-bounded-group-kv-conditional-write.test.cjs'
      - 'tests/stegsocials-bounded-group-device-kv-cas-receiver.test.cjs'
      - 'tests/stegsocials-bounded-group-node-intr-bridge.test.cjs'
      - 'tests/stegsocials-bounded-group-runtime-proof.test.cjs'
      - 'docs/ERL_STEGSOCIALS_POST_PREPARATION_CONTRACT.md'
      - 'docs/ERL_STEGSOCIALS_POST_PREPARATION_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_KV_CAS_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_DEVICE_KV_CAS_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_NODE_INTR_ROUTING_README.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_NODE_INTR_ROUTING_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_RUNTIME_PROOF_README.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_RUNTIME_PROOF_MIRROR_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/stegsocials-post-preparation.yml'
  push:
    branches: [main]
    paths:
      - 'assets/my-kv-directory.js'
      - 'assets/my-kv-device-kv-query-bridge.js'
      - 'assets/stegsocials-post-preparation.js'
      - 'assets/stegsocials-kv-draft-write-bridge.js'
      - 'assets/stegsocials-bounded-group-kv-conditional-write.js'
      - 'assets/stegsocials-bounded-group-device-kv-cas-receiver.js'
      - 'assets/stegsocials-bounded-group-node-intr-bridge.js'
      - 'assets/stegsocials-bounded-group-runtime-proof.js'
      - 'assets/my-kv-n-device-kv-receiver.js'
      - 'my-kv-directory.html'
      - 'stegsocials-prepare.html'
      - 'stegsocials-bounded-group-runtime-proof.html'
      - 'tests/stegsocials-post-preparation.test.cjs'
      - 'tests/stegsocials-kv-draft-write-bridge.test.cjs'
      - 'tests/stegsocials-bounded-group-kv-conditional-write.test.cjs'
      - 'tests/stegsocials-bounded-group-device-kv-cas-receiver.test.cjs'
      - 'tests/stegsocials-bounded-group-node-intr-bridge.test.cjs'
      - 'tests/stegsocials-bounded-group-runtime-proof.test.cjs'
      - 'docs/ERL_STEGSOCIALS_POST_PREPARATION_CONTRACT.md'
      - 'docs/ERL_STEGSOCIALS_POST_PREPARATION_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_KV_CAS_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_DEVICE_KV_CAS_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_NODE_INTR_ROUTING_README.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_NODE_INTR_ROUTING_MIRROR_HANDOFF.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_RUNTIME_PROOF_README.md'
      - 'docs/STEGSOCIALS_BOUNDED_GROUP_RUNTIME_PROOF_MIRROR_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/stegsocials-post-preparation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test ERL-backed standard preparation and premium boundary
        run: node tests/stegsocials-post-preparation.test.cjs
      - name: Test governed MyKV draft admission and hash readback boundary
        run: node tests/stegsocials-kv-draft-write-bridge.test.cjs
      - name: Test bounded-group Personal-KV conditional-write contract
        run: node tests/stegsocials-bounded-group-kv-conditional-write.test.cjs
      - name: Test bounded-group resident DEVICE_KV CAS receiver
        run: node tests/stegsocials-bounded-group-device-kv-cas-receiver.test.cjs
      - name: Test bounded-group registered Node/InTr routing
        run: node tests/stegsocials-bounded-group-node-intr-bridge.test.cjs
      - name: Test bounded-group current-device runtime proof boundary
        run: node tests/stegsocials-bounded-group-runtime-proof.test.cjs
      - name: Verify preparation page is non-publishing
        run: |
          grep -q 'Prepare a StegSocials post' stegsocials-prepare.html
          grep -q 'does not contact a social provider' stegsocials-prepare.html
          grep -q 'Save draft to My KV' stegsocials-prepare.html
          grep -q 'provider_call_performed:false' assets/stegsocials-post-preparation.js
          grep -q 'provider_call_performed:false' assets/stegsocials-kv-draft-write-bridge.js
          grep -q 'exact_content_bytes_readback_verified:false' assets/stegsocials-kv-draft-write-bridge.js
          grep -q '03_Records/StegSocials/PostGroupState/' assets/stegsocials-bounded-group-device-kv-cas-receiver.js
          grep -q 'stegverse-device-local-intr-v1' assets/stegsocials-bounded-group-device-kv-cas-receiver.js
          grep -q '/assets/my-kv-n-device-kv-receiver.js' assets/stegsocials-bounded-group-node-intr-bridge.js
          grep -q 'carrier_grants_authority:false' assets/stegsocials-bounded-group-node-intr-bridge.js
          grep -q 'external_intr_admission_observed:false' assets/stegsocials-bounded-group-node-intr-bridge.js
          grep -q 'external_intr_admission_inferred:false' assets/stegsocials-bounded-group-runtime-proof.js
          grep -q 'Run exact runtime proof' stegsocials-bounded-group-runtime-proof.html
          grep -q '02_Research/StegSocials/Drafts' assets/stegsocials-post-preparation.js
