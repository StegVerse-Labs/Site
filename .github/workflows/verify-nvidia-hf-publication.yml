name: Verify NVIDIA Hugging Face publication

on:
  pull_request:
    paths:
      - 'hugging-face.html'
      - 'hugging-face-analysis.html'
      - 'data/nvidia-hugging-face-analysis.json'
      - 'data/nvidia-hugging-face-living-analysis.json'
      - 'nvidia-hugging-face-governance-analysis.html'
      - 'stegos-node/sv-dn1-resident-observation-v3.html'
      - 'Papers.html'
      - 'news-releases.html'
      - 'docs/NVIDIA_HUGGING_FACE_ANALYSIS_MIRROR_HANDOFF.md'
      - 'scripts/validate_nvidia_hugging_face_analysis.py'
      - 'scripts/validate_nvidia_hugging_face_living_analysis.py'
      - 'README.md'
      - 'data/session-work-claims.d/site-hf-living-analysis-1069-20260905.json'
      - 'data/session-work-claims.d/site-hf-analysis-public-ux-1075-20260906.json'
      - '.github/workflows/verify-nvidia-hf-publication.yml'
  push:
    branches: [main]
    paths:
      - 'hugging-face.html'
      - 'hugging-face-analysis.html'
      - 'data/nvidia-hugging-face-analysis.json'
      - 'data/nvidia-hugging-face-living-analysis.json'
      - 'nvidia-hugging-face-governance-analysis.html'
      - 'stegos-node/sv-dn1-resident-observation-v3.html'
      - 'Papers.html'
      - 'news-releases.html'
      - 'docs/NVIDIA_HUGGING_FACE_ANALYSIS_MIRROR_HANDOFF.md'
      - 'scripts/validate_nvidia_hugging_face_analysis.py'
      - 'scripts/validate_nvidia_hugging_face_living_analysis.py'
      - 'README.md'
      - 'data/session-work-claims.d/site-hf-living-analysis-1069-20260905.json'
      - 'data/session-work-claims.d/site-hf-analysis-public-ux-1075-20260906.json'
      - '.github/workflows/verify-nvidia-hf-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate living-analysis source contract
        run: |
          python3 scripts/validate_nvidia_hugging_face_living_analysis.py
          python3 scripts/validate_nvidia_hugging_face_analysis.py
      - name: Verify exact public Hugging Face publication routes
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import time
          import urllib.request

          targets = [
              ('https://stegverse.org/hugging-face.html', [
                  b'What changes when AI capability moves closer to real-world execution?',
                  b'Working capability is not the same thing as permission to act.',
                  b'We have a baseline, but not enough history to claim a trend.',
                  b'Five questions we keep separate',
              ]),
              ('https://stegverse.org/hugging-face-analysis.html', [
                  b'Hugging Face Analysis Home',
                  b'Where things stand today',
                  b'What we know',
                  b'What we do not know yet',
                  b'What would change this assessment',
                  b'Technical record and methodology',
              ]),
              ('https://stegverse.org/data/nvidia-hugging-face-living-analysis.json', [
                  b'stegverse.nvidia_hf_living_analysis.v1',
                  b'ONE_AUTHENTIC_CHECKPOINT_ONLY',
                  b'NO_AUTHENTIC_T1_YET',
              ]),
              ('https://stegverse.org/nvidia-hugging-face-governance-analysis.html', [b'When Capability Becomes Infrastructure']),
              ('https://stegverse.org/stegos-node/sv-dn1-resident-observation-v3.html', [b'SV-DN-1 Resident Observation']),
              ('https://stegverse.org/Papers.html', [b'When Capability Becomes Infrastructure']),
              ('https://stegverse.org/news-releases.html', [b'hugging-face.html', b'Hugging Face']),
          ]
          last = []
          for attempt in range(18):
              last = []
              for url, markers in targets:
                  try:
                      req = urllib.request.Request(url, method='GET', headers={'User-Agent':'StegVerse-hf-publication-verifier/3.0'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read(2_000_000)
                          missing = [m.decode('utf-8', 'replace') for m in markers if m not in body]
                          ok = response.status == 200 and not missing
                          last.append((url, response.status, missing, ok, body[:160]))
                  except Exception as exc:
                      last.append((url, None, ['REQUEST_FAILED'], False, repr(exc).encode()[:160]))
              if all(item[3] for item in last):
                  for url, status, _, _, _ in last:
                      print(f'PUBLIC_ROUTE_PASS {status} {url}')
                  print('HUGGING_FACE_PUBLIC_UX_READY_TO_SHARE')
                  raise SystemExit(0)
              time.sleep(10)
          for url, status, missing, ok, sample in last:
              print(f'PUBLIC_ROUTE_FAIL status={status} missing={missing!r} marker_ok={ok} url={url} sample={sample!r}')
          raise SystemExit(1)
          PY
