name: Verify NVIDIA Hugging Face publication

on:
  push:
    branches: [main]
    paths:
      - 'hugging-face-analysis.html'
      - 'nvidia-hugging-face-governance-analysis.html'
      - 'stegos-node/sv-dn1-resident-observation-v3.html'
      - 'Papers.html'
      - 'news-releases.html'
      - 'docs/NVIDIA_HUGGING_FACE_ANALYSIS_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-nvidia-hf-analysis-1001-r4-20260904.json'
      - '.github/workflows/verify-nvidia-hf-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public publication routes
        run: |
          python - <<'PY'
          import time
          import urllib.request

          targets = [
              ('https://stegverse.org/hugging-face-analysis.html', b'Hugging Face Analysis'),
              ('https://stegverse.org/nvidia-hugging-face-governance-analysis.html', b'When Capability Becomes Infrastructure'),
              ('https://stegverse.org/stegos-node/sv-dn1-resident-observation-v3.html', b'SV-DN-1 Resident Observation'),
              ('https://stegverse.org/Papers.html', b'When Capability Becomes Infrastructure'),
              ('https://stegverse.org/news-releases.html', b'Hugging Face'),
          ]
          last = []
          for attempt in range(18):
              last = []
              for url, marker in targets:
                  try:
                      req = urllib.request.Request(url, method='GET', headers={'User-Agent':'StegVerse-hf-publication-verifier/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read(1_000_000)
                          ok = response.status == 200 and marker in body
                          last.append((url, response.status, marker.decode(), ok, body[:160]))
                  except Exception as exc:
                      last.append((url, None, marker.decode(), False, repr(exc).encode()[:160]))
              if all(item[3] for item in last):
                  for url, status, marker, _, _ in last:
                      print(f'PUBLIC_ROUTE_PASS {status} marker={marker!r} {url}')
                  print('HUGGING_FACE_PUBLICATION_READY_TO_SHARE')
                  raise SystemExit(0)
              time.sleep(10)
          for url, status, marker, ok, sample in last:
              print(f'PUBLIC_ROUTE_FAIL status={status} marker={marker!r} marker_ok={ok} url={url} sample={sample!r}')
          raise SystemExit(1)
          PY
