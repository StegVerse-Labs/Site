name: Advance Marketplace Coinbase Activation

# Recurring activation advancement is a StegVerse-worker responsibility.
# This GitHub surface remains manual/event-driven pending TV/TVC-native transfer.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/advance_marketplace_coinbase_activation.py'
      - 'data/marketplace-coinbase-activation-tasks.json'
      - 'docs/MARKETPLACE_COINBASE_ACCESSIBILITY_MIRROR_HANDOFF.md'
      - '.github/workflows/advance-marketplace-coinbase-activation.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: marketplace-coinbase-autonomous-activation
  cancel-in-progress: true

jobs:
  advance:
    runs-on: ubuntu-latest
    env:
      STEGVERSE_CROSS_REPO_READ_TOKEN: ${{ secrets.MARKETPLACE_COINBASE_EVIDENCE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe and advance repository-owned tasks
        run: python scripts/advance_marketplace_coinbase_activation.py
      - name: Commit updated task state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketplace-coinbase-activation-tasks.json
          if git diff --cached --quiet; then
            echo "No activation-task state change."
            exit 0
          fi
          git commit -m "chore: advance Marketplace Coinbase activation tasks [skip ci]"
          git pull --rebase
          git push
      - name: Preserve task registry
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-coinbase-activation-tasks-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/marketplace-coinbase-activation-tasks.json
          if-no-files-found: error
          retention-days: 30
