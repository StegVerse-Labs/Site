name: VA Federal-Plus Security Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/va-claim-assistant/federal-plus-security-baseline.json'
      - 'scripts/validate_va_federal_plus_security_baseline.py'
      - '.github/workflows/va-federal-plus-security-baseline.yml'
      - 'docs/VA_FEDERAL_PLUS_SECURITY_MIRROR_HANDOFF.md'

permissions:
  contents: write

concurrency:
  group: va-federal-plus-security-baseline
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate baseline
        run: python scripts/validate_va_federal_plus_security_baseline.py
      - name: Verify fail-closed receipt
        run: |
          python - <<'PY'
          import json
          p='data/va-claim-assistant/federal-plus-security-baseline-validation.json'
          r=json.load(open(p))
          assert r['state']=='PASS', r
          assert r['federal_floor_required'] is True
          assert r['exceeds_floor_required'] is True
          assert r['control_family_count']==20
          assert r['plus_domain_count']==7
          assert r['authority_effect'] is False
          assert r['activation_effect'] is False
          print('VA_FEDERAL_PLUS_SECURITY_BASELINE=PASS')
          PY
      - name: Persist receipt
        run: |
          git config user.name 'stegverse-security-baseline'
          git config user.email 'actions@users.noreply.github.com'
          git add data/va-claim-assistant/federal-plus-security-baseline-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(va): record federal-plus security baseline validation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-federal-plus-security-${{ github.run_id }}
          path: |
            data/va-claim-assistant/federal-plus-security-baseline.json
            data/va-claim-assistant/federal-plus-security-baseline-validation.json
          retention-days: 90
