name: Check HIL First Release Readiness

on:
  pull_request:
    paths:
      - "data/hil-first-release-readiness.json"
      - "scripts/check_hil_first_release_readiness.py"
      - ".github/workflows/check-hil-first-release-readiness.yml"
  push:
    branches: [main]
    paths:
      - "data/hil-first-release-readiness.json"
      - "scripts/check_hil_first_release_readiness.py"
      - ".github/workflows/check-hil-first-release-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate fail-closed first-release state
        run: python scripts/check_hil_first_release_readiness.py
