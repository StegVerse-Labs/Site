name: Import Marketplace Coinbase First Accessibility

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/import_marketplace_coinbase_first_accessibility.py'
      - 'docs/MARKETPLACE_COINBASE_FIRST_ACCESSIBILITY_HANDOFF.md'
      - '.github/workflows/import-marketplace-coinbase-first-accessibility.yml'

permissions:
  contents: write

concurrency:
  group: site-marketplace-coinbase-first-accessibility
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import bounded accessibility status
        id: import
        run: |
          set +e
          python scripts/import_marketplace_coinbase_first_accessibility.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit changed bounded status
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "stegverse-site-accessibility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/marketplace-coinbase-first-accessibility-status.json
          if git diff --cached --quiet; then
            echo "No accessibility projection change."
            exit 0
          fi
          git commit -m "Record Marketplace Coinbase accessibility projection [skip ci]"
          git pull --rebase
          git push

      - name: Upload bounded projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-marketplace-coinbase-first-accessibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/marketplace-coinbase-first-accessibility-status.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail after preserving rejected source
        if: steps.import.outputs.exit_code != '0'
        run: |
          echo "Source receipt was rejected. Bounded status was preserved."
          exit 1
