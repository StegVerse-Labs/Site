name: TASK-0011 Public Site Publication Proof

on:
  push:
    branches:
      - reconcile/task0011-postmerge-publication
    paths:
      - .github/workflows/task0011-publication-proof.yml
  workflow_dispatch:

permissions: {}

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe exact public TestFlight bootstrap chain
        shell: bash
        run: |
          set -euo pipefail
          base='https://stegverse.org/stegos-bootstrap'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_public() {
            local name="$1"
            local url="$base/$name"
            local out="$tmp/$name"
            local code=''
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output "$out" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = '200' ]; then break; fi
              sleep 5
            done
            test "$code" = '200' || { echo "public fetch failed: $url HTTP=$code" >&2; exit 1; }
          }

          verify_blob() {
            local name="$1" expected_blob="$2"
            fetch_public "$name"
            actual_blob="$(git hash-object "$tmp/$name")"
            test "$actual_blob" = "$expected_blob" || {
              echo "public blob mismatch: $name expected=$expected_blob actual=$actual_blob" >&2
              exit 1
            }
            echo "PUBLIC_EXACT_BLOB_OK $name blob=$actual_blob"
          }

          verify_sha_size() {
            local name="$1" expected_sha="$2" expected_bytes="$3" expected_blob="$4"
            fetch_public "$name"
            actual_sha="$(sha256sum "$tmp/$name" | awk '{print $1}')"
            actual_bytes="$(stat -c %s "$tmp/$name")"
            actual_blob="$(git hash-object "$tmp/$name")"
            test "$actual_sha" = "$expected_sha" || { echo "public SHA mismatch: $name" >&2; exit 1; }
            test "$actual_bytes" = "$expected_bytes" || { echo "public size mismatch: $name" >&2; exit 1; }
            test "$actual_blob" = "$expected_blob" || { echo "public blob mismatch: $name" >&2; exit 1; }
            echo "PUBLIC_EXACT_BINARY_OK $name sha256=$actual_sha bytes=$actual_bytes blob=$actual_blob"
          }

          verify_blob current-iphone-testflight.html c468ceef66a10f1475efc0406c0c9277def004ba
          verify_blob current-iphone-testflight-bootstrap.js e9962ba5589e5f0e3fa2ec32381d65bb41f4f39f
          verify_blob kv-bound-ephemeral-projection-context.js 11f69313eae67b9a7f9126f2e1af331331291dec
          verify_blob kv-projection-file-loader.js 2682b2f9203770203010146bafcd539313a42948
          verify_blob stegos_current_iphone_ipa_signer.js 4a44ef69ac3e61b9c353d439b4781bec3811f63e
          verify_sha_size StegOSMobile-unsigned-device.ipa 557d559082bdefca5fcc69c86f342d8cc035c2d803d154de5ed45b5677f80c35 389564 3183c95dbcd73ab7d86acad9b68aef41ea1110b0
          verify_sha_size stegos_current_iphone_ipa_signer_bg.wasm 699dc3054788d779ba7920e332c661ef7eac001156f93ab7b1fe1b64ee5a4b93 2277815 74d9ece3a911c20ce9f89e879c91e027fab10c12

          echo 'TASK0011_PUBLIC_SITE_PUBLICATION=PASS'
          echo 'TASK0011_PUBLICATION_AUTHORITY_EFFECT=NONE'
          echo 'TASK0011_RUNTIME_PROOF_EFFECT=NONE'
