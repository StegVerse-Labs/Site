name: TASK-0011 Public Site Publication Proof

on:
  push:
    branches:
      - reconcile/task0011-postmerge-publication
    paths:
      - .github/workflows/task0011-publication-proof.yml
  workflow_dispatch:

permissions: {}

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe exact public TestFlight bootstrap chain
        shell: bash
        run: |
          set -euo pipefail
          base='https://stegverse.org/stegos-bootstrap'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_exact() {
            local name="$1"
            local expected_sha="$2"
            local expected_bytes="${3:-}"
            local url="$base/$name"
            local out="$tmp/$name"
            local code=''
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output "$out" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = '200' ]; then break; fi
              sleep 5
            done
            test "$code" = '200' || { echo "public fetch failed: $url HTTP=$code" >&2; exit 1; }
            actual_sha="$(sha256sum "$out" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha" || {
              echo "public SHA mismatch: $name expected=$expected_sha actual=$actual_sha" >&2
              exit 1
            }
            if [ -n "$expected_bytes" ]; then
              actual_bytes="$(stat -c %s "$out")"
              test "$actual_bytes" = "$expected_bytes" || {
                echo "public size mismatch: $name expected=$expected_bytes actual=$actual_bytes" >&2
                exit 1
              }
            fi
            echo "PUBLIC_EXACT_OK $name sha256=$actual_sha"
          }

          fetch_exact current-iphone-testflight.html 1b97a27273dd46aa783614e0ec3ad2e750790168f90f54d0e4551b705260f87d
          fetch_exact current-iphone-testflight-bootstrap.js d016b8ef9555a0ff86c59adb1bf2c011eb9f65e166cbe86522cd339b22ed2212
          fetch_exact kv-bound-ephemeral-projection-context.js 7e73ebf243bf331a8cd58d8bff3d79605695441905117d6dca7fb12be226f5b3
          fetch_exact kv-projection-file-loader.js c91d8f8c36f983bc66bcaff73e141fd2c9ca906a2b55d38e560b9d929b5ca14e
          fetch_exact StegOSMobile-unsigned-device.ipa 557d559082bdefca5fcc69c86f342d8cc035c2d803d154de5ed45b5677f80c35 389564
          fetch_exact stegos_current_iphone_ipa_signer_bg.wasm 699dc3054788d779ba7920e332c661ef7eac001156f93ab7b1fe1b64ee5a4b93 2277815
          fetch_exact stegos_current_iphone_ipa_signer.js 17fe61cfdae43cbe5a1d1b211beb39838f58e982efdba90c7156fc36402f3adb

          echo 'TASK0011_PUBLIC_SITE_PUBLICATION=PASS'
          echo 'TASK0011_PUBLICATION_AUTHORITY_EFFECT=NONE'
          echo 'TASK0011_RUNTIME_PROOF_EFFECT=NONE'
