name: Ecosystem Chat Activation Retention

on:
  workflow_run:
    workflows:
      - Site Task Runner
    types:
      - completed
  schedule:
    - cron: "11 * * * *"
  push:
    paths:
      - 'scripts/watch_ecosystem_chat_adapter_monitor.py'
      - 'scripts/import_ecosystem_chat_external_activation_states.py'
      - 'scripts/check_ecosystem_chat_activation_retention_credential_boundary.py'
      - '.github/workflows/ecosystem-chat-activation-retention.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-chat-activation-retention
  cancel-in-progress: false

jobs:
  retain-owner-routed-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate activation-retention credential boundary
        run: python scripts/check_ecosystem_chat_activation_retention_credential_boundary.py

      - name: Validate activation-receipt import source contract
        run: python scripts/check_ecosystem_chat_activation_receipt_import.py

      - name: Validate local TVC activation-evidence importer
        run: python -m unittest -v tests.test_import_tvc_ecosystem_chat_activation_evidence

      - name: Validate checked-in activation-state consistency without mutation
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          state = json.loads(Path('data/ecosystem-chat-activation-state.json').read_text())
          propagation = json.loads(Path('data/ecosystem-chat-activation-propagation.json').read_text())
          imported = json.loads(Path('data/ecosystem-chat-destination-activation-import-status.json').read_text())
          watch_path = Path('data/ecosystem-chat-adapter-monitor-watch.json')

          assert state['manual_user_action_required'] is False
          assert propagation['source_state_sha256'] == state['state_sha256']
          assert isinstance(state['gates']['destination_state_imported'], bool)
          assert isinstance(state['gates']['external_import_status_recorded'], bool)
          if not state['gates']['destination_state_imported'] or not state['gates']['external_import_status_recorded']:
              assert state['state'] == 'ACTIVATION_PENDING_EVIDENCE'
              assert propagation['state'] == 'PENDING_ACTIVATION_EVIDENCE'
          if watch_path.exists():
              watch = json.loads(watch_path.read_text())
              assert watch['schema'] == 'stegverse.ecosystem_chat.adapter_monitor_watch.v2'
              assert watch['manual_user_action_required'] is False
              assert watch['heartbeat_boundary']['github_actions_is_runtime_heartbeat'] is False
              assert watch['heartbeat_boundary']['runtime_heartbeat_authority_modified'] is False
              material = dict(watch)
              expected = material.pop('watch_sha256')
              actual = hashlib.sha256(json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
              assert expected == actual
          else:
              print('adapter monitor watch absent: no hosted runtime observation claimed')
          assert state['state'] in {'ACTIVATION_PENDING_EVIDENCE', 'ACTIVATION_COMPLETE'}
          assert propagation['state'] in {'PENDING_ACTIVATION_EVIDENCE', 'READY_FOR_DOWNSTREAM_INGESTION'}
          assert imported['state'] in {'PENDING_SOURCE_RECEIPT', 'VERIFIED_SOURCE_RECEIPT_IMPORTED'}
          print('activation retention source/state contract is internally consistent')
          PY

      - name: Summarize validation-only retention state
        if: always()
        run: |
          echo "## Ecosystem Chat Activation Retention — Validation Only" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/ecosystem-chat-adapter-monitor-watch.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          watch = json.loads(Path('data/ecosystem-chat-adapter-monitor-watch.json').read_text())
          print(f"Adapter activation-evidence watch: {watch.get('state')}")
          print(f"Adapter evidence blockers: {', '.join(watch.get('blockers', [])) or 'none'}")
          PY
          fi
          if [ -f data/ecosystem-chat-activation-state.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          state = json.loads(Path('data/ecosystem-chat-activation-state.json').read_text())
          print(f"Activation state: {state.get('state')}")
          print(f"Manual user action required: {state.get('manual_user_action_required')}")
          print(f"Owner-routed actions: {len(state.get('next_actions', []))}")
          print(f"State SHA-256: {state.get('state_sha256')}")
          PY
          fi
