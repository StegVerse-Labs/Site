name: Observe and Complete Canonical Gateway Tasks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/ecosystem-node-gateway-binding.js"
      - "assets/conectrr-interop.js"
      - "ecosystem-chat.html"
      - "data/development-tasks/canonical-gateway-activation.json"
      - "scripts/observe_and_complete_canonical_gateway_tasks.py"
      - ".github/workflows/observe-complete-canonical-gateway-tasks.yml"
  push:
    branches: [main]
    paths:
      - "assets/ecosystem-node-gateway-binding.js"
      - "assets/conectrr-interop.js"
      - "ecosystem-chat.html"
      - "data/development-tasks/canonical-gateway-activation.json"
      - "scripts/observe_and_complete_canonical_gateway_tasks.py"
      - ".github/workflows/observe-complete-canonical-gateway-tasks.yml"

permissions:
  contents: read

jobs:
  observe-and-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derive task state from repository evidence
        run: python scripts/observe_and_complete_canonical_gateway_tasks.py
      - name: Upload canonical gateway task receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-gateway-task-status
          path: reports/canonical-gateway-task-status.json
          if-no-files-found: error
          retention-days: 30
