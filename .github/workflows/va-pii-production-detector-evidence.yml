name: VA PII production detector evidence

on:
  push:
    paths:
      - 'data/va-claim-assistant/pii-production-detector-evidence.json'
      - 'data/va-claim-assistant/pii-production-detector-evidence.schema.json'
      - 'scripts/observe_va_pii_production_detector_evidence.py'
      - '.github/workflows/va-pii-production-detector-evidence.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-pii-production-detector-evidence
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe evidence
        run: python scripts/observe_va_pii_production_detector_evidence.py
      - name: Retain receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/va-claim-assistant/pii-production-detector-readiness.json
          git diff --cached --quiet || git commit -m 'chore(va): retain production PII detector readiness [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: va-pii-production-detector-readiness
          path: |
            data/va-claim-assistant/pii-production-detector-readiness.json
            data/va-claim-assistant/pii-production-detector-evidence.schema.json
          retention-days: 90
