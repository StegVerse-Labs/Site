name: HIL Validation and Live Readiness - No Non-TV/TVC Credential Authority

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment.js'
      - 'assets/hil-experiment-v1.1.js'
      - 'data/hil-first-release-readiness.json'
      - 'data/hil-responses.json'
      - 'data/hil-traces/**'
      - 'data/hil-full-cycle-artifact-verifications/**'
      - 'data/hil-https-receiver-probes/**'
      - 'data/hil-master-records.json'
      - 'data/hil-master-record-releases/**'
      - 'data/hil-linkedin-launch-readiness.json'
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'docs/HIL_LINKEDIN_LAUNCH_CHECKLIST.md'
      - 'schemas/hil_full_cycle_artifact_verification_import.schema.json'
      - 'schemas/hil_https_receiver_probe_import.schema.json'
      - 'schemas/hil_master_record_release.schema.json'
      - 'scripts/check_hil_first_release_readiness.py'
      - 'scripts/check_hil_live_readiness.py'
      - 'scripts/check_hil_full_cycle_artifact_verification_import.py'
      - 'scripts/check_hil_https_receiver_probe_import.py'
      - 'scripts/check_hil_master_record_release.py'
      - 'scripts/check_hil_linkedin_launch_readiness.py'
      - '.github/workflows/check-hil-live-readiness.yml'
  pull_request:
    paths:
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment-v1.1.js'
      - 'data/hil-first-release-readiness.json'
      - 'data/hil-full-cycle-artifact-verifications/**'
      - 'data/hil-https-receiver-probes/**'
      - 'data/hil-master-records.json'
      - 'data/hil-master-record-releases/**'
      - 'data/hil-linkedin-launch-readiness.json'
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'docs/HIL_LINKEDIN_LAUNCH_CHECKLIST.md'
      - 'schemas/hil_full_cycle_artifact_verification_import.schema.json'
      - 'schemas/hil_https_receiver_probe_import.schema.json'
      - 'schemas/hil_master_record_release.schema.json'
      - 'scripts/check_hil_first_release_readiness.py'
      - 'scripts/check_hil_live_readiness.py'
      - 'scripts/check_hil_full_cycle_artifact_verification_import.py'
      - 'scripts/check_hil_https_receiver_probe_import.py'
      - 'scripts/check_hil_master_record_release.py'
      - 'scripts/check_hil_linkedin_launch_readiness.py'
      - '.github/workflows/check-hil-live-readiness.yml'

permissions: {}

concurrency:
  group: hil-validation-live-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert credential-clean validation environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HIL_REGISTRY_DATABASE_ID STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'credential_authority=TV/TVC'
          echo 'consumer_credential_present=false'

      - name: Anonymous public repository fetch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python
        run: python3 --version

      - name: Validate fail-closed HIL first-release state
        run: python3 scripts/check_hil_first_release_readiness.py

      - name: Validate governed full-cycle artifact verification imports
        run: python3 scripts/check_hil_full_cycle_artifact_verification_import.py

      - name: Validate governed HTTPS receiver probe imports
        run: python3 scripts/check_hil_https_receiver_probe_import.py

      - name: Validate Site-side HIL Master Record release-chain projection
        run: python3 scripts/check_hil_master_record_release.py

      - name: Validate HIL v1.1 LinkedIn launch boundary
        run: python3 scripts/check_hil_linkedin_launch_readiness.py

      - name: Observe deployed HIL Site, artifact, intake, review, and publication surfaces
        if: github.event_name != 'pull_request'
        id: observe
        continue-on-error: true
        run: python3 scripts/check_hil_live_readiness.py --output reports/hil-live-readiness.latest.json

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          echo '## HIL validation and live-readiness observation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Credential authority remains TV/TVC. This workflow consumes no project/provider secret or token and grants no activation, publication, execution, release, Master Record, review, or wallet authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Import, Site-side Master Record release-chain projection, and LinkedIn launch-boundary validators are consolidated here without separate token-backed workflow entry surfaces.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/hil-live-readiness.latest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/hil-live-readiness.latest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live observation is intentionally omitted for pull requests, or observation JSON was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce approved deployed Site surface
        if: github.event_name != 'pull_request' && steps.observe.outcome == 'failure'
        run: |
          echo 'The deployed approved HIL Site surface was not observed.' >&2
          exit 1
