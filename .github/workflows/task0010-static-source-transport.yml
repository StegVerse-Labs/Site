name: TASK-0010 Static Source Transport - Evidence Only

on:
  push:
    branches:
      - claim/current-iphone-testflight-static-bootstrap-r1
    paths:
      - data/tasks/SITE-CURRENT-IPHONE-TESTFLIGHT-STATIC-BOOTSTRAP.json

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claim/current-iphone-testflight-static-bootstrap-r1
          fetch-depth: 1

      - name: Materialize exact pinned StegOS source
        shell: bash
        run: |
          set -euo pipefail
          SRC_COMMIT=57f32a9e8b9dfbc70e66e0df3cb7de419fc0701b
          BASE="https://raw.githubusercontent.com/StegVerse-Labs/StegOS/${SRC_COMMIT}/mobile/web-bootstrap"
          mkdir -p stegos-bootstrap contracts
          fetch_exact() {
            local src="$1" dst="$2" git_blob="$3"
            curl -fsSL --retry 3 --retry-delay 1 "${BASE}/${src}" -o "${dst}"
            test "$(git hash-object "${dst}")" = "${git_blob}"
          }
          fetch_exact current-iphone-testflight.html stegos-bootstrap/current-iphone-testflight.html df71b7f121b67ea0c1e5bea9739a6b7bbe8a7ca8
          fetch_exact current-iphone-testflight-bootstrap.js stegos-bootstrap/current-iphone-testflight-bootstrap.js dec46acf94a3ed52f2b1d1ff2c9dc20de7b2f0cb
          fetch_exact current-iphone-unsigned-ipa-materializer.js stegos-bootstrap/current-iphone-unsigned-ipa-materializer.js 0482cba626f17be522401c244091fb5cf30e1cd2
          fetch_exact StegOSMobile-unsigned-device.ipa stegos-bootstrap/StegOSMobile-unsigned-device.ipa 3183c95dbcd73ab7d86acad9b68aef41ea1110b0
          fetch_exact StegOSMobile-unsigned-device-manifest.json stegos-bootstrap/StegOSMobile-unsigned-device-manifest.json cb057f1d95dbde4d070440e2614ecdfdc4308dff
          fetch_exact StegOSMobile.signing-requirements.json stegos-bootstrap/StegOSMobile.signing-requirements.json 556f9d21bbf12dfda25ecb041f08da01abd16766
          fetch_exact current-iphone-wasm-materializer.js stegos-bootstrap/current-iphone-wasm-materializer.js d0b3f2f26abe40e43d16d72c32667a09dcd3d9e5
          fetch_exact stegos_current_iphone_ipa_signer.js stegos-bootstrap/stegos_current_iphone_ipa_signer.js 4a44ef69ac3e61b9c353d439b4781bec3811f63e
          fetch_exact stegos_current_iphone_ipa_signer_bg.wasm stegos-bootstrap/stegos_current_iphone_ipa_signer_bg.wasm 74d9ece3a911c20ce9f89e879c91e027fab10c12
          fetch_exact current-iphone-wasm-signing-engine.js stegos-bootstrap/current-iphone-wasm-signing-engine.js 5439490fcdc7118f4e3a010a8b9f317c8704a659
          fetch_exact current-iphone-ipa-signing-executor.js stegos-bootstrap/current-iphone-ipa-signing-executor.js ec66fee7d835351a065c133e798807d531de986d
          fetch_exact current-iphone-tvc-provider-client.js stegos-bootstrap/current-iphone-tvc-provider-client.js 6e40dc25158a5e2696c67ab5f6bc23c8fe686735
          fetch_exact current-iphone-testflight-signing-action.js stegos-bootstrap/current-iphone-testflight-signing-action.js d3845ac469d6cc9a3d762882c2cbd0cc6b6886ac
          fetch_exact current-iphone-ipa-signing-executor.v1.json contracts/current-iphone-ipa-signing-executor.v1.json 944d607332ff70eb4fcba1d89f36167b016d2d08
          test "$(sha256sum stegos-bootstrap/StegOSMobile-unsigned-device.ipa | awk '{print $1}')" = "557d559082bdefca5fcc69c86f342d8cc035c2d803d154de5ed45b5677f80c35"
          test "$(stat -c %s stegos-bootstrap/StegOSMobile-unsigned-device.ipa)" = "389564"
          test "$(sha256sum stegos-bootstrap/stegos_current_iphone_ipa_signer_bg.wasm | awk '{print $1}')" = "699dc3054788d779ba7920e332c661ef7eac001156f93ab7b1fe1b64ee5a4b93"
          test "$(stat -c %s stegos-bootstrap/stegos_current_iphone_ipa_signer_bg.wasm)" = "2277815"
          test "$(sha256sum stegos-bootstrap/stegos_current_iphone_ipa_signer.js | awk '{print $1}')" = "17fe61cfdae43cbe5a1d1b211beb39838f58e982efdba90c7156fc36402f3adb"

      - name: Commit transported source bytes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stegverse-source-transport[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add \
            stegos-bootstrap/current-iphone-testflight.html \
            stegos-bootstrap/current-iphone-testflight-bootstrap.js \
            stegos-bootstrap/current-iphone-unsigned-ipa-materializer.js \
            stegos-bootstrap/StegOSMobile-unsigned-device.ipa \
            stegos-bootstrap/StegOSMobile-unsigned-device-manifest.json \
            stegos-bootstrap/StegOSMobile.signing-requirements.json \
            stegos-bootstrap/current-iphone-wasm-materializer.js \
            stegos-bootstrap/stegos_current_iphone_ipa_signer.js \
            stegos-bootstrap/stegos_current_iphone_ipa_signer_bg.wasm \
            stegos-bootstrap/current-iphone-wasm-signing-engine.js \
            stegos-bootstrap/current-iphone-ipa-signing-executor.js \
            stegos-bootstrap/current-iphone-tvc-provider-client.js \
            stegos-bootstrap/current-iphone-testflight-signing-action.js \
            contracts/current-iphone-ipa-signing-executor.v1.json
          if git diff --cached --quiet; then
            echo "Exact source already materialized"
            exit 0
          fi
          git commit -m "transport: materialize exact TASK-2026-0010 StegOS source [skip ci]"
          git push origin HEAD:claim/current-iphone-testflight-static-bootstrap-r1
