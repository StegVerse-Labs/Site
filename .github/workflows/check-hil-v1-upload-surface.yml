name: Check HIL v1 Upload Surface

on:
  pull_request:
    paths:
      - "humans-as-interoperability-layer.html"
      - "assets/hil-experiment-v1.js"
      - "data/hil-experiment.json"
      - "data/hil-gateway-config.json"
      - "data/hil-primary-v1.0.pdf.b64"
      - "scripts/check_hil_v1_upload_surface.py"
      - ".github/workflows/check-hil-v1-upload-surface.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse credential-bearing environment
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN CLOUDFLARE_API_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'HIL_V1_UPLOAD_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'HIL_V1_UPLOAD_GITHUB_TOKEN_AUTHORITY=NONE'
      - name: Fetch exact Site source anonymously
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Verify preinstalled Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('HIL_V1_UPLOAD_PYTHON=PASS')
          PY
      - name: Verify canonical HIL v1 upload compatibility surface
        run: python3 scripts/check_hil_v1_upload_surface.py
