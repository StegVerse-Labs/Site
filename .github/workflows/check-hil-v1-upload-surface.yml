name: Check HIL v1 Upload Surface

on:
  push:
    paths:
      - "humans-as-interoperability-layer.html"
      - "assets/hil-experiment-v1.js"
      - "data/hil-experiment.json"
      - "data/hil-gateway-config.json"
      - "data/hil-primary-v1.0.pdf.b64"
      - "scripts/check_hil_v1_upload_surface.py"
      - ".github/workflows/check-hil-v1-upload-surface.yml"
  pull_request:
    paths:
      - "humans-as-interoperability-layer.html"
      - "assets/hil-experiment-v1.js"
      - "data/hil-experiment.json"
      - "data/hil-gateway-config.json"
      - "data/hil-primary-v1.0.pdf.b64"
      - "scripts/check_hil_v1_upload_surface.py"
      - ".github/workflows/check-hil-v1-upload-surface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical HIL v1 upload surface
        run: python scripts/check_hil_v1_upload_surface.py
