name: Install HIL Primary v0.5

on:
  push:
    paths:
      - 'data/.hil-primary-v0.5.parts/**'
      - '.github/workflows/install-hil-primary-v0.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete staged artifact
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for n in 00 01 02 03 04 05 06 07; do
            if [[ ! -f "data/.hil-primary-v0.5.parts/part-${n}.txt" ]]; then
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Artifact parts are not complete yet; no mutation performed."
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble and verify exact artifact
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat data/.hil-primary-v0.5.parts/part-{00..07}.txt > /tmp/hil-primary-v0.5-review.pdf.b64
          python scripts/install_hil_primary.py /tmp/hil-primary-v0.5-review.pdf.b64
          python scripts/check_hil_experiment.py
      - name: Commit verified installation
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/.hil-primary-v0.5.parts
          git config user.name "stegverse-governed-installer"
          git config user.email "actions@users.noreply.github.com"
          git add data/hil-primary-v0.5-review.pdf.b64 data/hil-experiment.json data/hil-primary-v0.5-installation-receipt.json data/.hil-primary-v0.5.parts
          if git diff --cached --quiet; then
            echo "No installation changes to commit."
            exit 0
          fi
          git commit -m "Install verified HIL Primary v0.5 artifact"
          git push
