name: Conectrr Live Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  workflow_run:
    workflows:
      - Site Task Runner
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-conectrr-publication:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deployed Conectrr assets
        run: |
          for attempt in $(seq 1 12); do
            if python scripts/check_conectrr_live_routes.py; then
              exit 0
            fi
            echo "Conectrr deployed publication verification attempt ${attempt}/12 did not pass; waiting for Pages propagation."
            sleep 10
          done
          exit 1

      - name: Install remote-browser verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Execute deployed Conectrr runtime in Chromium
        env:
          STEGVERSE_PAGES_BASE_URL: https://stegverse-labs.github.io/Site
        run: python scripts/check_conectrr_remote_browser.py

      - name: Upload Conectrr live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conectrr-live-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/conectrr-live-verification.json
            reports/conectrr-remote-browser-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Write verification summary
        if: always()
        run: |
          echo "## Conectrr Live Verification" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/conectrr-live-verification.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('reports/conectrr-live-verification.json').read_text())
          print(f"Public assets present: {report.get('passed')}")
          print(f"Runtime observation contract published: {report['claims'].get('runtime_observation_contract_published')}")
          print(f"Authority effect: {report['claims'].get('authority_effect')}")
          PY
          fi
          if [ -f reports/conectrr-remote-browser-verification.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('reports/conectrr-remote-browser-verification.json').read_text())
          print(f"Remote browser execution observed: {report.get('passed')}")
          print(f"Markers: {report.get('markers')}")
          print(f"Correlation: {report.get('correlation')}")
          print(f"Authority effect: {report.get('authority_effect')}")
          PY
          fi
          echo "Boundary: browser fixture execution proves deployed runtime behavior only; it does not create live external interoperability, custody, admissibility, certification, or authority." >> "$GITHUB_STEP_SUMMARY"
