name: Validate Governance Observatory Status

on:
  push:
    branches: [main]
    paths:
      - governance-observatory.html
      - docs/SITE_GOVERNANCE_OBSERVATORY_STATUS.md
      - docs/SITE_GOVERNANCE_OBSERVATORY_STATUS.json
      - docs/SITE_PUBLIC_PATHS.md
      - scripts/check_site_governance_observatory_status.py
      - scripts/check_site_governance_observatory_public.py
      - .github/workflows/validate-governance-observatory-status.yml
  pull_request:
    paths:
      - governance-observatory.html
      - docs/SITE_GOVERNANCE_OBSERVATORY_STATUS.md
      - docs/SITE_GOVERNANCE_OBSERVATORY_STATUS.json
      - docs/SITE_PUBLIC_PATHS.md
      - scripts/check_site_governance_observatory_status.py
      - scripts/check_site_governance_observatory_public.py
      - .github/workflows/validate-governance-observatory-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Site Governance Observatory mirror
        run: python scripts/check_site_governance_observatory_status.py

      - name: Verify deployed Governance Observatory v0.1.0 mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in $(seq 1 12); do
            echo "Public verification attempt $attempt/12"
            if python scripts/check_site_governance_observatory_public.py; then
              exit 0
            fi
            sleep 15
          done
          echo "Public mirror did not converge to v0.1.0 content within bounded retries."
          exit 1

      - name: Upload public observation report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: governance-observatory-v0.1.0-public-observation
          path: reports/governance-observatory-v0.1.0-public-observation.json
          if-no-files-found: warn
