name: Check bounded user-LLM capability imports

on:
  push:
    paths:
      - "schemas/user_llm_bounded_capability_import.schema.json"
      - "scripts/check_user_llm_bounded_capability_import.py"
      - "data/user-llm-bounded-capabilities/**"
      - ".github/workflows/check-user-llm-bounded-capability-import.yml"
  pull_request:
    paths:
      - "schemas/user_llm_bounded_capability_import.schema.json"
      - "scripts/check_user_llm_bounded_capability_import.py"
      - "data/user-llm-bounded-capabilities/**"
      - ".github/workflows/check-user-llm-bounded-capability-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded capability declarations
        run: python scripts/check_user_llm_bounded_capability_import.py
