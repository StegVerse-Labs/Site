name: Import HIL Process Cycle Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Repository path to HIL process-cycle evidence JSON
        required: true
        type: string
      apply:
        description: Append the validated promoted observation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate evidence
        run: python scripts/import_hil_process_cycle_evidence.py "${{ inputs.evidence_path }}"
      - name: Apply append-only observation
        if: ${{ inputs.apply }}
        run: python scripts/import_hil_process_cycle_evidence.py "${{ inputs.evidence_path }}" --apply
      - name: Commit promoted observation
        if: ${{ inputs.apply }}
        run: |
          git config user.name "stegverse-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/hil-process-cycle-observations/
          git diff --cached --quiet && exit 0
          git commit -m "Import governed HIL process-cycle observation"
          git push
