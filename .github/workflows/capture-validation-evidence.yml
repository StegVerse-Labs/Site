name: Capture Validation Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'validation_manifests/repository-core.json'
      - 'schemas/validation-execution-receipt.schema.json'
      - 'scripts/capture_validation_manifest.py'
      - 'scripts/write_site_current_main_validation_receipt.py'
      - 'scripts/check_site_current_main_validation_receipt_writer.py'
      - 'scripts/check_site_current_main_validation_evidence.py'
      - 'data/tasks/SITE-ST018-VALIDATION-EVIDENCE.json'
      - '.github/workflows/capture-validation-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'validation_manifests/repository-core.json'
      - 'schemas/validation-execution-receipt.schema.json'
      - 'scripts/capture_validation_manifest.py'
      - 'scripts/write_site_current_main_validation_receipt.py'
      - 'scripts/check_site_current_main_validation_receipt_writer.py'
      - 'scripts/check_site_current_main_validation_evidence.py'
      - 'data/tasks/SITE-ST018-VALIDATION-EVIDENCE.json'
      - '.github/workflows/capture-validation-evidence.yml'

permissions:
  contents: read
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --upgrade jsonschema

      - name: Execute declared validators and write receipt
        id: capture
        continue-on-error: true
        run: python scripts/capture_validation_manifest.py

      - name: Upload ST-018 validation evidence before enforcement
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-st018-validation-evidence
          path: |
            validation_manifests/repository-core.json
            schemas/validation-execution-receipt.schema.json
            reports/validation-execution-receipt.json
            reports/site-current-main-validation-evidence.log
          if-no-files-found: error
          retention-days: 90

      - name: Write native-main custody receipt
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          receipt = f'''## Site ST-018 native-main custody receipt

- repository: `StegVerse-Labs/Site`
- workflow: `.github/workflows/capture-validation-evidence.yml`
- commit: `{os.environ['HEAD_SHA']}`
- run_id: `{os.environ['RUN_ID']}`
- run_attempt: `{os.environ['RUN_ATTEMPT']}`
- capture outcome: `{os.environ['CAPTURE_OUTCOME']}`
- artifact id: `{os.environ['ARTIFACT_ID']}`
- artifact digest: `{os.environ['ARTIFACT_DIGEST']}`
- artifact url: `{os.environ['ARTIFACT_URL']}`

Exact evidence paths:
- `validation_manifests/repository-core.json`
- `schemas/validation-execution-receipt.schema.json`
- `reports/validation-execution-receipt.json`
- `reports/site-current-main-validation-evidence.log`

Authority remains false. This receipt records validation execution custody only.
'''
          Path('reports/st018-native-main-custody.receipt.md').write_text(receipt, encoding='utf-8')
          PY

      - name: Upload native-main custody receipt
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-st018-native-main-custody
          path: reports/st018-native-main-custody.receipt.md
          if-no-files-found: error
          retention-days: 90

      - name: Publish native-main custody receipt
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 141 --repo StegVerse-Labs/Site --body-file reports/st018-native-main-custody.receipt.md

      - name: Enforce receipt status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/validation-execution-receipt.json')
          if not path.exists():
              raise SystemExit('Missing reports/validation-execution-receipt.json')
          receipt = json.loads(path.read_text())
          if receipt['status'] != 'PASS':
              for item in receipt['validators']:
                  if item['exit_code'] != 0:
                      print(f"failed validator: {item['id']} at {item['log_path']}")
              raise SystemExit('Site ST-018 validation did not pass')
          print('Site ST-018 validation passed')
          PY
