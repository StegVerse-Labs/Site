name: Capture Validation Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'validation_manifests/repository-core.json'
      - 'schemas/validation-execution-receipt.schema.json'
      - 'scripts/capture_validation_manifest.py'
      - 'scripts/write_site_current_main_validation_receipt.py'
      - 'scripts/check_site_current_main_validation_receipt_writer.py'
      - 'scripts/check_site_current_main_validation_evidence.py'
      - 'data/tasks/SITE-ST018-VALIDATION-EVIDENCE.json'
      - 'data/tasks/SITE-ST018-GITHUB-TOKEN-RETIREMENT-20260817.json'
      - 'docs/ST018_VALIDATION_EVIDENCE_MIRROR_HANDOFF.md'
      - '.github/workflows/capture-validation-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'validation_manifests/repository-core.json'
      - 'schemas/validation-execution-receipt.schema.json'
      - 'scripts/capture_validation_manifest.py'
      - 'scripts/write_site_current_main_validation_receipt.py'
      - 'scripts/check_site_current_main_validation_receipt_writer.py'
      - 'scripts/check_site_current_main_validation_evidence.py'
      - 'data/tasks/SITE-ST018-VALIDATION-EVIDENCE.json'
      - 'data/tasks/SITE-ST018-GITHUB-TOKEN-RETIREMENT-20260817.json'
      - 'docs/ST018_VALIDATION_EVIDENCE_MIRROR_HANDOFF.md'
      - '.github/workflows/capture-validation-evidence.yml'

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: StegVerse-Labs/Site
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse credential-bearing validation configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN GITHUB_PAT INPUT_TOKEN; do
            if [[ -n "${!name-}" ]]; then
              echo "Credential-bearing environment is prohibited for ST-018 validation: ${name}" >&2
              exit 1
            fi
          done
          echo 'ST018_CREDENTIAL_REFUSAL=PASS'

      - name: Fetch exact public Site source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          python3 - <<'PY'
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          repo = os.environ['SOURCE_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          url = f"https://codeload.github.com/{repo}/tar.gz/{sha}"
          archive = Path('/tmp/site-source.tar.gz')
          urllib.request.urlretrieve(url, archive)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall('/tmp/site-source')
          roots = [p for p in Path('/tmp/site-source').iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'expected one extracted source root, found {len(roots)}')
          Path('/tmp/site-source-root').write_text(str(roots[0]), encoding='utf-8')
          print(f'ST018_SOURCE_FETCH=PASS sha={sha}')
          PY

      - name: Use preinstalled Python and install public schema validator
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --disable-pip-version-check --no-input jsonschema

      - name: Execute declared validators and write local receipt
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/site-source-root)"
          cd "$ROOT"
          GITHUB_SHA="$SOURCE_SHA" GITHUB_WORKFLOW='Capture Validation Evidence' python3 scripts/capture_validation_manifest.py

      - name: Enforce receipt status without artifact or issue custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/site-source-root)"
          cd "$ROOT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/validation-execution-receipt.json')
          if not path.exists():
              raise SystemExit('Missing reports/validation-execution-receipt.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          if receipt['status'] != 'PASS':
              for item in receipt['validators']:
                  if item['exit_code'] != 0:
                      print(f"failed validator: {item['id']} at {item['log_path']}")
              raise SystemExit('Site ST-018 validation did not pass')
          print('ST018_VALIDATION=PASS')
          print('authority_effect=NONE')
          print('custody_effect=NONE')
          PY
