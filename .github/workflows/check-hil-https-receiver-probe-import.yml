name: Check HIL HTTPS receiver probe imports

on:
  push:
    paths:
      - "schemas/hil_https_receiver_probe_import.schema.json"
      - "scripts/check_hil_https_receiver_probe_import.py"
      - "data/hil-https-receiver-probes/**"
      - ".github/workflows/check-hil-https-receiver-probe-import.yml"
  pull_request:
    paths:
      - "schemas/hil_https_receiver_probe_import.schema.json"
      - "scripts/check_hil_https_receiver_probe_import.py"
      - "data/hil-https-receiver-probes/**"
      - ".github/workflows/check-hil-https-receiver-probe-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governed receiver probe imports
        run: python scripts/check_hil_https_receiver_probe_import.py
