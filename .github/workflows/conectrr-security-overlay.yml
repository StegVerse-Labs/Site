name: Conectrr Security Overlay

on:
  push:
    branches: [main]
    paths:
      - 'docs/CONECTRR_SECURITY_EXCEEDS_FEDERAL_BASELINE.md'
      - 'data/conectrr-security-overlay.json'
      - 'scripts/check_conectrr_security_overlay.py'
      - 'scripts/check_conectrr_runtime_projection.py'
      - 'docs/CONECTRR_INTEROP_MIRROR_HANDOFF.md'
      - '.github/workflows/conectrr-security-overlay.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: conectrr-security-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-security-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: StegVerse-Labs/Site
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Refuse credential-bearing validation configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN GITHUB_PAT INPUT_TOKEN; do
            if [[ -n "${!name-}" ]]; then
              echo "Credential-bearing environment is prohibited for Conectrr security validation: ${name}" >&2
              exit 1
            fi
          done
          echo 'CONECTRR_SECURITY_CREDENTIAL_REFUSAL=PASS'

      - name: Fetch exact public Site source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          python3 - <<'PY'
          import os, tarfile, urllib.request
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          url = f"https://codeload.github.com/{os.environ['SOURCE_REPOSITORY']}/tar.gz/{sha}"
          archive = Path('/tmp/site-source.tar.gz')
          urllib.request.urlretrieve(url, archive)
          root_parent = Path('/tmp/site-source')
          root_parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(root_parent)
          roots = [p for p in root_parent.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'expected one extracted source root, found {len(roots)}')
          Path('/tmp/site-source-root').write_text(str(roots[0]), encoding='utf-8')
          print(f'CONECTRR_SECURITY_SOURCE_FETCH=PASS sha={sha}')
          PY

      - name: Validate security-above-baseline overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/site-source-root)"
          cd "$ROOT"
          python3 scripts/check_conectrr_security_overlay.py

      - name: Validate integrated Conectrr runtime gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/site-source-root)"
          cd "$ROOT"
          python3 scripts/check_conectrr_runtime_projection.py

      - name: Emit ephemeral validation receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/site-source-root)"
          cd "$ROOT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          overlay = Path('data/conectrr-security-overlay.json').read_bytes()
          receipt = {
              'schema': 'stegverse.conectrr.security-overlay.receipt.v1',
              'goal_id': 'SV-SITE-CONECTRR-SEC-001',
              'repository': os.environ.get('SOURCE_REPOSITORY'),
              'commit': os.environ.get('SOURCE_SHA'),
              'overlay_sha256': hashlib.sha256(overlay).hexdigest(),
              'validation_state': 'PASS',
              'persistence': 'EPHEMERAL_ONLY',
              'authority_effect': 'none',
              'claims_not_created': ['certification', 'authorization_to_operate', 'agency_approval'],
          }
          print(json.dumps(receipt, sort_keys=True))
          print('CONECTRR_SECURITY_OVERLAY_VALIDATION=PASS')
          print('repository_writeback_authority=false')
          print('artifact_custody=false')
          print('runtime_authority_effect=false')
          PY
