name: Test HIL HTTPS receiver probe imports

on:
  push:
    paths:
      - "schemas/hil_https_receiver_probe_import.schema.json"
      - "scripts/check_hil_https_receiver_probe_import.py"
      - "tests/test_hil_https_receiver_probe_import.py"
      - ".github/workflows/test-hil-https-receiver-probe-import.yml"
  pull_request:
    paths:
      - "schemas/hil_https_receiver_probe_import.schema.json"
      - "scripts/check_hil_https_receiver_probe_import.py"
      - "tests/test_hil_https_receiver_probe_import.py"
      - ".github/workflows/test-hil-https-receiver-probe-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run governed receiver import regression tests
        run: python -m unittest tests/test_hil_https_receiver_probe_import.py
