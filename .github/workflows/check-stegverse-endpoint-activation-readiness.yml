name: Check StegVerse Endpoint Activation Readiness - Validation Only / No GitHub Token Authority

on:
  push:
    paths:
      - "data/stegverse-endpoint-activation-readiness.json"
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_stegverse_endpoint_activation_readiness.py"
      - ".github/workflows/check-stegverse-endpoint-activation-readiness.yml"
  pull_request:
    paths:
      - "data/stegverse-endpoint-activation-readiness.json"
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_stegverse_endpoint_activation_readiness.py"
      - ".github/workflows/check-stegverse-endpoint-activation-readiness.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'ENDPOINT_READINESS_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'ENDPOINT_READINESS_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=20 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
          echo 'ENDPOINT_READINESS_SOURCE_FETCH=PASS'

      - name: Verify preinstalled Python
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('ENDPOINT_READINESS_PYTHON=PASS')
          PY

      - name: Validate endpoint activation readiness boundary
        run: python3 scripts/check_stegverse_endpoint_activation_readiness.py

      - name: Confirm validation-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/check-stegverse-endpoint-activation-readiness.yml').read_text(encoding='utf-8')
          forbidden = [
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'contents:' + ' read',
              'git ' + 'push',
              'persist-' + 'credentials',
          ]
          assert 'permissions: {}' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('ENDPOINT_READINESS_VALIDATION_ONLY=PASS')
          print('ENDPOINT_READINESS_REPOSITORY_WRITEBACK=NONE')
          print('ENDPOINT_READINESS_ARTIFACT_CUSTODY=NONE')
          print('ENDPOINT_READINESS_RUNTIME_AUTHORITY=NONE')
          print('ENDPOINT_READINESS_ROUTE_AUTHORITY=NONE')
          PY
