name: Check StegVerse Endpoint Activation Readiness

on:
  push:
    paths:
      - "data/stegverse-endpoint-activation-readiness.json"
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_stegverse_endpoint_activation_readiness.py"
      - ".github/workflows/check-stegverse-endpoint-activation-readiness.yml"
  pull_request:
    paths:
      - "data/stegverse-endpoint-activation-readiness.json"
      - "assets/ecosystem-chat-live-binding.js"
      - "scripts/check_stegverse_endpoint_activation_readiness.py"
      - ".github/workflows/check-stegverse-endpoint-activation-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate endpoint activation readiness boundary
        run: python scripts/check_stegverse_endpoint_activation_readiness.py
