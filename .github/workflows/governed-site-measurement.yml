name: Governed Site Measurement

on:
  pull_request:
    paths:
      - 'api/governed-measurement.js'
      - 'assets/governed-site-measurement.js'
      - 'va-disability-claim-guide.html'
      - 'data/governed-site-measurement-policy.json'
      - 'data/tasks/SITE-0001-GOVERNED-MEASUREMENT.json'
      - 'docs/GOVERNED_SITE_MEASUREMENT.md'
      - 'docs/GOVERNED_SITE_MEASUREMENT_MIRROR_HANDOFF.md'
      - 'schemas/governed-site-measurement-event.schema.json'
      - 'scripts/check_governed_site_measurement.py'
      - 'scripts/test_governed_site_measurement_fixtures.py'
      - 'tests/governed-site-measurement/**'
      - '.github/workflows/governed-site-measurement.yml'
  push:
    branches: [main]
    paths:
      - 'api/governed-measurement.js'
      - 'assets/governed-site-measurement.js'
      - 'va-disability-claim-guide.html'
      - 'data/governed-site-measurement-policy.json'
      - 'schemas/governed-site-measurement-event.schema.json'
      - 'scripts/check_governed_site_measurement.py'
      - 'scripts/test_governed_site_measurement_fixtures.py'
      - 'tests/governed-site-measurement/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - name: Validate policy, schema, and task ownership
        run: python scripts/check_governed_site_measurement.py
      - name: Execute positive and adversarial fixtures
        run: python scripts/test_governed_site_measurement_fixtures.py
      - name: Execute collector adversarial tests
        run: node tests/governed-site-measurement/test-collector.js
      - name: Verify browser client and page binding
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('assets/governed-site-measurement.js').read_text()
          page=Path('va-disability-claim-guide.html').read_text()
          prohibited=['localStorage','sessionStorage','document.cookie','user_id','email','diagnosis','filename','question:']
          assert 'content_recorded:false' in source
          assert "credentials:'omit'" in source
          assert "policy_version:'1.0.0'" in source
          assert '<script src="assets/governed-site-measurement.js" defer></script>' in page
          assert page.count('assets/governed-site-measurement.js') == 1
          for term in prohibited:
              assert term not in source, term
          print('GOVERNED_MEASUREMENT_BROWSER_CLIENT_AND_PAGE_BINDING_PASS')
          PY
