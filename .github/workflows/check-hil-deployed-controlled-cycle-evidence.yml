name: Check HIL Deployed Controlled-Cycle Evidence

on:
  push:
    paths:
      - 'data/hil-deployed-controlled-cycle-evidence.json'
      - 'data/hil-activation-state.json'
      - 'docs/HIL_DEPLOYED_CONTROLLED_CYCLE_RUNBOOK.md'
      - 'scripts/check_hil_deployed_controlled_cycle_evidence.py'
      - 'tests/test_hil_deployed_controlled_cycle_evidence.py'
      - '.github/workflows/check-hil-deployed-controlled-cycle-evidence.yml'
  pull_request:
    paths:
      - 'data/hil-deployed-controlled-cycle-evidence.json'
      - 'data/hil-activation-state.json'
      - 'docs/HIL_DEPLOYED_CONTROLLED_CYCLE_RUNBOOK.md'
      - 'scripts/check_hil_deployed_controlled_cycle_evidence.py'
      - 'tests/test_hil_deployed_controlled_cycle_evidence.py'
      - '.github/workflows/check-hil-deployed-controlled-cycle-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate current evidence ledger and runbook
        run: python scripts/check_hil_deployed_controlled_cycle_evidence.py
      - name: Prove fail-closed deployed-cycle behavior
        run: python -m pytest tests/test_hil_deployed_controlled_cycle_evidence.py -v
