name: VA PII Redaction and Credential Realignment Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/va-claim-assistant/pii-redaction-credential-realignment-contract.json'
      - 'data/va-claim-assistant/pii-redaction-credential-realignment-validation.json'
      - 'scripts/validate_va_pii_redaction_credential_realignment.py'
      - '.github/workflows/va-pii-redaction-credential-realignment.yml'

permissions: {}

concurrency:
  group: va-pii-redaction-credential-realignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'VA_PII_REALIGNMENT_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'VA_PII_REALIGNMENT_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Recompute and verify deterministic contract receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_va_pii_redaction_credential_realignment.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('data/va-claim-assistant/pii-redaction-credential-realignment-validation.json').read_text(encoding='utf-8'))
          assert receipt['state'] == 'PASS'
          assert receipt['authority_effect'] is False
          assert receipt['activation_effect'] is False
          print('VA_PII_REALIGNMENT_VALIDATION=PASS')
          print('VA_PII_REALIGNMENT_AUTHORITY_EFFECT=NONE')
          print('VA_PII_REALIGNMENT_ACTIVATION_EFFECT=NONE')
          PY
          git diff --exit-code -- data/va-claim-assistant/pii-redaction-credential-realignment-validation.json

      - name: Confirm validation-only carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/va-pii-redaction-credential-realignment.yml').read_text(encoding='utf-8')
          forbidden = [
              'schedule' + ':',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'git ' + 'push',
          ]
          assert 'permissions: {}' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('VA_PII_REALIGNMENT_HOSTED_SCHEDULE=RETIRED')
          print('VA_PII_REALIGNMENT_REPOSITORY_WRITEBACK=NONE')
          print('VA_PII_REALIGNMENT_ARTIFACT_CUSTODY=NONE')
          print('VA_PII_REALIGNMENT_RUNTIME_AUTHORITY=NONE')
          PY
