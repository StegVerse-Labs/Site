name: VA PII Redaction and Credential Realignment

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/va-claim-assistant/pii-redaction-credential-realignment-contract.json'
      - 'scripts/validate_va_pii_redaction_credential_realignment.py'
      - '.github/workflows/va-pii-redaction-credential-realignment.yml'

permissions:
  contents: write

concurrency:
  group: va-pii-redaction-credential-realignment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate privacy boundary contract
        run: python scripts/validate_va_pii_redaction_credential_realignment.py

      - name: Persist validation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/va-claim-assistant/pii-redaction-credential-realignment-validation.json ]; then
            printf '%s\n' '{"schema_version":"1.0.0","state":"FAILED","errors":["validator did not produce receipt"],"authority_effect":false,"activation_effect":false}' > data/va-claim-assistant/pii-redaction-credential-realignment-validation.json
          fi
          git config user.name 'stegverse-va-privacy-validator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/va-claim-assistant/pii-redaction-credential-realignment-validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(va): record PII realignment validation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-pii-realignment-${{ github.run_id }}
          path: |
            data/va-claim-assistant/pii-redaction-credential-realignment-contract.json
            data/va-claim-assistant/pii-redaction-credential-realignment-validation.json
          retention-days: 90
