name: Observe and complete repository tasks

on:
  push:
    branches: [main]
    paths:
      - 'data/tasks/**'
      - 'data/site-orchestration-state.json'
      - 'data/personal-data-control-runtime.json'
      - 'docs/PERSONAL_DATA_CONTROL_RUNTIME_MIRROR_HANDOFF.md'
      - 'personal-data-control.html'
      - 'scripts/admit_repository_tasks.py'
      - 'scripts/observe_and_complete_repository_tasks.py'
      - 'scripts/check_personal_data_control_runtime.py'
      - 'scripts/check_hil_v1_upload_surface.py'
      - 'scripts/check_hil_v1_1_release.py'
      - 'scripts/verify_hil_site_contract.py'
      - 'humans-as-interoperability-layer.html'
      - 'assets/hil-experiment-v1.js'
      - 'assets/hil-experiment-v1.1.js'
      - 'assets/hil-direct-upload-v1.js'
      - 'data/hil-experiment.json'
      - 'data/hil-gateway-config.json'
      - 'data/hil-primary-v1.0.pdf.b64'
      - 'data/HIL_Canonical_Paper_v1_1.pdf'
      - 'data/steggate-four-app-status.json'
      - 'docs/STEGGATE_FOUR_APP_MIRROR_HANDOFF.md'
      - 'scripts/check_steggate_four_app_status.py'
      - 'scripts/sync_steggate_four_app_handoff.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: repository-task-controller
  cancel-in-progress: false

jobs:
  observe-and-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Admit eligible repository-local tasks
        run: python scripts/admit_repository_tasks.py

      - name: Observe and apply validated task transitions
        run: python scripts/observe_and_complete_repository_tasks.py --apply

      - name: Commit machine-owned state advancement
        run: |
          if git diff --quiet -- data/site-orchestration-state.json repository-task-observation.report.json data/tasks; then
            echo 'No task-state transition required.'
            exit 0
          fi
          git config user.name 'stegverse-task-controller[bot]'
          git config user.email 'stegverse-task-controller[bot]@users.noreply.github.com'
          git add data/site-orchestration-state.json repository-task-observation.report.json data/tasks
          git commit -m 'Advance repository-local task state from verified evidence'
          git push

      - name: Preserve observation report
        uses: actions/upload-artifact@v4
        with:
          name: repository-task-observation
          path: repository-task-observation.report.json

      - name: Fail after preserving durable blockers
        run: python scripts/observe_and_complete_repository_tasks.py --fail-on-blockers
