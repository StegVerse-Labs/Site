name: GP10 workspace security

on:
  push:
    branches: [main]
    paths:
      - 'gp10-workspace.html'
      - 'gp10-workspace-examples.html'
      - 'assets/gp10-*.js'
      - 'scripts/check_gp10_workspace.py'
      - 'scripts/check_gp10_workspace_deployment.py'
      - 'docs/GP10_WORKSPACE_MIRROR_HANDOFF.md'
      - 'docs/GP10_WORKSPACE_SECURITY_BASELINE.md'
      - 'data/operations/gp10_workspace_tasks.json'
      - '.github/workflows/gp10-workspace-security.yml'
  pull_request:
    paths:
      - 'gp10-workspace.html'
      - 'gp10-workspace-examples.html'
      - 'assets/gp10-*.js'
      - 'scripts/check_gp10_workspace.py'
      - 'scripts/check_gp10_workspace_deployment.py'
      - 'docs/GP10_WORKSPACE_MIRROR_HANDOFF.md'
      - 'docs/GP10_WORKSPACE_SECURITY_BASELINE.md'
      - 'data/operations/gp10_workspace_tasks.json'
      - '.github/workflows/gp10-workspace-security.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: StegVerse-Labs/Site
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse credential-bearing GP10 validation configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT INPUT_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN; do
            if [[ -n "${!name-}" ]]; then
              echo "Credential-bearing environment is prohibited for GP10 Site validation: ${name}" >&2
              exit 1
            fi
          done
          echo 'GP10_CREDENTIAL_REFUSAL=PASS'
          echo 'GP10_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'GP10_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact public Site source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          python3 - <<'PY'
          import os, tarfile, urllib.request
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          url = f"https://codeload.github.com/{os.environ['SOURCE_REPOSITORY']}/tar.gz/{sha}"
          archive = Path('/tmp/gp10-site-source.tar.gz')
          extract_dir = Path('/tmp/gp10-site-source')
          urllib.request.urlretrieve(url, archive)
          extract_dir.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(extract_dir)
          roots = [p for p in extract_dir.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'expected one extracted source root, found {len(roots)}')
          Path('/tmp/gp10-site-source-root').write_text(str(roots[0]), encoding='utf-8')
          print(f'GP10_SOURCE_FETCH=PASS sha={sha}')
          PY

      - name: Verify preinstalled Python
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('GP10_PYTHON=PASS')
          PY

      - name: Validate GP10 workspace security and isolation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/gp10-site-source-root)"
          cd "$ROOT"
          python3 scripts/check_gp10_workspace.py
          echo 'GP10_STATIC_VALIDATION=PASS'
          echo 'GP10_EXECUTION_AUTHORITY=NONE'
          echo 'GP10_CUSTODY_AUTHORITY=NONE'

      - name: Observe deployed GP10 pages without GitHub custody
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/gp10-site-source-root)"
          cd "$ROOT"
          mkdir -p /tmp/gp10-validation
          python3 scripts/check_gp10_workspace_deployment.py \
            --commit "$SOURCE_SHA" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempts 18 \
            --delay-seconds 20 \
            --output /tmp/gp10-validation/gp10-workspace-deployment-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/gp10-validation/gp10-workspace-deployment-receipt.json').read_text(encoding='utf-8'))
          if receipt.get('result') != 'PASS':
              raise SystemExit('GP10 deployed-page observation did not pass')
          if receipt.get('execution_authority') not in (False, None):
              raise SystemExit('GP10 deployment observation attempted authority escalation')
          print('GP10_DEPLOYMENT_OBSERVATION=PASS')
          print('GP10_RECEIPT_CUSTODY=NONE')
          PY

      - name: Record pull-request deployment boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo 'GP10_DEPLOYMENT_OBSERVATION=BLOCKED_PR_NOT_DEPLOYED_MAIN'
          echo 'GP10_RECEIPT_CUSTODY=NONE'
          echo 'GP10_EXECUTION_AUTHORITY=NONE'

      - name: Confirm validation-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/gp10-site-source-root)"
          cd "$ROOT"
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/gp10-workspace-security.yml').read_text(encoding='utf-8')
          forbidden = [
              'permissions:' + '\n  contents: ' + 'write',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'issues:' + ' write',
              'GH_' + 'TOKEN:',
              '$' + '{{ github.' + 'token }}',
              'git ' + 'push',
              'git ' + 'commit',
          ]
          hits = [marker for marker in forbidden if marker in workflow]
          if hits:
              raise SystemExit(f'forbidden GP10 hosted authority marker(s): {hits}')
          assert 'permissions: {}' in workflow
          assert 'Refuse credential-bearing GP10 validation configuration' in workflow
          print('GP10_VALIDATION_ONLY=PASS')
          print('GP10_REPOSITORY_WRITEBACK=NONE')
          print('GP10_ARTIFACT_CUSTODY=NONE')
          print('GP10_RUNTIME_CONTROL_PLANE_AUTHORITY=NONE')
          PY
