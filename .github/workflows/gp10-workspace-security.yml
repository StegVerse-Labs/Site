name: GP10 workspace security

on:
  push:
    branches: [main]
    paths:
      - 'gp10-workspace.html'
      - 'gp10-workspace-examples.html'
      - 'assets/gp10-*.js'
      - 'scripts/check_gp10_workspace.py'
      - 'scripts/check_gp10_workspace_deployment.py'
      - 'docs/GP10_WORKSPACE_MIRROR_HANDOFF.md'
      - 'docs/GP10_WORKSPACE_SECURITY_BASELINE.md'
      - 'data/operations/gp10_workspace_tasks.json'
      - '.github/workflows/gp10-workspace-security.yml'
  pull_request:
    paths:
      - 'gp10-workspace.html'
      - 'gp10-workspace-examples.html'
      - 'assets/gp10-*.js'
      - 'scripts/check_gp10_workspace.py'
      - 'scripts/check_gp10_workspace_deployment.py'
      - 'docs/GP10_WORKSPACE_MIRROR_HANDOFF.md'
      - 'docs/GP10_WORKSPACE_SECURITY_BASELINE.md'
      - 'data/operations/gp10_workspace_tasks.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GP10 workspace security and isolation
        id: static_validation
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p validation
          {
            echo "receipt_type=GP10_SITE_SECURITY_VALIDATION"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if python3 scripts/check_gp10_workspace.py; then
              echo "result=PASS"
              exit_code=0
            else
              exit_code=$?
              echo "result=FAILED"
              echo "exit_code=${exit_code}"
            fi
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "${exit_code}"
          } | tee validation/gp10-workspace-security-receipt.txt
      - name: Observe deployed GP10 pages
        id: deployment_observation
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python3 scripts/check_gp10_workspace_deployment.py \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempts 18 \
            --delay-seconds 20 \
            --output validation/gp10-workspace-deployment-receipt.json
      - name: Record pull-request deployment boundary
        if: github.event_name == 'pull_request'
        run: |
          cat > validation/gp10-workspace-deployment-receipt.json <<EOF
          {
            "receipt_type": "GP10_SITE_DEPLOYMENT_OBSERVATION",
            "schema_version": "1.0.0",
            "tested_commit": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "result": "BLOCKED",
            "blocker": "Pull-request source is not the deployed main branch.",
            "next_action": "Run deployment observation after merge to main.",
            "execution_authority": false
          }
          EOF
      - name: Persist main-branch receipts
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          receipt_dir="docs/receipts/gp10-site"
          mkdir -p "${receipt_dir}"
          cp validation/gp10-workspace-security-receipt.txt \
            "${receipt_dir}/security-${GITHUB_SHA}.txt"
          if [ -f validation/gp10-workspace-deployment-receipt.json ]; then
            cp validation/gp10-workspace-deployment-receipt.json \
              "${receipt_dir}/deployment-${GITHUB_SHA}.json"
          else
            cat > "${receipt_dir}/deployment-${GITHUB_SHA}.json" <<EOF
          {
            "receipt_type": "GP10_SITE_DEPLOYMENT_OBSERVATION",
            "schema_version": "1.0.0",
            "tested_commit": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "result": "FAILED",
            "blocker": "Deployment observer did not produce a receipt.",
            "next_action": "Inspect the workflow job and retry after correcting the observer failure.",
            "execution_authority": false
          }
          EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${receipt_dir}"
          if git diff --cached --quiet; then
            echo "No new receipt content to commit."
          else
            git commit -m "receipt: preserve GP10 Site validation ${GITHUB_SHA} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload GP10 validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp10-workspace-security-${{ github.sha }}
          path: |
            validation/gp10-workspace-security-receipt.txt
            validation/gp10-workspace-deployment-receipt.json
          if-no-files-found: error
      - name: Enforce validation result
        if: always()
        run: |
          static_outcome='${{ steps.static_validation.outcome }}'
          deployment_outcome='${{ steps.deployment_observation.outcome }}'
          if [ "${static_outcome}" != "success" ]; then
            echo "Static GP10 workspace validation failed."
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${deployment_outcome}" != "success" ]; then
            echo "Hosted GP10 deployment observation failed."
            exit 1
          fi
