name: StegMusic Live Verification

# Bound to a state transition: a completed GitHub Pages deployment. One attempt, no waiting for propagation.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: stegmusic-live-verification
  cancel-in-progress: true

jobs:
  verify-live-music:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify StegMusic public files
        env:
          STEGVERSE_PAGES_BASE_URL: https://stegverse-labs.github.io/Site
        run: |
          if ! python scripts/check_stegmusic_live_routes.py; then
            echo 'FAIL_CLOSED: StegMusic public files do not verify on this Pages deployment; the next completed deployment or a manual dispatch re-attempts.' >&2
            exit 1
          fi

      - name: Upload StegMusic live verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stegmusic-live-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/stegmusic-live-verification.json
          if-no-files-found: error
          retention-days: 30
