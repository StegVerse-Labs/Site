name: Check HIL v1.1 Release

on:
  push:
    paths:
      - "HIL_Canonical_Paper_v1_1.pdf"
      - "data/HIL_Canonical_Paper_v1_1.pdf"
      - "humans-as-interoperability-layer.html"
      - "assets/hil-experiment-v1.1.js"
      - "data/hil-experiment.json"
      - "scripts/check_hil_v1_1_release.py"
      - ".github/workflows/check-hil-v1-1-release.yml"
  pull_request:
    paths:
      - "HIL_Canonical_Paper_v1_1.pdf"
      - "data/HIL_Canonical_Paper_v1_1.pdf"
      - "humans-as-interoperability-layer.html"
      - "assets/hil-experiment-v1.1.js"
      - "data/hil-experiment.json"
      - "scripts/check_hil_v1_1_release.py"
      - ".github/workflows/check-hil-v1-1-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact canonical v1.1 release chain
        run: python scripts/check_hil_v1_1_release.py
