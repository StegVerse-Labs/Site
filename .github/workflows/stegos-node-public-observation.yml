name: StegOS Node Public Observation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'stegos-node/**'
      - 'scripts/check_stegos_node_projection.py'
      - '.github/workflows/stegos-node-public-observation.yml'
      - 'data/session-work-claims.d/site-stegos-node-registration-offline-history-468.json'
      - 'data/session-work-claims.d/site-stegos-node-physical-offline-proof-480.json'
      - 'docs/STEGOS_KV_CAPABILITY_SHELL_SITE_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-stegos-kv-capability-shell-534.json'
      - 'docs/STEGOS_KV_READINESS_BROWSER_STATE_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-stegos-kv-readiness-browser-state-542.json'
      - 'docs/STEGOS_KV_INTR_BROWSER_APPLY_MIRROR_HANDOFF.md'
      - 'docs/STEGOS_KV_INTR_BROWSER_APPLY_RECONCILIATION_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-stegos-kv-intr-browser-apply-549.json'
  push:
    branches: [main]
    paths:
      - 'stegos-node/**'
      - 'scripts/check_stegos_node_projection.py'
      - '.github/workflows/stegos-node-public-observation.yml'
      - 'data/session-work-claims.d/site-stegos-node-physical-offline-proof-480.json'
      - 'docs/STEGOS_KV_CAPABILITY_SHELL_SITE_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-stegos-kv-capability-shell-534.json'
      - 'docs/STEGOS_KV_READINESS_BROWSER_STATE_MIRROR_HANDOFF.md'
      - 'data/session-work-claims.d/site-stegos-kv-readiness-browser-state-542.json'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Site source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate StegOS Node source contract on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/check_stegos_node_projection.py | tee reports/stegos-node-public-observation.txt

      - name: Observe deployed StegOS Node + KV capability-shell contract
        if: github.event_name != 'pull_request' || (github.head_ref == 'validate/stegos-kv-capability-shell-live-534' || github.head_ref == 'validate/stegos-kv-readiness-browser-live-542')
        id: observe
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          for attempt in $(seq 1 12); do
            if python scripts/check_stegos_node_projection.py \
              --live-url https://stegverse.org/stegos-node/ \
              --require-offline-proof | tee reports/stegos-node-public-observation.txt; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Build non-authorizing observation receipt
        if: always()
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          output_path = Path('reports/stegos-node-public-observation.txt')
          output = output_path.read_text(encoding='utf-8') if output_path.exists() else ''
          event = os.environ.get('GITHUB_EVENT_NAME')
          head_ref = os.environ.get('GITHUB_HEAD_REF')
          live_required = event != 'pull_request' or head_ref in {'validate/stegos-kv-capability-shell-live-534', 'validate/stegos-kv-readiness-browser-live-542'}
          source_passed = (
              'STEGOS_NODE_OFFLINE_PROOF_SOURCE_PASS' in output
              and 'STEGOS_NODE_KV_CAPABILITY_SHELL_SOURCE_PASS' in output
              and 'STEGOS_NODE_KV_READINESS_BROWSER_STATE_SOURCE_PASS' in output
              and 'STEGOS_NODE_KV_INTR_BROWSER_APPLY_SOURCE_PASS' in output
          )
          public_passed = (
              'STEGOS_NODE_OFFLINE_PROOF_PUBLIC_OBSERVATION_PASS' in output
              and 'STEGOS_NODE_KV_CAPABILITY_SHELL_PUBLIC_OBSERVATION_PASS' in output
              and 'STEGOS_NODE_KV_READINESS_BROWSER_STATE_PUBLIC_OBSERVATION_PASS' in output
              and 'STEGOS_NODE_KV_INTR_BROWSER_APPLY_PUBLIC_OBSERVATION_PASS' in output
          )
          receipt = {
              'schema': 'stegos.node_public_observation_receipt.v1',
              'url': 'https://stegverse.org/stegos-node/',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'event_name': event,
              'source_validation_passed': source_passed,
              'observation_passed': public_passed,
              'offline_proof_capability_required': live_required,
              'kv_capability_shell_required': True,
              'kv_capability_shell_source_passed': 'STEGOS_NODE_KV_CAPABILITY_SHELL_SOURCE_PASS' in output,
              'kv_capability_shell_public_observation_passed': 'STEGOS_NODE_KV_CAPABILITY_SHELL_PUBLIC_OBSERVATION_PASS' in output,
              'kv_readiness_browser_state_required': True,
              'kv_readiness_browser_state_source_passed': 'STEGOS_NODE_KV_READINESS_BROWSER_STATE_SOURCE_PASS' in output,
              'kv_readiness_browser_state_public_observation_passed': 'STEGOS_NODE_KV_READINESS_BROWSER_STATE_PUBLIC_OBSERVATION_PASS' in output,
              'kv_intr_browser_apply_required': True,
              'kv_intr_browser_apply_source_passed': 'STEGOS_NODE_KV_INTR_BROWSER_APPLY_SOURCE_PASS' in output,
              'kv_intr_browser_apply_public_observation_passed': 'STEGOS_NODE_KV_INTR_BROWSER_APPLY_PUBLIC_OBSERVATION_PASS' in output,
              'observer_output_sha256': hashlib.sha256(output.encode('utf-8')).hexdigest(),
              'authority_effect': 'NONE',
              'physical_node_activation_claimed': False,
              'network_activation_claimed': False,
              'credential_requirement': 'NONE',
          }
          Path('reports/stegos-node-public-observation.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if not source_passed:
              raise SystemExit('StegOS Node offline-proof + KV capability-shell + KV readiness-browser + KV InTr browser-apply source validation did not pass')
          if live_required and not public_passed:
              raise SystemExit('deployed StegOS Node offline-proof + KV capability-shell + KV readiness-browser + KV InTr browser-apply observation did not pass')

      - name: Upload observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stegos-node-public-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/stegos-node-public-observation.txt
            reports/stegos-node-public-observation.json
          if-no-files-found: error
          retention-days: 30
