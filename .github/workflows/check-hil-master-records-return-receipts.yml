name: Check HIL Master Records return receipts

on:
  push:
    paths:
      - data/hil-master-records-return-receipts/**
      - schemas/hil_master_records_return_receipt.schema.json
      - scripts/check_hil_master_records_return_receipts.py
      - .github/workflows/check-hil-master-records-return-receipts.yml
  pull_request:
    paths:
      - data/hil-master-records-return-receipts/**
      - schemas/hil_master_records_return_receipt.schema.json
      - scripts/check_hil_master_records_return_receipts.py
      - .github/workflows/check-hil-master-records-return-receipts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Master Records return receipts
        run: python scripts/check_hil_master_records_return_receipts.py
