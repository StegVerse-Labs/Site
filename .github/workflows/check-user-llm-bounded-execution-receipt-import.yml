name: Check bounded user-LLM execution receipt imports

on:
  push:
    paths:
      - "schemas/user_llm_bounded_execution_receipt_import.schema.json"
      - "scripts/check_user_llm_bounded_execution_receipt_import.py"
      - "data/user-llm-bounded-execution-receipts/**"
      - ".github/workflows/check-user-llm-bounded-execution-receipt-import.yml"
  pull_request:
    paths:
      - "schemas/user_llm_bounded_execution_receipt_import.schema.json"
      - "scripts/check_user_llm_bounded_execution_receipt_import.py"
      - "data/user-llm-bounded-execution-receipts/**"
      - ".github/workflows/check-user-llm-bounded-execution-receipt-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded execution receipt imports
        run: python scripts/check_user_llm_bounded_execution_receipt_import.py
