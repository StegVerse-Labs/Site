name: Site Bootstrap Validate - No Non-TV/TVC Credential Authority

on:
  workflow_dispatch:
  push:
  pull_request:

permissions: {}

concurrency:
  group: site-bootstrap-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'SITE_BOOTSTRAP_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'SITE_BOOTSTRAP_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('SITE_BOOTSTRAP_PYTHON=PASS')
          PY

      - name: Install public validation dependency without credential
        run: python3 -m pip install jsonschema

      - name: Validate HIL pilot ledger, announcement status, and deterministic fixtures
        run: |
          python3 scripts/validate_hil_pilot_ledger.py
          python3 scripts/test_hil_pilot_validation.py
          python3 scripts/derive_hil_announcement_status.py --check
          python3 scripts/test_hil_announcement_status.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          status = json.loads(Path('data/hil-announcement-status.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('data/schemas/hil-announcement-status.schema.json').read_text(encoding='utf-8'))
          errors = sorted(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(status), key=lambda error: list(error.path))
          if errors:
              raise SystemExit('\n'.join(error.message for error in errors))
          print('HIL_ANNOUNCEMENT_STATUS_SCHEMA=PASS')
          PY

      - name: Inventory and validate workflow entry points
        run: |
          python3 scripts/write_site_workflow_inventory.py
          python3 scripts/check_site_workflow_inventory.py

      - name: Validate exclusive claims and Site orchestration
        run: |
          python3 scripts/check_session_work_claims.py
          python3 scripts/site_handoff_orchestrator.py
          python3 scripts/check_ecosystem_heartbeat_orchestration.py

      - name: Validate canonical Site application directly
        run: python scripts/check_ecosystem_chat_application.py

      - name: Execute ST-017 isolated validation without artifact transport
        run: python3 scripts/run_sandbox_validation.py

      - name: Validate StegFin phone projection without wallet authority
        run: python3 scripts/check_stegfin_phone_projection.py

      - name: Confirm validation-only authority boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate.yml').read_text(encoding='utf-8')
          forbidden = [
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'persist-' + 'credentials',
              'git ' + 'push',
              'STEGVERSE_PROVIDER_TOKEN' + ':',
              'STEGVERSE_MASTER_RECORDS_TOKEN' + ':',
              'schedule' + ':',
              'repository:' + ' StegVerse-org/LLM-adapter',
              'pip install -e ' + "'./adapter-source[service]'",
          ]
          assert 'permissions: {}' in workflow
          assert 'Refuse credential-bearing environment' in workflow
          assert 'python scripts/check_ecosystem_chat_application.py' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('SITE_BOOTSTRAP_VALIDATION_ONLY=PASS')
          print('SITE_BOOTSTRAP_RUNTIME_EXECUTION_AUTHORITY=NONE')
          print('SITE_BOOTSTRAP_REPOSITORY_WRITEBACK=NONE')
          print('SITE_BOOTSTRAP_ARTIFACT_TRANSPORT=NONE')
          PY

# Portable-node gateway launch/inference proof is intentionally not performed here.
# That runtime capability is already COMPLETE_RELEASED under the canonical
# StegVerse resident-worker/local-runtime ownership and must not be recreated
# through a GitHub-hosted validation job or a private GitHub dependency fetch.
