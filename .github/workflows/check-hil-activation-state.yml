name: Check HIL Activation State

on:
  push:
    paths:
      - "data/hil-activation-state.json"
      - "data/hil-experiment.json"
      - "data/hil-primary-v0.5-review.pdf.b64"
      - "scripts/check_hil_activation_state.py"
      - ".github/workflows/check-hil-activation-state.yml"
  pull_request:
    paths:
      - "data/hil-activation-state.json"
      - "data/hil-experiment.json"
      - "data/hil-primary-v0.5-review.pdf.b64"
      - "scripts/check_hil_activation_state.py"
      - ".github/workflows/check-hil-activation-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HIL activation state
        run: python scripts/check_hil_activation_state.py
