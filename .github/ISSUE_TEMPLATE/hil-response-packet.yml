name: HIL Response Packet Upload
description: Attach one response PDF and submit it for HIL review.
title: "[HIL RESPONSE PACKET] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Attach the unchanged response PDF below. A display name is optional and defaults to **Anonymous**.

  - type: textarea
    id: attachment
    attributes:
      label: Response PDF
      description: Tap **Attach files**, choose the response PDF, and wait for the filename to appear before submitting.
      placeholder: Attach the response PDF here.
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name
      description: Leave this as Anonymous unless you want a name or pseudonym shown with the response.
      value: Anonymous
      placeholder: Anonymous
    validations:
      required: false

  - type: checkboxes
    id: choices
    attributes:
      label: Confirm
      options:
        - label: Display the name entered above with my response.
          required: false
        - label: I am authorized to submit this response packet.
          required: true
        - label: This is the unchanged response PDF, or I have clearly disclosed any edits in the PDF itself.
          required: true
