<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Simple VA claims help for veterans.">
<title>VA Claims Chat</title>
<link rel="stylesheet" href="sv-shared.css">
<style>
:root{--chat-max:760px}.va-top{border-bottom:1px solid var(--border);background:var(--surface)}.va-top-inner{max-width:var(--chat-max);margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.va-title{font-weight:800;font-size:1.08rem;color:var(--text);text-decoration:none}.va-help{color:var(--muted);font-size:.94rem}.chat-page{max-width:var(--chat-max);margin:0 auto;padding:24px 16px 42px}.intro h1{font-size:clamp(1.7rem,5vw,2.35rem);margin:4px 0 8px}.intro p{color:var(--muted);font-size:1.04rem;line-height:1.55;margin:0 0 18px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 18px}.quick button{min-height:52px;text-align:left;border:1px solid var(--border);border-radius:13px;background:#172033;color:var(--text);padding:12px 14px;font:inherit;font-weight:700}.chat-log{min-height:330px;max-height:55vh;background:#0b1220;border:1px solid var(--border);border-radius:16px;padding:12px;overflow:auto}.msg{padding:12px 14px;border-radius:14px;margin:9px 0;line-height:1.5;white-space:pre-wrap}.bot{background:#172033;margin-right:8%}.user{background:#18365f;margin-left:10%}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0;border-radius:13px;border:1px solid var(--border);background:#0b1220;color:var(--text);padding:14px;font-size:1rem}.composer button{border:0;border-radius:13px;background:#214a7d;color:#fff;padding:0 18px;font-weight:800}.privacy{font-size:.86rem;color:var(--muted);line-height:1.45;margin:10px 2px 0}.stepbox{display:none;margin:12px 0 0;border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface)}.stepbox.active{display:block}.stepbox h2{font-size:1rem;margin:0 0 5px}.stepbox p{margin:0;color:var(--muted);line-height:1.45}.stepbox ul{margin:10px 0 0;padding-left:20px}.stepbox li{margin:6px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){.quick{grid-template-columns:1fr}.chat-page{padding-top:18px}.chat-log{min-height:300px}.composer{align-items:stretch}.composer button{padding:0 15px}}
</style>
</head>
<body>
<header class="va-top"><div class="va-top-inner"><span class="va-title">VA Claims Chat</span><a class="va-help" href="va-disability-claim-guide.html">Claims guide</a></div></header>
<main class="chat-page">
<section class="intro">
<h1>What can I help you with?</h1>
<p>Ask a VA claims question in your own words. If you want, I can also guide you one step at a time.</p>
</section>
<section aria-label="Common starting points" class="quick">
<button type="button" data-prompt="I want to start a VA disability claim. What should I do first?">Start a disability claim</button>
<button type="button" data-prompt="What evidence do I need for my VA disability claim?">What evidence do I need?</button>
<button type="button" data-prompt="Help me get my VA medical records one step at a time.">Get my VA records</button>
<button type="button" data-prompt="I have a VA decision and need help understanding my next options.">Understand a VA decision</button>
</section>
<section class="stepbox" id="stepbox" aria-live="polite"><h2 id="step-title"></h2><p id="step-goal"></p><ul id="step-checks"></ul></section>
<section aria-label="Conversation">
<div class="chat-log" id="log" aria-live="polite"></div>
<div class="composer">
<label class="sr-only" for="question">Ask a VA claims question</label>
<input id="question" type="text" autocomplete="off" placeholder="Ask a VA claims question…">
<button id="send" type="button">Send</button>
</div>
<p class="privacy">For your privacy, don’t enter passwords, security codes, Social Security numbers, or full medical records here.</p>
</section>
</main>
<script>
(()=>{
const cards=[
{title:'Get ready',goal:'Before creating or using your VA.gov sign-in, make sure you have these items.',checks:['An email address you can open now','A smartphone or computer with internet access','A government-issued photo ID'],help:'A driver’s license, state-issued photo ID, or U.S. passport can be used as government photo ID.'},
{title:'Sign in to VA.gov',goal:'Use the official VA.gov sign-in page and sign in with Login.gov or ID.me.',checks:['Choose Login.gov or ID.me','Create or confirm the account if needed','Sign in to VA.gov successfully'],help:'Start at https://www.va.gov/sign-in/. Never share your password or one-time security code.'},
{title:'Open your medical records',goal:'Go to the VA medical-record download page.',checks:['Open the VA medical-record download page'],help:'Use https://www.va.gov/my-health/medical-records/download. In the VA app, open Health, then Medical records.'},
{title:'Download your records',goal:'Download the records you want to keep for your claim.',checks:['Choose the time period you need','Choose the record types you need','Choose PDF or TXT','Download the report'],help:'If you want the broadest record set, choose All time and All record types.'},
{title:'Find the downloaded file',goal:'Make sure you can find the file before moving on.',checks:['Find the downloaded PDF or TXT file on your device'],help:'On iPhone, check the Files app and Downloads. On Android, check Files or Downloads.'},
{title:'Prepare your claim',goal:'Review your evidence and prepare your claim for submission.',checks:['Your claim information is ready','You reviewed the information before submitting'],help:'You keep control of what is claimed and submitted. If filing help is not active here, use the official VA.gov disability claim form.'}
];
const log=document.getElementById('log'),input=document.getElementById('question'),box=document.getElementById('stepbox'),title=document.getElementById('step-title'),goal=document.getElementById('step-goal'),list=document.getElementById('step-checks');let mode='general',card=0,confirmed=[];
function add(who,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}
function render(){const c=cards[card];box.classList.add('active');title.textContent=c.title;goal.textContent=c.goal;list.innerHTML='';c.checks.forEach((x,i)=>{const li=document.createElement('li');li.textContent=(confirmed[i]?'✓ ':'○ ')+x;list.appendChild(li)});localStorage.setItem('vaClaimsChatCard',String(card+1))}
function beginRecords(){mode='guided';card=Math.max(0,Math.min(cards.length-1,(Number(localStorage.getItem('vaClaimsChatCard'))||1)-1));confirmed=cards[card].checks.map(()=>false);render();const c=cards[card];add('bot',c.goal+'\n\n'+c.checks.map(x=>'• '+x).join('\n')+'\n\nTell me what you’ve completed, or tell me where you’re stuck.')}
function guidedAnswer(q){const s=q.toLowerCase(),c=cards[card];if(s.includes('help')||s.includes('stuck')||s.includes('how')||s.includes('why'))return c.help;if(s.includes('all complete')||s.includes('confirm all')||s.includes('finished all')){confirmed=confirmed.map(()=>true);render();if(card<cards.length-1){card++;confirmed=cards[card].checks.map(()=>false);render();return 'Great. Next: '+cards[card].title+'.\n\n'+cards[card].goal+'\n\n'+cards[card].checks.map(x=>'• '+x).join('\n')}return 'You’ve finished these preparation steps. Review everything before you submit your claim.'}let changed=false;c.checks.forEach((x,i)=>{const words=x.toLowerCase().split(/\W+/).filter(w=>w.length>4);if(words.some(w=>s.includes(w))&&(s.includes('yes')||s.includes('done')||s.includes('complete')||s.includes('have')||s.includes('did')||s.includes('found')||s.includes('opened')||s.includes('ready'))){confirmed[i]=true;changed=true}});render();if(changed){const left=c.checks.filter((_,i)=>!confirmed[i]);return left.length?'Got it. You still need:\n'+left.map(x=>'• '+x).join('\n'):'That step looks complete. Say “all complete” when you’re ready for the next step.'}return c.help+'\n\nTell me what you completed or what you need help with.'}
function localAnswer(q){const s=q.toLowerCase();if(s.includes('medical record')||s.includes('blue button')||s.includes('get my va record')){beginRecords();return null}if(s.includes('login.gov'))return 'Login.gov is one sign-in option accepted by VA.gov. Start from the official VA.gov sign-in page: https://www.va.gov/sign-in/';if(s.includes('id.me'))return 'ID.me is another sign-in option accepted by VA.gov. Start from the official VA.gov sign-in page: https://www.va.gov/sign-in/';if(s.includes('start')&&s.includes('claim'))return 'A good first step is to identify the condition you want to claim and gather evidence showing the condition, your service event or exposure, and the connection between them. Tell me what kind of claim you are starting, and I’ll help with the next step.';if(s.includes('evidence'))return 'Evidence can include VA or private medical records, service records, statements from you or people who know what happened, and other records that support the condition and its connection to service. Tell me what condition you are claiming and I can narrow this down.';if(s.includes('decision')||s.includes('appeal')||s.includes('review'))return 'I can help explain the common VA review options, but I need to know what the decision says and when it was issued. Don’t paste sensitive personal identifiers. You can summarize the decision and the reason VA gave.';return 'I can help with starting a disability claim, evidence, VA records, and understanding a VA decision. Ask in your own words, and I’ll help with the next step.'}
async function run(text){const q=(text||input.value).trim();if(!q)return;add('user',q);input.value='';if(mode==='guided'){const a=guidedAnswer(q);if(a)add('bot',a);return}if(window.VAClaimsRuntimeBridge){const r=await window.VAClaimsRuntimeBridge.ask(q);if(r&&r.used){add('bot',r.text);return}}const a=localAnswer(q);if(a)add('bot',a)}
document.getElementById('send').onclick=()=>run();input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.prompt)));add('bot','Hi. Tell me what you need help with, and we’ll take it one step at a time.');
})();
</script>
<script src="assets/va-claims-chat-runtime.js"></script>
</body>
</html>
