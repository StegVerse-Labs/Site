name: Two Entry Points Execution State

on:
  push:
    paths:
      - 'docs/TWO_ENTRY_POINTS_MIRROR_HANDOFF.md'
      - 'data/two-entry-points-execution-state.json'
      - 'scripts/validate_two_entry_points_execution_state.py'
      - '.github/workflows/two-entry-points-execution-state.yml'
  pull_request:
    paths:
      - 'docs/TWO_ENTRY_POINTS_MIRROR_HANDOFF.md'
      - 'data/two-entry-points-execution-state.json'
      - 'scripts/validate_two_entry_points_execution_state.py'
      - '.github/workflows/two-entry-points-execution-state.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: two-entry-points-execution-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'TWO_ENTRY_VALIDATION_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'TWO_ENTRY_VALIDATION_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('TWO_ENTRY_VALIDATION_PYTHON=PASS')
          PY

      - name: Validate execution registry
        run: python3 scripts/validate_two_entry_points_execution_state.py

      - name: Validate receipt hash and authority boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('reports/two-entry-points-execution-state-validation.json')
          value = json.loads(path.read_text())
          assert value['schema'] == 'stegverse.two_entry_points.execution_state_validation.v1'
          assert value['result'] == 'PASS'
          assert value['authority_granted'] is False
          assert value['release_authorized'] is False
          material = dict(value)
          expected = material.pop('receipt_sha256')
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          assert expected == actual
          print(f'TWO_ENTRY_VALIDATION_RECEIPT_SHA256={expected}')
          print('TWO_ENTRY_VALIDATION_AUTHORITY_EFFECT=NONE')
          print('TWO_ENTRY_VALIDATION_RELEASE_AUTHORITY=NONE')
          PY

      - name: Confirm validation-only carrier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/two-entry-points-execution-state.yml').read_text(encoding='utf-8')
          forbidden = [
              'schedule' + ':',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'persist-' + 'credentials',
              'git ' + 'push',
              'permissions:\n  contents: write',
          ]
          assert 'permissions: {}' in workflow
          assert 'workflow_dispatch:' in workflow
          assert 'push:' in workflow
          assert 'pull_request:' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('TWO_ENTRY_VALIDATION_HOSTED_SCHEDULE=RETIRED')
          print('TWO_ENTRY_VALIDATION_REPOSITORY_WRITEBACK=NONE')
          print('TWO_ENTRY_VALIDATION_ARTIFACT_CUSTODY=NONE')
          print('TWO_ENTRY_VALIDATION_RUNTIME_AUTHORITY=NONE')
          PY
