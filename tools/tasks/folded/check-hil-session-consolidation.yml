name: Check HIL Session Consolidation

on:
  # PR validation remains automatic for changes to the canonical HIL
  # consolidation contract. Main-branch push fanout is intentionally omitted:
  # the consolidation handoff is repository-owned and its routine persistence
  # must not create a second hosted validation start after merge.
  pull_request:
    paths:
      - 'data/session-goal-inventories/HIL-RUNTIME-SESSION-2026-08-02.json'
      - 'docs/HIL_SESSION_CONSOLIDATION_MIRROR_HANDOFF.md'
      - 'scripts/check_hil_session_consolidation.py'
      - '.github/workflows/check-hil-session-consolidation.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
      - name: Fetch exact source anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Verify preinstalled Python
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('HIL_SESSION_CONSOLIDATION_PYTHON=PASS')
          PY
      - name: Validate canonical session inventory and handoff
        run: python3 scripts/check_hil_session_consolidation.py
