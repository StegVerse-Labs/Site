name: VA Claim Guide Workers

on:
  push:
    branches: [main]
    paths:
      - 'va-disability-claim-guide.html'
      - 'assets/va-claim-guide/**'
      - 'data/va-claim-assistant/**'
      - 'docs/VA_CLAIM_ASSISTANT_GOVERNED_SESSION.md'
      - 'docs/VA_CLAIM_ASSISTANT_NEXT_EXECUTION_SESSION.md'
      - 'scripts/check_va_claim_guide.py'
      - 'scripts/check_va_claim_assistant_governance.py'
      - '.github/workflows/va-claim-guide-workers.yml'
  pull_request:
    paths:
      - 'va-disability-claim-guide.html'
      - 'assets/va-claim-guide/**'
      - 'data/va-claim-assistant/**'
      - 'docs/VA_CLAIM_ASSISTANT_GOVERNED_SESSION.md'
      - 'docs/VA_CLAIM_ASSISTANT_NEXT_EXECUTION_SESSION.md'
      - 'scripts/check_va_claim_guide.py'
      - 'scripts/check_va_claim_assistant_governance.py'
      - '.github/workflows/va-claim-guide-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate VA claim guide
        run: python scripts/check_va_claim_guide.py
      - name: Validate governed source and answer contracts
        run: python scripts/check_va_claim_assistant_governance.py
      - name: Check internal page references
        run: |
          test -f va-disability-claim-guide.html
          test -f assets/va-claim-guide/01-open-va-app-v2.svg
          test -f assets/va-claim-guide/va-guide-assistant.js
          test -f data/va-claim-assistant/source-registry.json
          test -f data/va-claim-assistant/source-registry.schema.json
          test -f data/va-claim-assistant/answer-record.schema.json
      - name: Publish worker summary
        run: |
          {
            echo '## VA Claim Guide Worker Result'
            echo '- Static guide page: complete and validated'
            echo '- Mobile-safe image: validated'
            echo '- Bounded procedural assistant: available and validated'
            echo '- Governed source registry semantic checks: validated'
            echo '- Governed answer positive fixture: validated'
            echo '- Authority escalation fixture: rejected as required'
            echo '- Unsupported proposition fixture: rejected as required'
            echo '- Source-grounded runtime: building; not activated by these checks'
            echo '- Private document analysis: not active'
            echo '- GOVERNED_CLAIM_SESSION requires deployed retrieval, TVC capability, custody, reconstruction, and end-to-end receipts.'
          } >> "$GITHUB_STEP_SUMMARY"
