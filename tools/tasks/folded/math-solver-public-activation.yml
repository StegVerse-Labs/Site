name: Math Solver public activation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/ecosystem-chat-va-runtime.js"
      - "scripts/advance_math_solver_public_activation.py"
      - "scripts/check_ecosystem_chat_boundary.py"
      - "data/four-app-active-worker-assignments.json"
      - ".github/workflows/math-solver-public-activation.yml"

permissions: {}

concurrency:
  group: math-solver-public-activation-validation
  cancel-in-progress: true

jobs:
  validate-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate canonical Math Solver runtime receipt fail-closed
        run: python scripts/advance_math_solver_public_activation.py
      - name: Validate unified conversational Math boundary
        run: python scripts/check_ecosystem_chat_boundary.py
      - name: Validate four-app status projection locally
        run: python scripts/check_steggate_four_app_status.py
      - name: Prove validation-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/math-solver-public-activation.yml').read_text(encoding='utf-8')
          forbidden = [
              'contents' + ': write',
              'schedule' + ':',
              'git ' + 'push',
              'git ' + 'commit',
              'persist-' + 'credentials: true',
          ]
          assert 'permissions: {}' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('MATH_SOLVER_ACTIVATION_VALIDATION_AUTHORITY=NONE')
          print('MATH_SOLVER_REPOSITORY_MUTATION_AUTHORITY=NONE')
          print('MATH_SOLVER_RUNTIME_AUTHORITY=NONE')
          PY
      - name: Preserve validation observation
        uses: actions/upload-artifact@v4
        with:
          name: math-solver-public-activation-validation
          path: data/math-solver-public-activation.latest.json
          if-no-files-found: error
          retention-days: 30
