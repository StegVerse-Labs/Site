name: HIL Site Contract

on:
  pull_request:
    paths:
      - "assets/hil-experiment-v1.1.js"
      - "data/hil-experiment.json"
      - "data/hil-receiver-config.json"
      - "data/hil-start-announcement-receipt.template.json"
      - "scripts/verify_hil_site_contract.py"
      - "scripts/verify_hil_readiness_record.py"
      - "scripts/verify_hil_controlled_cycle.py"
      - "scripts/verify_hil_restart_persistence.py"
      - "tests/fixtures/hil-readiness-ready-v1.1.json"
      - "tests/test_verify_hil_controlled_cycle.py"
      - "tests/test_verify_hil_restart_persistence.py"
      - ".github/workflows/hil-site-contract.yml"
      - ".github/workflows/hil-restart-persistence.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
      - name: Fetch exact Site source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Verify preinstalled Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          PY
      - name: Verify fail-closed HIL v1.1 Site contract
        run: python3 scripts/verify_hil_site_contract.py
      - name: Verify conforming HIL readiness fixture
        run: python3 scripts/verify_hil_readiness_record.py tests/fixtures/hil-readiness-ready-v1.1.json
      - name: Verify controlled-cycle evidence gate
        run: python3 tests/test_verify_hil_controlled_cycle.py
      - name: Verify restart-persistence evidence gate
        run: python3 tests/test_verify_hil_restart_persistence.py
