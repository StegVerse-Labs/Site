name: Validate HIL lifecycle projection

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validate_hil_lifecycle_projection.py'
      - 'tests/fixtures/hil-site-lifecycle-projection*.json'
      - '.github/workflows/validate-hil-lifecycle-projection.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract-test projection
        run: |
          python scripts/validate_hil_lifecycle_projection.py \
            tests/fixtures/hil-site-lifecycle-projection.contract-test.json \
            --expected-response-sha256 1442c8407e6de8c66d1aa6d5180779a4c58cb449a46338bc9dae07e5ddf99285 \
            | tee hil-site-projection-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: hil-site-projection-validation
          path: hil-site-projection-validation.json
