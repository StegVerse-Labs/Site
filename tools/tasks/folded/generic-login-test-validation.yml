name: Generic Login Test Validation

on:
  pull_request:
    paths:
      - generic-login-test.html
      - create-account-test.html
      - forgot-password-test.html
      - assets/kv-ui/intr-auth-client.js
      - assets/kv-ui/intr-kv-client.js
      - scripts/validate_generic_login_test.py
      - docs/GENERIC_LOGIN_TEST_MIRROR_HANDOFF.md
      - data/session-work-claims.d/site-generic-login-verification-491.json
      - .github/workflows/generic-login-test-validation.yml
  push:
    branches: [main]
    paths:
      - generic-login-test.html
      - assets/kv-ui/intr-kv-client.js
      - scripts/validate_generic_login_test.py
      - docs/GENERIC_LOGIN_TEST_MIRROR_HANDOFF.md
      - data/session-work-claims.d/site-generic-login-verification-491.json
      - .github/workflows/generic-login-test-validation.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate collision-free Site claim registry
        run: python scripts/check_session_work_claims.py

      - name: Validate InTr assertion and KV projection lifecycle
        run: python scripts/validate_generic_login_test.py

      - name: Assert bounded authority separation
        run: |
          python - <<'PY'
          from pathlib import Path
          login = Path('generic-login-test.html').read_text(encoding='utf-8')
          intr = Path('assets/kv-ui/intr-auth-client.js').read_text(encoding='utf-8')
          kv_intr = Path('assets/kv-ui/intr-kv-client.js').read_text(encoding='utf-8')
          create = Path('create-account-test.html').read_text(encoding='utf-8')
          forgot = Path('forgot-password-test.html').read_text(encoding='utf-8')
          combined = login + intr + kv_intr + create + forgot
          assert 'Successful Login' in login
          assert 'KnowledgeVault directory projection' in login
          assert 'KnowledgeVault Status' in login
          assert 'Create My KnowledgeVault' in login
          assert 'Attach Existing KnowledgeVault' in login
          assert 'Install on This Device' in login
          assert 'stegverse.intr.kv-onboarding-transition/v1' in login
          assert 'production_kv_custody:false' in login
          assert "authority_effect:'NONE'" in login
          assert '_Vault/SKAP' in login
          assert 'SKAP Step-up Validation' in login
          assert 'stegverse.intr.identity-assertion/v1' in intr
          assert 'stegverse.intr.step-up-assertion/v1' in intr
          assert 'kv.interlock.request.v1' in kv_intr
          assert 'kv.interlock.response.v1' in kv_intr
          assert 'COMMIT_CANDIDATE' in kv_intr
          assert 'candidate_only:true' in kv_intr
          assert 'canonical_state_changed:false' in kv_intr
          assert 'SCOPE_EXPANSION_REJECTED' in kv_intr
          assert 'AUTHORITY_BINDING_REJECTED' in kv_intr
          assert 'assets/kv-ui/intr-kv-client.js' in login
          assert 'credential_disclosed: false' in intr
          assert 'raw_secret_present: false' in intr
          assert 'INTR_NOT_PROVISIONED' in intr
          assert 'TEST_ONLY' in create and 'TEST_ONLY' in forgot
          assert 'TVC_EPHEMERAL_GITHUB_TOKEN' not in combined
          assert 'GITHUB_TOKEN' not in combined
          assert 'document.cookie' not in combined
          print('GENERIC_INTR_KV_AUTHORITY_BOUNDARY_PASS')
          PY


      - name: Observe deployed KV Interlock adapter posture
        if: github.event_name != 'pull_request'
        shell: python
        run: |
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          targets = {
              "page": "https://stegverse.org/generic-login-test.html",
              "kv_client": "https://stegverse.org/assets/kv-ui/intr-kv-client.js",
          }
          markers = {
              "page": [
                  "Create My KnowledgeVault",
                  "Attach Existing KnowledgeVault",
                  "Install on This Device",
                  "assets/kv-ui/intr-kv-client.js",
                  "stegverse.intr.kv-onboarding-transition/v1",
                  "production_kv_custody:false",
              ],
              "kv_client": [
                  "kv.interlock.request.v1",
                  "kv.interlock.response.v1",
                  "COMMIT_CANDIDATE",
                  "KV_INTR_NOT_PROVISIONED",
                  "candidate_only:true",
                  "canonical_state_changed:false",
                  "SCOPE_EXPANSION_REJECTED",
                  "AUTHORITY_BINDING_REJECTED",
              ],
          }

          def fetch_exact(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "StegVerse-Site-Public-Observer/1.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  final = urlparse(response.geturl())
                  expected = urlparse(url)
                  if final.scheme != "https" or final.hostname != expected.hostname or final.path != expected.path:
                      raise RuntimeError(f"unexpected final URL for {url}: {response.geturl()}")
                  if response.status != 200:
                      raise RuntimeError(f"unexpected HTTP status for {url}: {response.status}")
                  return response.read().decode("utf-8")

          last_error = None
          bodies = None
          for attempt in range(1, 13):
              try:
                  candidate = {name: fetch_exact(url) for name, url in targets.items()}
                  missing = {
                      name: [marker for marker in markers[name] if marker not in candidate[name]]
                      for name in targets
                  }
                  missing = {name: value for name, value in missing.items() if value}
                  if missing:
                      raise RuntimeError(f"public marker mismatch: {missing}")
                  bodies = candidate
                  break
              except Exception as exc:
                  last_error = str(exc)
                  if attempt < 12:
                      time.sleep(10)

          if bodies is None:
              raise SystemExit(f"public KV Interlock adapter observation failed: {last_error}")

          combined = bodies["page"] + "\n" + bodies["kv_client"]
          if "GITHUB_TOKEN" in combined or "TVC_EPHEMERAL_GITHUB_TOKEN" in combined or "document.cookie" in combined:
              raise SystemExit("forbidden authority/credential marker present in public projection")

          report = "\n".join([
              "GENERIC_LOGIN_KV_INTERLOCK_PUBLIC_OBSERVATION_PASS",
              "KV_INTERLOCK_REQUEST_SCHEMA_PUBLIC_PASS",
              "KV_INTERLOCK_RESPONSE_SCHEMA_PUBLIC_PASS",
              "KV_INTERLOCK_COMMIT_CANDIDATE_PUBLIC_PASS",
              "KV_INTERLOCK_FAIL_CLOSED_PUBLIC_PASS",
              "PRODUCTION_KV_CUSTODY_CLAIMED=false",
              "PRODUCTION_KV_RUNTIME_ACTIVATION_CLAIMED=false",
              "CREDENTIAL_AUTHORITY=TV/TVC",
              "AUTHORITY_EFFECT=NONE",
          ]) + "\n"

          receipt = {
              "schema": "stegverse.site.generic_login_kv_interlock_public_observation/v1",
              "page_url": targets["page"],
              "kv_client_url": targets["kv_client"],
              "source_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "observation_passed": True,
              "request_schema_observed": True,
              "response_schema_observed": True,
              "commit_candidate_observed": True,
              "fail_closed_not_provisioned_observed": True,
              "production_kv_custody_claimed": False,
              "production_kv_runtime_activation_claimed": False,
              "credential_authority": "TV/TVC",
              "credential_material_observed": False,
              "authority_effect": "NONE",
              "page_sha256": hashlib.sha256(bodies["page"].encode("utf-8")).hexdigest(),
              "kv_client_sha256": hashlib.sha256(bodies["kv_client"].encode("utf-8")).hexdigest(),
          }

          Path("reports").mkdir(exist_ok=True)
          Path("reports/generic-login-kv-interlock-public-observation.txt").write_text(report, encoding="utf-8")
          Path("reports/generic-login-kv-interlock-public-observation.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(report, end="")

      - name: Upload KV Interlock public observation receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: generic-login-kv-interlock-public-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/generic-login-kv-interlock-public-observation.txt
            reports/generic-login-kv-interlock-public-observation.json
          if-no-files-found: error
          retention-days: 30
