<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StegVerse Allocator Evidence Recovery — TASK-2026-0010 G6</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0b0d10;color:#f3f5f7}main{max-width:760px;margin:auto;padding:24px 18px 64px}.card{border:1px solid #2b3138;border-radius:14px;padding:16px;margin:16px 0;background:#12161b}.ok{color:#9fe6aa}.bad{color:#ffb4ab}.muted{color:#aeb7c2}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px 16px;font:inherit;font-weight:700}</style>
</head><body><main>
<h1>Allocator Evidence Recovery</h1>
<p class="muted">Read-only recovery from the established StegOS node journal. This page does not run the allocator or grant claims.</p>
<section class="card"><h2>Established node</h2><p id="node-state">Checking continuity…</p><code id="node-id"></code></section>
<section class="card"><h2>Recovered evidence</h2><p id="state" class="muted">Reading canonical local journal…</p><pre id="summary"></pre><button id="export" disabled>Export retained TASK-2026-0010 evidence</button></section>
<script src="./org-allocator-portable.js?v=recovery-task0010-g6-v1"></script>
<script>
(function(){"use strict";
var NODE_DB="stegos-web-bootstrap-v1",META="meta",RECEIPTS="receipts",NODE="node",DEVICE="device-continuity-root",EXPECTED_TASK="TASK-2026-0010";
var stateEl=document.getElementById("state"),summary=document.getElementById("summary"),exportBtn=document.getElementById("export"),nodeState=document.getElementById("node-state"),nodeIdEl=document.getElementById("node-id");
var recovered=null;
function openNodeDb(){return new Promise(function(ok,no){var q=indexedDB.open(NODE_DB);q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error||Error("node continuity database unavailable"))};q.onupgradeneeded=function(){try{q.transaction.abort()}catch(e){}no(Error("established node database not visible"))}})}
function readMeta(db,key){return new Promise(function(ok,no){var q=db.transaction(META,"readonly").objectStore(META).get(key);q.onsuccess=function(){ok(q.result?q.result.value:null)};q.onerror=function(){no(q.error)}})}
function readRows(db){return new Promise(function(ok,no){var q=db.transaction(RECEIPTS,"readonly").objectStore(RECEIPTS).getAll();q.onsuccess=function(){var rows=q.result||[];rows.sort(function(a,b){return a.sequence-b.sequence});ok(rows)};q.onerror=function(){no(q.error)}})}
function sha(v){return self.StegVersePortableOrgClaimAllocator.sha256Hex(v)}
function replay(rows){var prev=null,p=Promise.resolve();rows.forEach(function(row,i){p=p.then(function(){if(row.schema!=="stegos.web_bootstrap_journal_entry.v1"||row.sequence!==i+1||row.previous_entry_sha256!==prev)throw Error("node journal chain mismatch");return sha(row.receipt).then(function(h){if(h!==row.receipt_sha256)throw Error("node journal receipt hash mismatch");var copy={};Object.keys(row).forEach(function(k){if(k!=="entry_sha256")copy[k]=row[k]});return sha(copy)}).then(function(h){if(h!==row.entry_sha256)throw Error("node journal entry hash mismatch");prev=row.entry_sha256})})});return p.then(function(){return{state:"PASS",entries:rows.length,tail_sha256:prev}})}
function validateBinding(node,device,rows){if(!node||node.schema!=="stegos.web_node.v1"||node.host_origin!==location.origin||node.credential_authority!=="TV/TVC")throw Error("established node invalid");if(!device||device.schema!=="stegos.web_device_continuity_root.v1"||device.origin!==location.origin)throw Error("device continuity invalid");if(!rows.some(function(x){var r=x.receipt||{};return r.schema==="stegos.web_device_node_binding_receipt.v1"&&r.node_id===node.node_id&&r.device_continuity_id===device.device_continuity_id}))throw Error("node/device binding receipt missing")}
function recover(){return openNodeDb().then(function(db){return Promise.all([readMeta(db,NODE),readMeta(db,DEVICE),readRows(db)]).then(function(v){validateBinding(v[0],v[1],v[2]);return replay(v[2]).then(function(rep){nodeState.textContent="Continuity verified";nodeState.className="ok";nodeIdEl.textContent=v[0].node_id;var matches=v[2].filter(function(row){var r=row.receipt||{};return r.schema==="stegos.org_allocator_same_device_execution_receipt/v1"&&r.selected_task_id===EXPECTED_TASK&&r.canonical_allocator_receipt&&r.canonical_allocator_receipt.selected===EXPECTED_TASK&&r.claim_observation});if(!matches.length)throw Error("no retained TASK-2026-0010 allocator execution receipt found");var row=matches[matches.length-1],r=row.receipt;recovered={schema:"stegverse.device-org-allocator-recovered-evidence/v1",state:"RETAINED_CANONICAL_ALLOCATION_EVIDENCE_RECOVERED",selected_task_id:r.selected_task_id,claim_registry_generation:r.portable_claim_registry_generation,claim_observation:r.claim_observation,allocator_release:r.allocator_release,portable_package_source_binding:r.portable_package_source_binding,canonical_allocator_receipt:r.canonical_allocator_receipt,node_id:r.node_id,device_continuity_id:r.device_continuity_id,node_journal_entry:row,node_journal_replay:rep,recovery_surface:"IMMUTABLE_TASK0010_G6_V1",allocator_mutation_performed:false,authority_effect:"NONE_EVIDENCE_ONLY",recovered_at:new Date().toISOString()};stateEl.textContent="Retained TASK-2026-0010 allocation evidence recovered";stateEl.className="ok";summary.textContent=JSON.stringify({selected_task_id:recovered.selected_task_id,claim_registry_generation:recovered.claim_registry_generation,fencing_tokens:r.claim_observation.fencing_tokens||[],allocator_release:r.allocator_release,node_journal_tail:rep.tail_sha256,allocator_mutation_performed:false},null,2);exportBtn.disabled=false})})})}
function fail(e){stateEl.textContent="FAIL_CLOSED: "+e.message;stateEl.className="bad";summary.textContent=JSON.stringify({selected_task_id:EXPECTED_TASK,allocator_mutation_performed:false},null,2)}
function exportEvidence(){if(!recovered)return;var b=new Blob([JSON.stringify(recovered,null,2)+"\n"],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="stegverse-org-allocator-TASK-2026-0010-recovered.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
exportBtn.addEventListener("click",exportEvidence);recover().catch(fail);
}());
</script></main></body></html>
