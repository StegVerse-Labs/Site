<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StegSocials bounded-group runtime proof</title></head>
<body>
<main>
  <h1>StegSocials bounded-group runtime proof</h1>
  <p>This surface observes the existing registered Node/InTr → resident DEVICE_KV CAS path on this device. It does not create external InTr admission, publication authority, or credential authority.</p>
  <input id="casFile" type="file" accept="application/json,.json">
  <button id="runProof" type="button">Run exact runtime proof</button>
  <button id="saveProof" type="button" disabled>Save proof JSON</button>
  <pre id="status">READY_FOR_OWNER_SELECTED_CAS_REQUEST</pre>
</main>
<script src="assets/generated/site-browser-intr-connectors.js"></script>
<script src="assets/stegverse-hb-intr-carrier.js"></script>
<script src="assets/stegverse-node-continuity.js"></script>
<script src="assets/stegsocials-bounded-group-device-kv-cas-receiver.js"></script>
<script src="assets/my-kv-n-device-kv-receiver.js"></script>
<script src="assets/stegsocials-bounded-group-node-intr-bridge.js"></script>
<script src="assets/stegsocials-bounded-group-runtime-proof.js"></script>
<script>
(function(){
  var file=document.getElementById('casFile'),run=document.getElementById('runProof'),save=document.getElementById('saveProof'),status=document.getElementById('status'),last=null;
  run.addEventListener('click',function(){
    last=null;save.disabled=true;status.textContent='RUNNING_FAIL_CLOSED_RUNTIME_PROOF';
    var api=window.StegVerseStegSocialsBoundedGroupRuntimeProof;
    Promise.resolve().then(function(){if(!file.files||file.files.length!==1)throw new Error('Select exactly one CAS request JSON file');return api.parseFile(file.files[0]);}).then(api.run).then(function(proof){last=proof;status.textContent=JSON.stringify(proof,null,2);save.disabled=false;}).catch(function(error){status.textContent='FAIL_CLOSED\n'+String(error&&error.message||error);});
  });
  save.addEventListener('click',function(){if(last)window.StegVerseStegSocialsBoundedGroupRuntimeProof.downloadProof(last);});
}());
</script>
</body></html>
