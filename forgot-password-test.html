<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Test Password</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}.card{width:min(440px,92vw);padding:26px;border:1px solid #7776;border-radius:16px}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{width:100%;font:inherit;padding:12px;border-radius:9px;border:1px solid #7778;background:Canvas;color:CanvasText}button{margin-top:16px;font-weight:800}.status{margin:0 0 16px;font-weight:800}.testbox{margin-top:16px;padding:12px;border:1px dashed #7778;border-radius:9px}.small{font-size:.86rem;opacity:.7}</style></head><body><main class="card"><div id="status" class="status">RESET PASSWORD</div><section id="identify"><label>Username</label><input id="username" autocomplete="off"><label>Recovery method</label><select id="channel"><option value="">Select verified recovery method</option></select><button id="send" type="button">Send recovery code</button></section><section id="challenge" hidden><div id="delivery" class="testbox"></div><label>Recovery code</label><input id="code" inputmode="numeric"><button id="check" type="button">Verify code</button></section><section id="reset" hidden><label>New password</label><input id="new-password" type="password"><label>Confirm new password</label><input id="confirm-password" type="password"><button id="save" type="button">Reset password</button></section><p class="small">TEST_ONLY delivery: the recovery challenge is displayed here until a real email/SMS transport is attached. No claim is made that a message was sent.</p><p><a href="generic-login-test.html">Back to login</a></p></main><script>(()=>{'use strict';const KEY='stegverse.generic-login.accounts.v1';const status=document.getElementById('status'),challenge=document.getElementById('challenge'),reset=document.getElementById('reset'),delivery=document.getElementById('delivery'),usernameInput=document.getElementById('username'),channel=document.getElementById('channel');let pending=null;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(v){localStorage.setItem(KEY,JSON.stringify(v));}async function sha(v){const b=new TextEncoder().encode(String(v));const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('');}function normalize(raw){if(!raw)return null;const email=raw.email||(raw.recoveryType==='EMAIL'?raw.recoveryValue:'');const sms=raw.sms||(raw.recoveryType==='SMS'?raw.recoveryValue:'');return {...raw,email,sms,emailVerified:raw.emailVerified===true||(raw.recoveryType==='EMAIL'&&raw.recoveryVerified===true),smsVerified:raw.smsVerified===true||(raw.recoveryType==='SMS'&&raw.recoveryVerified===true)};}function refreshChannels(){const account=normalize(load()[usernameInput.value.trim()]);channel.innerHTML='<option value="">Select verified recovery method</option>';if(!account)return;if(account.emailVerified&&account.email){const o=document.createElement('option');o.value='EMAIL';o.textContent=`Email: ${account.email}`;channel.appendChild(o);}if(account.smsVerified&&account.sms){const o=document.createElement('option');o.value='SMS';o.textContent=`Text: ${account.sms}`;channel.appendChild(o);}}usernameInput.addEventListener('input',refreshChannels);const queryUser=new URLSearchParams(location.search).get('username');if(queryUser){usernameInput.value=queryUser;refreshChannels();}document.getElementById('send').addEventListener('click',()=>{const username=usernameInput.value.trim(),account=normalize(load()[username]),selected=channel.value;if(!account||!selected){status.textContent='FAILED';return;}const target=selected==='EMAIL'&&account.emailVerified?account.email:selected==='SMS'&&account.smsVerified?account.sms:'';if(!target){status.textContent='FAILED';return;}const code=String(Math.floor(100000+Math.random()*900000));pending={username,code,selected};delivery.textContent=`TEST_ONLY ${selected} challenge to ${target}: ${code}`;challenge.hidden=false;reset.hidden=true;status.textContent='CODE SENT';});document.getElementById('check').addEventListener('click',()=>{if(!pending||document.getElementById('code').value.trim()!==pending.code){status.textContent='FAILED';return;}reset.hidden=false;status.textContent='AUTHORIZED TO RESET';});document.getElementById('save').addEventListener('click',async()=>{if(!pending||reset.hidden){status.textContent='FAILED';return;}const a=document.getElementById('new-password').value,b=document.getElementById('confirm-password').value;if(!a||a!==b){status.textContent='FAILED';return;}const accounts=load();if(!accounts[pending.username]){status.textContent='FAILED';return;}accounts[pending.username].passwordDigest=await sha(a);save(accounts);document.getElementById('new-password').value='';document.getElementById('confirm-password').value='';document.getElementById('code').value='';pending=null;status.textContent='PASSWORD RESET';});})();</script></body></html>
