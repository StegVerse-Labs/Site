<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    (function enforceSecureRuntimeContext() {
      if (location.protocol !== "http:") return;
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return;
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }());
  </script>
  <meta name="description" content="StegVerse Ecosystem Chat — ask a question and enter your personal or organizational KnowledgeVault when needed.">
  <title>StegVerse</title>
  <link rel="stylesheet" href="sv-shared.css">
  <style>
    .home{max-width:820px;margin:0 auto;padding:24px 16px 64px}
    .home-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 22px}
    .home-brand{font-weight:800;color:var(--text);text-decoration:none;font-size:1.05rem}
    .kv-links{display:flex;gap:14px;align-items:center}
    .kv-links a{color:var(--muted);text-decoration:none;font-size:.94rem}
    .kv-links a:hover,.kv-links a:focus{color:var(--text)}
    .intro{padding:28px 0 10px}
    .intro h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.04;margin:0 0 10px}
    .intro p{margin:0;color:var(--muted);font-size:1rem}
    .starter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
    .starter{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:14px;text-align:left;font:inherit;cursor:pointer;min-height:76px}
    .starter:hover,.starter:focus{border-color:var(--border2);background:#111a29}
    .chat-panel{border:1px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden}
    .chat-log{min-height:340px;max-height:58vh;overflow:auto;padding:16px;display:grid;gap:12px;background:#0b1220}
    .chat-message{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.5;white-space:pre-wrap}
    .chat-message.system{justify-self:start;background:#172033}
    .chat-message.user{justify-self:end;background:#1d4475}
    .composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--border);background:#0c1320}
    .composer textarea{flex:1;min-height:52px;max-height:150px;resize:vertical;border:1px solid var(--border2);border-radius:13px;background:#080d16;color:var(--text);font:inherit;padding:12px}
    .composer button{align-self:flex-end}
    .composer-tools{display:flex;align-items:center;gap:8px}
    .attachment-label{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:10px;padding:8px 10px;color:var(--muted);cursor:pointer;font-size:.84rem}
    .attachment-label input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
    .attachment-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.78rem}
    .privacy-note{font-size:.8rem;color:var(--muted);margin:10px 3px 0}
    .node-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 3px 12px}
    .node-status-row .privacy-note{margin:0;flex:1 1 360px}
    .node-status-row .sv-btn{flex:0 0 auto}
    @media(max-width:700px){
      .starter-grid{grid-template-columns:1fr}
      .home{padding-top:10px}
      .composer{flex-direction:column}
      .composer button{width:100%}
      .chat-message{max-width:94%}
      .home-nav{align-items:flex-start}
      .kv-links{gap:10px;flex-wrap:wrap;justify-content:flex-end}
    }
  </style>
</head>
<body>
  <main class="home">
    <nav class="home-nav" aria-label="StegVerse">
      <a class="home-brand" href="index.html">StegVerse</a>
      <div class="kv-links">
        <a href="my-kv.html">My KV</a>
        <a href="organizational-kv.html">Organizational KV</a>
        <a href="workspace.html">Workspace</a>
        <a href="news-releases.html">Current News Releases</a>
      </div>
    </nav>

    <section class="intro">
      <h1>How can I help?</h1>
      <p>Ask in your own words.</p>
    </section>

    <section class="starter-grid" aria-label="Example questions">
      <button class="starter" type="button" data-chat-prompt="How do I use this chat?">How do I use this chat?</button>
      <button class="starter" type="button" data-chat-prompt="What is StegVerse?">What is StegVerse?</button>
      <button class="starter" type="button" data-chat-prompt="What is My KV?">What is My KV?</button>
    </section>

    <div class="node-status-row">
      <p id="node-llm-status" class="privacy-note" role="status" aria-live="polite">Checking StegVerse Node status…</p>
      <button id="node-register-device" class="sv-btn sv-btn-secondary" type="button" hidden>Register this device</button>
    </div>
    <section class="chat-panel" aria-label="Ecosystem Chat">
      <div class="chat-log" id="chatLog" aria-live="polite">
        <div class="chat-message system"><div class="body">Tell me what you need help with.</div></div>
      </div>
      <form class="composer" id="chatForm">
        <label class="sr-only" for="messageInput">Your question</label>
        <textarea id="messageInput" name="message" placeholder="Type your question…"></textarea>
        <div class="composer-tools">
          <label class="attachment-label" for="mathImageInput">Add image
            <input id="mathImageInput" name="math_image" type="file" accept="image/png,image/jpeg,image/webp,image/heif,image/heic">
          </label>
          <span class="attachment-name" id="mathImageName" aria-live="polite"></span>
          <button class="sv-btn sv-btn-primary" type="submit">Send</button>
        </div>
      </form>
    </section>

    <p class="privacy-note">Don’t enter passwords, security codes, private keys, or other account credentials here.</p>
  </main>

  <script src="assets/stegverse-node-continuity.js"></script>
  <script src="assets/semantic-command-router.js"></script>
  <script src="assets/ecosystem-chat-semantic-commands.js"></script>
  <script src="assets/ecosystem-chat-va-runtime.js"></script>
  <script src="assets/ecosystem-chat-simple.js"></script>
</body>
</html>
