<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StegVerse Demo</title>
<style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:900px;margin:40px auto;padding:0 20px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px}textarea{min-height:260px}.muted{color:#a8b8cc}</style>
</head>
<body>
<h1>StegVerse Demo</h1>
<p class="muted">This demo has no hosted-provider default. Supply the API origin admitted by the current StegVerse runtime composition.</p>
<label for="api">Backend URL</label>
<input id="api" value="" placeholder="Admitted StegVerse API origin">
<label for="data">Data Capture Window</label>
<textarea id="data">{"source":"manual_sample","commit_states":[[0.1,0.1,0.1],[0.2,0.2,0.2]],"proposed_state":[0.15,0.15,0.15]}</textarea>
<button id="evaluate">Evaluate</button>
<pre id="result">Awaiting evaluation.</pre>
<script>
document.getElementById('evaluate').addEventListener('click', async () => {
  const out = document.getElementById('result');
  const api = document.getElementById('api').value.trim().replace(/\/$/, '');
  if (!api) { out.textContent = 'FAIL-CLOSED: no admitted StegVerse API origin supplied.'; return; }
  let payload;
  try { payload = JSON.parse(document.getElementById('data').value); }
  catch { out.textContent = 'FAIL-CLOSED: invalid JSON.'; return; }
  try {
    const response = await fetch(api + '/v1/demo/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const body = await response.json();
    out.textContent = JSON.stringify(body, null, 2);
  } catch (error) {
    out.textContent = 'FAIL-CLOSED: ' + String(error);
  }
});
</script>
</body>
</html>
